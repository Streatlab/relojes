name: Platos de Just Eat (sinqro panel líneas)

# Trae los pedidos y las LÍNEAS de producto de Just Eat por los informes del
# panel de Sinqro (pos.sinqro.com está bloqueado desde servidores desde el 2-ago).
# Cada 20 min: los informes tardan y no hace falta más frecuencia para el detalle.
# palanca: 1
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sinqro-panel-lineas.yml"

jobs:
  lineas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Candado por horario de configuración del ERP
        id: candado
        env:
          SB_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "seguir=1" >> $GITHUB_OUTPUT; exit 0; fi
          DOW=$(TZ=Europe/Madrid date +%u); H=$(TZ=Europe/Madrid date +%H); M=$(TZ=Europe/Madrid date +%M)
          AHORA=$((10#$H*60+10#$M))
          FILA=$(curl -sf "$SB_URL/rest/v1/horario_local?dia_semana=eq.$DOW&select=abre,cierra,cerrado" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" || echo '[]')
          ABRE=$(echo "$FILA" | jq -r '.[0].abre // empty' | cut -c1-5)
          CIERRA=$(echo "$FILA" | jq -r '.[0].cierra // empty' | cut -c1-5)
          if [ -z "$ABRE" ] || [ -z "$CIERRA" ]; then ABRE="11:00"; CIERRA="00:00"; fi
          A=$((10#${ABRE%%:*}*60+10#${ABRE##*:})); C=$((10#${CIERRA%%:*}*60+10#${CIERRA##*:}))
          C=$(( (C + 60) % 1440 ))
          dentro=0
          if [ "$A" -le "$C" ]; then
            if [ "$AHORA" -ge "$A" ] && [ "$AHORA" -lt "$C" ]; then dentro=1; fi
          else
            if [ "$AHORA" -ge "$A" ] || [ "$AHORA" -lt "$C" ]; then dentro=1; fi
          fi
          echo "seguir=$dentro" >> $GITHUB_OUTPUT
          echo "Madrid $H:$M · horario $ABRE-$CIERRA(+60) · seguir=$dentro"
      - uses: actions/checkout@v4
        if: steps.candado.outputs.seguir == '1'
        with:
          repository: Streatlab/binagre
          ref: trabajo
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        if: steps.candado.outputs.seguir == '1'
        with:
          node-version: "20"
          cache: "npm"
      - name: Instalar dependencias
        if: steps.candado.outputs.seguir == '1'
        run: npm install --no-audit --no-fund
      - name: Cache navegador Playwright
        id: cache-playwright
        if: steps.candado.outputs.seguir == '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Instalar navegador Playwright
        if: steps.candado.outputs.seguir == '1' && steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Deps de sistema (con caché)
        if: steps.candado.outputs.seguir == '1' && steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Credenciales Sinqro desde el ERP
        if: steps.candado.outputs.seguir == '1'
        env:
          SB_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          R=$(curl -sf "$SB_URL/rest/v1/robot_credenciales?plataforma=eq.sinqro&activo=eq.true&select=usuario,password&limit=1" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY")
          U=$(echo "$R" | jq -r '.[0].usuario'); P=$(echo "$R" | jq -r '.[0].password')
          echo "::add-mask::$P"
          echo "SINQRO_USER=$U" >> $GITHUB_ENV
          echo "SINQRO_PASS=$P" >> $GITHUB_ENV
      - name: Pedidos y líneas de Just Eat desde el panel
        if: steps.candado.outputs.seguir == '1'
        env:
          SUPABASE_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DIAS_ATRAS: "10"
        run: npx tsx scripts/robot-ingesta/sinqro-panel-lineas.ts
