name: Gate binagre@trabajo (npm run build completo)

# 25-sep-2026 · Gate de calidad del ERP en la nube: ejecuta EXACTAMENTE el build de
# Vercel (candados de funciones/Marco Polo/Sinqro + vitest + tsc app + tsc api + vite)
# sobre la rama trabajo, sin tocar Vercel ni gastar builds. El resultado (y el final
# del registro si falla) se escribe en robot_salud (fuente gate_binagre).
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/gate-binagre.yml"

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Streatlab/binagre
          ref: trabajo
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar + build completo (igual que Vercel)
        id: gate
        continue-on-error: true
        run: |
          set -o pipefail
          ( npm install --no-audit --no-fund && npm run build ) > /tmp/b.txt 2>&1
      - name: Publicar resultado en robot_salud
        if: always()
        env:
          SB_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          tail -n 60 /tmp/b.txt || true
          if [ "${{ steps.gate.outcome }}" = "success" ]; then ESTADO=ok; DET="build completo OK"; else
            ESTADO=error
            DET="FALLA: $( (grep -E 'error TS|FAIL|Error:|ERR!|✗|×|failed' /tmp/b.txt | head -n 8; echo '--- final:'; tail -n 12 /tmp/b.txt) | cut -c1-220 | tr '\n' '|' | head -c 1800)"
          fi
          SHA=$(git rev-parse --short HEAD)
          jq -n --arg f gate_binagre --arg e "$ESTADO" --arg d "trabajo@$SHA · $DET" --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '[{fuente:$f, estado:$e, detalle:$d, ultima_ejecucion:$t, ultimo_dato:$t}]' > /tmp/body.json
          curl -sS -X POST "$SB_URL/rest/v1/robot_salud?on_conflict=fuente" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" -H "Content-Type: application/json" -H "Prefer: resolution=merge-duplicates" --data @/tmp/body.json
          [ "$ESTADO" = "ok" ]
