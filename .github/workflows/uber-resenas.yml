name: Uber · reseñas (diario)

# 16-oct-2026 · Rubén autorizó (tren revisa-ley-de-netos-cody). Lee la pantalla de reseñas
# del Manager de Uber con la sesión sembrada, por la vía de uber-pantallas (que sí entra;
# Informes/Pagos dan reto de Cloudflare). Una pasada al día, fuera de servicio.
# Primera pasada: lanzar a mano y mirar robot_log fuente uber_pantallas, estados
# ruta_resenas / ruta_resenas_descartada.

on:
  workflow_dispatch:
  schedule:
    - cron: "40 8 * * *"   # 10:40 Madrid (verano) / 09:40 (invierno)

jobs:
  resenas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Jitter humano (minuto de arranque aleatorio)
        if: github.event_name == 'schedule'
        run: sleep $(( RANDOM % 601 ))
      - uses: actions/checkout@v4
        with:
          repository: Streatlab/binagre
          ref: trabajo
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Cache navegador Playwright
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Instalar navegador Playwright
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Dependencias de sistema (con cache)
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Pantalla virtual (xvfb) para headful
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Capturar la pantalla de reseñas
        env:
          UBER_SOLO: resenas
          SUPABASE_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: xvfb-run -a npx tsx scripts/robot-ingesta/uber-pantallas.ts
