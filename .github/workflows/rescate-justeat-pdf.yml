name: Rescate Just Eat por PDF (puntual)

# 05-ago-2026 · Vuelca facturas JE ya archivadas (PDF en Storage/Drive) cuyo
# resumen nunca llegó a ventas_plataforma. Corre al hacer push o a mano.
# corrida: 2 (parser corregido: balance negativo + marca desde texto de PDF)
on:
  push:
    paths:
      - ".github/workflows/rescate-justeat-pdf.yml"
  workflow_dispatch:

jobs:
  rescate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Streatlab/binagre
          ref: trabajo
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm install --no-audit --no-fund
      - name: Volcar facturas JE archivadas a ventas_plataforma
        env:
          SUPABASE_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
        run: npx tsx scripts/robot-ingesta/rescate-justeat-pdf.ts
