name: Robot Listo (Rushour · ventana del horario del ERP)

# MUDADO desde Streatlab/binagre (02-ago): reloj público, código privado.
# Marca "En preparación" y "Listo" cuando a cocina se le olvida.
# Un job de GitHub no puede durar más de 6h → relevos diarios; solaparse es
# inofensivo (un pedido ya marcado no se re-marca).
#
# ══════════════════════════════════════════════════════════════════════════
# 31-ago-2026 · BLINDAJE DEL HORARIO (orden de Rubén).
#
# LO QUE PASÓ: lunes 31, local ABIERTO 12:00-16:15 y 20:00-23:45. El robot no
# marcó nada en todo el mediodía. Dos causas encadenadas:
#   1) el lector de Glovo solo pasó UNA vez (03:05 Madrid) de las seis que le
#      tocaban antes de mediodía, y a esa hora el portal aún tenía el lunes
#      como CERRADO. Nadie volvió a mirar, así que el ERP se quedó con un dato
#      viejo y falso todo el día;
#   2) este turno leía la VENTANA de `horario_local` — la tabla SEMANAL, ya
#      derogada — mientras el script leía `horario_dia`. Dos verdades distintas
#      en el mismo job.
#
# ARREGLO: el paso Plan lee `horario_dia` de HOY, la misma tabla que manda para
# todos los robots, y respeta los tramos partidos. Si no hay fila de hoy, el
# turno NO arranca y lo canta (`job_sin_horario_rushour`): sin horario no se
# trabaja, no se inventa una ventana por defecto.
#
# Y `concurrency`: un solo turno vivo a la vez. Así se pueden poner todos los
# crons de respaldo que haga falta sin que se junten cinco robots pulsando.
# ══════════════════════════════════════════════════════════════════════════
#
# ══════════════════════════════════════════════════════════════════════════
# 14-ago-2026 · FRENTE SINQRO ELIMINADO por requerimiento formal de Sinqro
# (cese de toda automatización sobre su panel, arts. 197 bis y 264 bis CP).
# PROHIBIDO volver a añadir "sinqro" a la matriz sin acuerdo escrito con
# Sinqro. Cocina marca "Listo" a mano en Sinqro hasta tener alternativa
# (Lymon / mecanismo autorizado).
# ══════════════════════════════════════════════════════════════════════════
#
# 15-ago-2026 · FIX AGUJERO DE RELOJ: los crons eran 08:20/12:20/16:20/20:20
# UTC = 10:20 Madrid el primero, ANTES de que abriera la ventana → el arranque
# moría en "fuera_de_ventana" y nadie pulsaba listo en el pico de comida.
#
# ══════════════════════════════════════════════════════════════════════════
# 22-ago-2026 · EL MISMO AGUJERO DE RELOJ, OTRA VEZ, Y ESTA VEZ COSTÓ EL
# SERVICIO ENTERO. Rubén: 16 pedidos, el robot no pulsó NI UNO, todo a mano.
# CAUSA RAÍZ: el relevo arrancó a las 11:28 Madrid, la ventana abría a las
# 11:30, escribió "fuera de ventana" y se murió en el acto; el siguiente no
# entraba hasta las 15:45. ARREGLO: el robot ya no muere por llegar pronto,
# ESPERA a que abra (paso "Esperar a que abra el local"). NO tocar los crons
# para "compensar": la espera es la que blinda esto.
# ══════════════════════════════════════════════════════════════════════════
#
# ══════════════════════════════════════════════════════════════════════════
# 29-ago-2026 (2) · EL TURNO SE MURIÓ MUDO AL ABRIR EL LOCAL. URGENTE.
#
# Medido: el turno de las 08:32 Madrid escribió `barrido_rushour` cada ~90 s
# sin fallo hasta las 11:25 y a partir de ahí NO VOLVIÓ A ESCRIBIR NADA — ni
# `fin_turno`, ni `error`, ni el latido. Murió justo cuando abría el local
# (11:30) y empezaban a entrar pedidos. Con el tablero vacío funcionaba; con
# pedidos delante, se calló.
#
# Lo que cambió esa mañana fue el recorrido del carril virtual que se metió
# ese mismo día (`filasConBoton` / `filaDePedido` bajando tramo a tramo con
# `PASOS_CARRIL`). Es el único código nuevo que solo se ejecuta de verdad
# cuando HAY filas con botón, que es exactamente el momento en que se murió.
# No está demostrado, pero es el sospechoso y el servicio no se para a
# investigar: con `PASOS_CARRIL=0` ese recorrido no se ejecuta y la lectura
# vuelve a ser la de ayer, sin tocar el listo por API ni nada más.
#
# CÓMO SE QUITA: cuando el turno aguante un servicio completo, subir
# PASOS_CARRIL a 25 en un día tranquilo y vigilar el log. Si vuelve a morirse
# mudo, el problema está confirmado y hay que arreglar el recorrido (o poner
# un tope de tiempo dentro de `filasConBoton`), no volver a bajarlo y ya.
#
# palanca: 15 (29-ago · PASOS_CARRIL=0 y relevo inmediato)
# ══════════════════════════════════════════════════════════════════════════
#
# ══════════════════════════════════════════════════════════════════════════
# 30-ago-2026 · DOMINGO SIN ROBOT Y SIN RASTRO. Los relevos de las 08:50 y
# 11:05 Madrid no dejaron NI UNA línea en robot_log: ni inicio, ni fuera de
# ventana, ni error. Si un job muere antes de llegar al script (npm, Playwright,
# credenciales, o simplemente GitHub no lo arranca) nadie se entera hasta que
# cocina ve que nadie marca listo. Igual que ya se hizo en el turno de Sinqro:
# LATIDO DE ARRANQUE en robot_log como primer paso, antes de instalar nada, y
# cada paso previo al script apunta si falla. Un turno que no arranca tiene
# que cantar; si no hay `job_arranca_rushour`, es que GitHub no lo lanzó.
#
# palanca: 16 (30-ago · latido de arranque + relevo inmediato)
#
# 30-ago-2026 (2) · CRONS DE RESPALDO + VUELTA MÁS CORTA. Dos relevos seguidos
# sin arrancar el mismo día = GitHub no siempre lanza el cron. Ahora cada relevo
# tiene un segundo cron 25 min después; si el primero entró, el segundo se solapa
# y no pasa nada (un pedido marcado no se re-marca). Y la vuelta del bucle baja
# a 60-95 s (medido a mediodía: 778F2 marcado a los 247 s, porque entre el
# umbral y la vuelta siguiente se iban hasta 143 s de más). Sigue por encima de
# los 60 s que exige la ley de buen ciudadano.
#
# palanca: 17 (30-ago · crons de respaldo + vuelta 60-95 s)
# palanca: 18 (31-ago · ventana desde horario_dia + concurrency + más respaldos)
# palanca: 19 (31-ago · relevo encadenado por API: el servicio deja de depender del cron)
# ══════════════════════════════════════════════════════════════════════════
#
# ══════════════════════════════════════════════════════════════════════════
# 29-ago-2026 · LOS PEDIDOS SIN BOTÓN NO SE MARCABAN NUNCA (Rubén: "el pedido
# siempre está en el tablero; son excusas del robot"). Medido 26-28 ago:
# 44 × fuera_de_pantalla_rushour, 9 × sin_boton_rushour, y anoche D905D y
# 5F655 se quedaron sin marcar. El listo por API FUNCIONA (pulsado_rushour
# "listo por API, estado confirmado en el historial"), pero solo se intentaba
# sobre pedidos a los que el robot les había encontrado el botón en el DOM.
# Si no encontraba el botón, el pedido no entraba en la cola y no se
# intentaba ni por API: se quedaba mirando.
#
# ARREGLO (paso "Parche 29-ago"): todo pedido de Uber que la API da pendiente
# entra en la cola con su misma cadencia (59-181 s desde orderedAt) y se marca
# POR API aunque no se le vea botón. El parche se aplica sobre el checkout de
# binagre@trabajo al arrancar (mismo mecanismo que cancelados-cobro), se
# comprueba la sintaxis con esbuild y, si algo no casa, se restaura el
# original: el robot nunca arranca con un archivo roto. Cuando el cambio esté
# integrado en el repo (el archivo ya contenga `soloApi`), el paso no hace nada.
# ══════════════════════════════════════════════════════════════════════════
#
# 02-ago (2) · ADIÓS CORREOS "Run failed" DEL LISTO. El robot vigila hasta que
# se agota su presupuesto de tiempo (MAX_MIN_JOB) y entonces termina a
# propósito para pasar el relevo. Ese final controlado NO marca la corrida
# como fallida (continue-on-error). Correo de fallo = avería de verdad.
#
# RITMO RUSHOUR (21-ago-2026 · MISION-cadencia-robots): CADENCIA HUMANA.
# La vuelta del bucle se sortea DE NUEVO EN CADA VUELTA (BUCLE_MIN/BUCLE_MAX).
# Antes era 20 s fijos: un reloj perfecto cada 20 s es la firma de un robot.
# NO bajar el rango por debajo de 60 s ni volver a un valor fijo. Si aparecen
# fallos de sesión o `sin_efecto_rushour` en cadena, subir el rango (p. ej.
# 120-240) antes de tocar nada más.
#
# Rushour cuenta desde `orderedAt` (hora de entrada real que da la API).
#
# PALANCA por push: tocar este archivo lanza un relevo YA en modo servicio.
on:
  schedule:
    # 06:50 UTC = 08:50 Madrid. Hace falta un job DESPIERTO antes de las 9:00
    # para que el adelanto de 3 h del script sirva de algo: el barrido empieza
    # a las 9:00 aunque el local abra a las 12:00 (petición de Rubén). Sin este
    # cron, el primero entraba a las 11:05 y el adelanto no lo veía nadie.
    - cron: "50 6 * * *"
    - cron: "5 9 * * *"
    - cron: "45 13 * * *"
    - cron: "25 18 * * *"
    - cron: "5 23 * * *"
    # RESPALDO (30-ago): 25 min después de cada relevo, por si GitHub no lanza
    # el primero. Solaparse es inofensivo.
    - cron: "15 7 * * *"
    - cron: "30 9 * * *"
    - cron: "10 14 * * *"
    - cron: "50 18 * * *"
    - cron: "30 23 * * *"
    # RESPALDO 31-ago: el lunes 31 NINGÚN cron de mañana entró y el mediodía se
    # quedó sin robot. Con `concurrency` solo puede haber un turno vivo, así que
    # ahora se llama a la puerta cada hora durante todo el servicio: el que
    # sobra se queda esperando o se descarta, no se junta con el que trabaja.
    - cron: "0 8,10,11,12,15,16,17,20,21 * * *"
  push:
    paths:
      - ".github/workflows/sinqro-listo.yml"
  workflow_dispatch:
    inputs:
      modo:
        description: "reconocimiento (volcar DOM, no toca nada) | simulacro | servicio"
        type: choice
        options: ["reconocimiento", "simulacro", "servicio"]
        default: "reconocimiento"
      frente:
        description: "rushour"
        type: choice
        options: ["rushour"]
        default: "rushour"
      ventana:
        description: "Ventana HH:MM-HH:MM (vacío = horario del ERP)"
        type: string
        default: ""

# UN SOLO TURNO VIVO (31-ago). Si ya hay uno trabajando, el nuevo espera su
# turno en la puerta en vez de ponerse a pulsar en paralelo. GitHub solo guarda
# UN pendiente por grupo, así que tampoco se acumula una cola.
concurrency:
  group: robot-listo-rushour
  cancel-in-progress: false

jobs:
  listo:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    strategy:
      fail-fast: false
      matrix:
        frente: ["rushour"]
    env:
      SB_URL: https://eryauogxcpbgdryeimdq.supabase.co
      SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      # LATIDO DE ARRANQUE (30-ago): primera línea del turno, antes de nada.
      # Con heredoc entrecomillado y `|| true`: el chivato nunca tumba el job.
      - name: Latido de arranque
        run: |
          # Marca de arranque: la usa el encadenado del final para saber cuánto
          # ha durado el turno (y no encadenar en bucle si murió pronto).
          date -u +%s > /tmp/t0
          cat > /tmp/apunta.sh <<'SH'
          apunta() {
            jq -n --arg e "$1" --arg d "$2" \
              '{fuente:"robot_listo",estado:$e,detalle:$d}' \
            | curl -s -X POST "$SB_URL/rest/v1/robot_log" \
                -H "apikey: $SB_KEY" \
                -H "Authorization: Bearer $SB_KEY" \
                -H "Content-Type: application/json" \
                --data-binary @- > /dev/null || true
          }
          SH
          chmod +x /tmp/apunta.sh
          source /tmp/apunta.sh
          apunta "job_arranca_rushour" "turno de Rushour arrancado en GitHub ($(TZ=Europe/Madrid date '+%H:%M') Madrid, evento ${{ github.event_name }}) · aún sin instalar nada · palanca 19"

      # ── LA VENTANA SALE DE `horario_dia`, LA MISMA QUE LEE EL SCRIPT ──────
      # 31-ago: antes esto leía `horario_local` (semanal, derogada). Un job no
      # puede tener una verdad distinta de la del script que lanza.
      - name: Plan (ventana desde horario_dia del ERP)
        id: plan
        run: |
          source /tmp/apunta.sh
          HOY=$(TZ=Europe/Madrid date +%F)
          FILA=$(curl -sf "$SB_URL/rest/v1/horario_dia?fecha=eq.$HOY&select=cerrado,tramos" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" || echo '')
          HAY=$(echo "$FILA" | jq -r 'length // 0')
          CERRADO=$(echo "$FILA" | jq -r '.[0].cerrado // false')
          ABRE=$(echo "$FILA" | jq -r '.[0].tramos[0].abre // empty' | cut -c1-5)
          CIERRA=$(echo "$FILA" | jq -r '.[0].tramos[-1].cierra // empty' | cut -c1-5)

          # SIN HORARIO DE HOY NO SE TRABAJA. No se inventa una ventana por
          # defecto: el lector de Glovo pasa doce veces al día y, si falla,
          # avisa a Rubén por correo para que lo meta a mano.
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            if [ "$HAY" = "0" ] || [ -z "$ABRE" ] || [ -z "$CIERRA" ]; then
              echo "seguir=0" >> $GITHUB_OUTPUT
              apunta "job_sin_horario_rushour" "no hay horario_dia de $HOY: no arranco (el lector de Glovo tiene que escribirlo o lo mete Rubén a mano)"
              exit 0
            fi
            if [ "$CERRADO" = "true" ]; then
              echo "seguir=0" >> $GITHUB_OUTPUT
              apunta "job_cerrado_rushour" "$HOY marcado CERRADO en horario_dia, no arranco"
              exit 0
            fi
          fi
          if [ -z "$ABRE" ] || [ -z "$CIERRA" ]; then ABRE="12:00"; CIERRA="23:45"; fi

          C=$((10#${CIERRA%%:*}*60+10#${CIERRA##*:})); C=$(( (C + 30) % 1440 ))
          CIERRA_G=$(printf "%02d:%02d" $((C/60)) $((C%60)))
          VENTANA_ERP="$ABRE-$CIERRA_G"
          # Lo lee el encadenado del final: si ya ha cerrado, no llama a nadie.
          echo "cierre=$CIERRA_G" >> $GITHUB_OUTPUT

          # ── LLEGAR PRONTO NO PUEDE MATAR AL ROBOT (22-ago) ──────────────
          AHORA=$(TZ=Europe/Madrid date +%H:%M)
          MIN_ABRE=$((10#${ABRE%%:*}*60+10#${ABRE##*:}))
          MIN_AHORA=$((10#${AHORA%%:*}*60+10#${AHORA##*:}))
          # EL ADELANTO MANDA SOBRE LA ESPERA. El script empieza a barrer 180
          # min antes de que abra el local (ADELANTO_APERTURA_MIN en
          # sinqro-listo.ts, solo frente Rushour). Si aquí se durmiera hasta la
          # hora de abrir, el adelanto no serviría de nada.
          MIN_ABRE=$(( MIN_ABRE - 180 ))
          if [ "$MIN_ABRE" -lt 0 ]; then MIN_ABRE=0; fi
          ESPERA=0
          if [ "$MIN_AHORA" -lt "$MIN_ABRE" ]; then
            ESPERA=$(( (MIN_ABRE - MIN_AHORA) * 60 + 90 ))   # +90s de colchón
          fi
          # Tope 2h30: más que eso no es "he llegado pronto", es un arranque
          # que no corresponde a este turno. Mejor terminar que dormir medio día.
          if [ "$ESPERA" -gt 9000 ]; then ESPERA=0; fi
          echo "espera=$ESPERA" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            F="${{ github.event.inputs.frente }}"
            if [ "$F" != "ambos" ] && [ "$F" != "${{ matrix.frente }}" ]; then
              echo "seguir=0" >> $GITHUB_OUTPUT; exit 0
            fi
            echo "seguir=1" >> $GITHUB_OUTPUT
            echo "modo=${{ github.event.inputs.modo }}" >> $GITHUB_OUTPUT
            V="${{ github.event.inputs.ventana }}"
            if [ -z "$V" ]; then V="$VENTANA_ERP"; fi
            echo "ventana=$V" >> $GITHUB_OUTPUT
          else
            echo "seguir=1" >> $GITHUB_OUTPUT
            echo "modo=servicio" >> $GITHUB_OUTPUT
            echo "ventana=$VENTANA_ERP" >> $GITHUB_OUTPUT
          fi
          apunta "job_ventana_rushour" "$HOY · ventana $VENTANA_ERP (de horario_dia) · ahora $AHORA Madrid · espera ${ESPERA}s"
          echo "Ventana usada: $VENTANA_ERP · ahora $AHORA Madrid · espera ${ESPERA}s antes de arrancar"

      - uses: actions/checkout@v4
        if: steps.plan.outputs.seguir == '1'
        with:
          repository: Streatlab/binagre
          ref: trabajo
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        if: steps.plan.outputs.seguir == '1'
        with:
          node-version: "20"
          cache: "npm"
      - name: Instalar dependencias
        if: steps.plan.outputs.seguir == '1'
        run: |
          source /tmp/apunta.sh
          npm install --no-audit --no-fund > npm.log 2>&1 || { apunta "job_ko_rushour" "npm install ha fallado · $(tail -c 600 npm.log)"; cat npm.log; exit 1; }

      # ── PARCHE 29-ago · LISTO POR API A LOS PENDIENTES SIN BOTÓN ──────────
      # Ver la cabecera. Se aplica sobre el checkout, se comprueba la sintaxis
      # y si algo no casa se restaura el original. Nunca arranca un archivo roto.
      - name: Parche 29-ago · listo por API a los pendientes sin botón
        if: steps.plan.outputs.seguir == '1'
        run: |
          cat > /tmp/parche-29ago.mjs <<'EOF'
          import fs from 'node:fs';
          const f = 'scripts/robot-ingesta/sinqro-listo.ts';
          let s = fs.readFileSync(f, 'utf8');
          if (s.includes('soloApi')) { console.log('parche 29-ago: ya integrado en el repo, nada que hacer'); process.exit(0); }
          const reps = [
            [
              'interface PendienteRushour { clave: string; codigo: string; fila: Locator; desde: number; deLaApi: boolean }',
              'interface PendienteRushour { clave: string; codigo: string; fila: Locator; desde: number; deLaApi: boolean; soloApi?: boolean }',
            ],
            [
              '  if (!elegibles.length) return;\n\n  // REGLA 2: primero el más antiguo.\n  elegibles.sort((a, b) => a.desde - b.desde);',
              [
                '  // PARCHE 29-ago (Rubén): un pedido de Uber que la API da pendiente y al que',
                '  // no se le ha encontrado botón en pantalla NO se queda mirando: entra en la',
                '  // cola con su misma cadencia (59-181 s desde orderedAt) y se marca por API.',
                '  for (const v of barrido.pendientesApi) {',
                '    const codigoApi = String(v.displayId || v.id || \'?\').toUpperCase();',
                '    if (codigoApi === \'?\' || marcados.has(codigoApi) || marcadosOk.has(codigoApi)) continue;',
                '    if (barrido.lista.some((p) => p.codigo.toUpperCase() === codigoApi)) continue;',
                '    if (!vistos.has(codigoApi)) vistos.set(codigoApi, ahora);',
                '    if (!umbrales.has(codigoApi)) umbrales.set(codigoApi, umbralListoMs());',
                '    const entradaApi = v.orderedAt ? Date.parse(v.orderedAt) : NaN;',
                '    const desdeApi = Number.isFinite(entradaApi) ? entradaApi : (vistos.get(codigoApi) || ahora);',
                '    if (ahora - desdeApi < (umbrales.get(codigoApi) as number)) continue;',
                '    elegibles.push({ clave: codigoApi, codigo: codigoApi, fila: page.locator(\'body\'), desde: desdeApi, deLaApi: Number.isFinite(entradaApi), soloApi: true });',
                '  }',
                '  if (!elegibles.length) return;',
                '',
                '  // REGLA 2: primero el más antiguo.',
                '  elegibles.sort((a, b) => a.desde - b.desde);',
              ].join('\n'),
            ],
            [
              '      if (RE_NUNCA.test(textoAhora) || !textoAhora.toUpperCase().includes(p.codigo.toUpperCase())) {',
              '      if (!p.soloApi && (RE_NUNCA.test(textoAhora) || !textoAhora.toUpperCase().includes(p.codigo.toUpperCase()))) {',
            ],
            [
              '    // Mientras no haya plantilla, el clic de abajo es quien la enseña: se\n',
              [
                '    // PARCHE 29-ago: sin botón en pantalla no hay clic de respaldo. Si la API',
                '    // no lo ha marcado, se reintenta en la vuelta siguiente, no se pulsa a ciegas.',
                '    if (p.soloApi) {',
                '      await log(P, \'sin_boton_api_pendiente\', \'rushour \' + p.codigo + \': pendiente según la API, sin botón en pantalla y la API no lo ha marcado (\' + porApi.motivo + \') · se reintenta en la vuelta siguiente\');',
                '      continue;',
                '    }',
                '    // Mientras no haya plantilla, el clic de abajo es quien la enseña: se',
                '',
              ].join('\n'),
            ],
          ];
          for (const [a, b] of reps) {
            if (!s.includes(a)) { console.log('parche 29-ago: ANCLA NO ENCONTRADA, no se toca el archivo: ' + JSON.stringify(a.slice(0, 70))); process.exit(0); }
            s = s.replace(a, b);
          }
          fs.writeFileSync(f, s);
          console.log('parche 29-ago: aplicado');
          EOF
          node /tmp/parche-29ago.mjs
          if ! npx esbuild scripts/robot-ingesta/sinqro-listo.ts --format=esm --log-level=error > /dev/null; then
            echo "::warning::parche 29-ago rompe la sintaxis: se restaura el original"
            git checkout -- scripts/robot-ingesta/sinqro-listo.ts
          fi

      - name: Cache navegador Playwright
        id: cache-playwright
        if: steps.plan.outputs.seguir == '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Instalar navegador Playwright
        if: steps.plan.outputs.seguir == '1' && steps.cache-playwright.outputs.cache-hit != 'true'
        run: |
          source /tmp/apunta.sh
          npx playwright install --with-deps chromium > pw.log 2>&1 || { apunta "job_ko_rushour" "no se instala Chromium de Playwright · $(tail -c 600 pw.log)"; cat pw.log; exit 1; }
      - name: Dependencias de sistema (con cache)
        if: steps.plan.outputs.seguir == '1' && steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Pantalla virtual (xvfb)
        if: steps.plan.outputs.seguir == '1'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Credenciales desde el ERP
        if: steps.plan.outputs.seguir == '1'
        run: |
          for PL in rushour; do
            R=$(curl -sf "$SB_URL/rest/v1/robot_credenciales?plataforma=eq.$PL&activo=eq.true&select=usuario,password&limit=1" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY")
            # `// empty` NO SE PUEDE QUITAR. Sin el, `jq -r` sobre un resultado vacio
            # devuelve el TEXTO "null", que es truthy y viaja hasta el formulario de
            # la plataforma como si fuera un usuario.
            U=$(echo "$R" | jq -r '.[0].usuario // empty'); P=$(echo "$R" | jq -r '.[0].password // empty')
            echo "::add-mask::$P"
            if [ -z "$U" ] || [ -z "$P" ]; then
              source /tmp/apunta.sh; apunta "job_ko_rushour" "sin credencial ACTIVA de $PL en robot_credenciales (revisa activo)"
              echo "::error::No hay credencial ACTIVA de $PL en robot_credenciales (revisa activo)."
              exit 1
            fi
            PU=$(echo "$PL" | tr '[:lower:]' '[:upper:]')
            echo "${PU}_USER=$U" >> $GITHUB_ENV
            echo "${PU}_PASS=$P" >> $GITHUB_ENV
          done

      # EL ROBOT ESPERA A QUE ABRA EL LOCAL EN VEZ DE MORIRSE (22-ago).
      - name: Esperar a que abra el local
        if: steps.plan.outputs.seguir == '1' && steps.plan.outputs.espera != '0'
        run: |
          echo "El local aún no ha abierto. Espero ${{ steps.plan.outputs.espera }}s y arranco con la ventana abierta."
          sleep ${{ steps.plan.outputs.espera }}

      # continue-on-error: el fin de turno por presupuesto de tiempo es normal y
      # esperado (pasa el relevo al siguiente arranque). No es una avería y no
      # debe generar correo de "Run failed". Las averías reales quedan en
      # robot_log y las canta el vigilante.
      - name: Vigilar y marcar
        if: steps.plan.outputs.seguir == '1'
        continue-on-error: true
        env:
          MODO: ${{ steps.plan.outputs.modo }}
          FRENTE: ${{ matrix.frente }}
          # 31-ago (Rubén, orden literal): umbral ALEATORIO entre 0 y 31 s desde
          # que el pedido ENTRA, DISTINTO en cada pedido. Cada pedido sortea SU
          # umbral la primera vez que se ve (`umbralListoMs()`). Sustituye al
          # rango 59-181 s del 28-ago. LISTO_TRAS_SEG queda solo de respaldo si
          # alguien borra el rango.
          LISTO_TRAS_MIN: "0"
          LISTO_TRAS_MAX: "31"
          LISTO_TRAS_SEG: "120"
          # 01-sep (Rubén): vuelta de 2 a 3 min (antes 60-95 s). La ronda es
          # donde se marca de verdad —el umbral solo prohíbe tocar antes—, así
          # que subirla es lo que aleja el "listo" de la entrada del pedido.
          BUCLE_MIN: "120"
          BUCLE_MAX: "180"
          # Respaldo: SOLO se usa si alguien borra BUCLE_MIN/BUCLE_MAX.
          BUCLE_SEG: "20"
          # 29-ago (2) · FRENO DEL RECORRIDO DEL CARRIL. Ver la cabecera: el
          # turno se murió mudo a las 11:25, al abrir el local, y el recorrido
          # tramo a tramo del carril virtual es el único código nuevo que solo
          # corre cuando hay filas con botón. Con 0, `filasConBoton` y
          # `filaDePedido` leen lo que hay en pantalla y no bajan por el carril:
          # es la lectura de ayer, que aguantaba el servicio entero.
          # NO subirlo sin vigilar el log ese mismo día.
          PASOS_CARRIL: "0"
          MAX_MIN_JOB: "290"
          SITIO: "STREAT LAB"
          SUPABASE_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          source /tmp/apunta.sh
          apunta "job_lanza_rushour" "todo instalado, arranca el script ($(TZ=Europe/Madrid date '+%H:%M') Madrid) · modo=$MODO"
          xvfb-run -a npx tsx scripts/robot-ingesta/sinqro-listo.ts

      # ══════════════════════════════════════════════════════════════════════
      # EL RELEVO NO DEPENDE DE UN CRON (31-ago). Mismo mecanismo que ya tenía
      # Sinqro: este turno llama al siguiente por la API de GitHub, y una orden
      # directa (`workflow_dispatch`) SE EJECUTA SIEMPRE — no es un cron, no se
      # descarta. Con esto, el cron solo hace falta para el PRIMER turno del día.
      #
      # POR QUÉ SE PONE HOY: el lunes 31 el cron de las 20:25 (el que recogía la
      # cena, con el local abierto desde las 20:00) no se disparó. Ni ese, ni el
      # del vigilante, que también es un cron y se calló con el resto. De 19:11 a
      # 20:47 no hubo NADIE marcando y hubo que lanzarlo a mano.
      #
      # GUARDA ANTI-BUCLE, IMPRESCINDIBLE: solo se encadena si el turno ha durado
      # MÁS DE 30 MINUTOS. Si murió antes (sesión, credencial, avería), encadenar
      # sería relanzarlo cada dos minutos. En ese caso se apunta el motivo y que
      # lo recoja el vigilante.
      # ══════════════════════════════════════════════════════════════════════
      - name: Encadenar el siguiente turno
        if: always() && steps.plan.outputs.seguir == '1'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -uo pipefail
          source /tmp/apunta.sh
          T0=$(cat /tmp/t0 2>/dev/null || echo 0)
          DUR=$(( ( $(date -u +%s) - T0 ) / 60 ))
          AHORA=$(TZ=Europe/Madrid date +%H:%M)
          m() { echo $((10#${1%%:*}*60+10#${1##*:})); }
          MIN_AHORA=$(m "$AHORA")
          MIN_CIERRA=$(m "${{ steps.plan.outputs.cierre }}")
          [ "$MIN_CIERRA" -lt 300 ] && MIN_CIERRA=$((MIN_CIERRA+1440))

          if [ "$DUR" -lt 30 ]; then
            apunta "relevo_no_encadenado_rushour" "el turno solo ha durado ${DUR} min: no encadeno (sería relanzar en bucle). Que lo recoja el vigilante."
            exit 0
          fi
          if [ "$MIN_AHORA" -ge "$MIN_CIERRA" ]; then
            apunta "fin_dia_rushour" "turno de ${DUR} min terminado a las $AHORA, ya fuera de servicio: no encadeno"
            exit 0
          fi
          COD=$(curl -s -o /tmp/d.txt -w '%{http_code}' -X POST \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/sinqro-listo.yml/dispatches" \
            -H "Authorization: Bearer $GH_PAT" -H "Accept: application/vnd.github+json" \
            -d '{"ref":"main","inputs":{"modo":"servicio","frente":"rushour","ventana":""}}')
          if [ "$COD" = "204" ]; then
            apunta "relevo_encadenado_rushour" "turno de ${DUR} min terminado a las $AHORA · siguiente turno llamado a mano por la API, sin depender del cron"
          else
            apunta "relevo_encadenado_ko_rushour" "NO he podido llamar al siguiente turno (GitHub responde $COD): $(head -c 200 /tmp/d.txt) · quedan el cron y el vigilante"
          fi
