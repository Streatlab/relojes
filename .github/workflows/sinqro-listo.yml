name: Robot Listo (Rushour · ventana del horario del ERP)

# MUDADO desde Streatlab/binagre (02-ago): reloj público, código privado.
# Marca "En preparación" y "Listo" cuando a cocina se le olvida.
# La VENTANA ya no va a fuego: se calcula de horario_local (abre → cierra+30).
# Un job de GitHub no puede durar más de 6h → relevos diarios; solaparse es
# inofensivo (un pedido ya marcado no se re-marca).
#
# ══════════════════════════════════════════════════════════════════════════
# 14-ago-2026 · FRENTE SINQRO ELIMINADO por requerimiento formal de Sinqro
# (cese de toda automatización sobre su panel, arts. 197 bis y 264 bis CP).
# PROHIBIDO volver a añadir "sinqro" a la matriz sin acuerdo escrito con
# Sinqro. Cocina marca "Listo" a mano en Sinqro hasta tener alternativa
# (Lymon / mecanismo autorizado).
# ══════════════════════════════════════════════════════════════════════════
#
# 15-ago-2026 · FIX AGUJERO DE RELOJ (no relacionado con Sinqro, venía de
# antes): los crons eran 08:20/12:20/16:20/20:20 UTC = 10:20 Madrid el
# primero, ANTES de que abra la ventana (11:00) → el arranque moría en
# "fuera_de_ventana" y nadie pulsaba listo entre 11:00 y 14:20 Madrid, el
# pico de comida entero. Ahora el primer relevo entra a las 11:05 Madrid y
# los siguientes encadenan con el presupuesto de 290 min (4h50):
#   09:05 UTC → 11:05 Madrid  (cubre 11:05→15:55)
#   13:45 UTC → 15:45 Madrid  (cubre 15:45→20:35)
#   18:25 UTC → 20:25 Madrid  (cubre 20:25→01:15)
#   23:05 UTC → 01:05 Madrid  (cubre 01:05→02:00, cierre)
# En horario de invierno todo cae 1h antes en hora local; sigue habiendo
# solape de sobra en cada tramo.
#
# ══════════════════════════════════════════════════════════════════════════
# 22-ago-2026 · EL MISMO AGUJERO DE RELOJ, OTRA VEZ, Y ESTA VEZ COSTÓ EL
# SERVICIO ENTERO. Rubén: 16 pedidos, el robot no pulsó NI UNO, todo a mano.
#
# CAUSA RAÍZ, medida en robot_log: el relevo de las 09:05 UTC arrancó y a las
# 09:28:29 UTC escribió "fuera de ventana" y SE MURIÓ EN EL ACTO.
#   09:28 UTC = 11:28 Madrid.  La ventana del ERP abría a las 11:30 Madrid.
# Le faltaron DOS MINUTOS. El robot no espera: mira el reloj, ve que aún no
# ha abierto, escribe el latido y termina. El siguiente relevo no entra hasta
# las 13:45 UTC = 15:45 Madrid.
#
# Resultado: RUSHOUR SIN ROBOT DE 11:05 A 15:45 MADRID — el pico de comida
# completo, que es justo cuando entraron todos los pedidos de Uber del día.
# Por eso "nunca llegó a darle a ningún botón": no había nadie mirando.
# (El frente de Sinqro se salvó por pura suerte: su job tardó 9 minutos más
# en arrancar, a las 09:37 UTC = 11:37 Madrid, y pilló la ventana ya abierta.)
#
# El fix del 15-ago daba por hecho que la ventana abría a las 11:00 y puso el
# cron a las 11:05 Madrid, con 5 minutos de margen. El horario del local se
# movió a las 11:30 y ese margen se evaporó. Encadenar crons a mano contra un
# horario que vive en la base de datos es una carrera que se pierde sola.
#
# ARREGLO: el robot YA NO MUERE POR LLEGAR PRONTO. Si arranca antes de la
# apertura, calcula cuánto falta y ESPERA (paso "Esperar a que abra"), de modo
# que el script se lanza con la ventana ya abierta. Tope de 2h30 de espera:
# más que eso no es "he llegado pronto", es un arranque que no toca.
# NO tocar los crons para "compensar": la espera es la que blinda esto,
# vengan los crons cuando vengan y esté el horario donde esté.
# ══════════════════════════════════════════════════════════════════════════
#
# 02-ago (2) · ADIÓS CORREOS "Run failed" DEL LISTO. El robot vigila hasta que
# se agota su presupuesto de tiempo (MAX_MIN_JOB) y entonces termina a
# propósito para pasar el relevo. Ese final controlado NO marca la corrida
# como fallida (continue-on-error). Correo de fallo = avería de verdad.
#
# RITMO RUSHOUR (21-ago-2026 · MISION-cadencia-robots): CADENCIA HUMANA.
# Espera antes de marcar 31 s y la vuelta del bucle se sortea DE NUEVO EN CADA
# VUELTA entre 67 y 143 s (BUCLE_MIN/BUCLE_MAX). Antes era 0 s y 20 s fijos: un
# reloj perfecto cada 20 s es la firma de un robot. Ahora ningún intervalo se
# repite y de paso baja la presión sobre la sesión (Cognito Advanced Security;
# el 01-ago la sesión cayó 289 veces seguidas con la vuelta de 20 s).
# NO bajar el rango por debajo de 60 s ni volver a un valor fijo.
# Si aparecen fallos de sesión o `sin_efecto_rushour` en cadena, subir el rango
# (p. ej. 120-240) antes de tocar nada más.
#
# Rushour cuenta desde `orderedAt` (hora de entrada real que da la API).
#
# PALANCA por push: tocar este archivo lanza un relevo YA en modo servicio.
# palanca: 12 (22-ago · el robot espera a que abra en vez de morirse)
on:
  schedule:
    - cron: "5 9 * * *"
    - cron: "45 13 * * *"
    - cron: "25 18 * * *"
    - cron: "5 23 * * *"
  push:
    paths:
      - ".github/workflows/sinqro-listo.yml"
  workflow_dispatch:
    inputs:
      modo:
        description: "reconocimiento (volcar DOM, no toca nada) | simulacro | servicio"
        type: choice
        options: ["reconocimiento", "simulacro", "servicio"]
        default: "reconocimiento"
      frente:
        description: "rushour"
        type: choice
        options: ["rushour"]
        default: "rushour"
      ventana:
        description: "Ventana HH:MM-HH:MM (vacío = horario del ERP)"
        type: string
        default: ""

jobs:
  listo:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    strategy:
      fail-fast: false
      matrix:
        frente: ["rushour"]
    steps:
      - name: Plan (ventana desde horario_local del ERP)
        id: plan
        env:
          SB_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          DOW=$(TZ=Europe/Madrid date +%u)
          FILA=$(curl -sf "$SB_URL/rest/v1/horario_local?dia_semana=eq.$DOW&select=abre,cierra,cerrado" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" || echo '')
          ABRE=$(echo "$FILA" | jq -r '.[0].abre // empty' | cut -c1-5)
          CIERRA=$(echo "$FILA" | jq -r '.[0].cierra // empty' | cut -c1-5)
          CERRADO=$(echo "$FILA" | jq -r '.[0].cerrado // false')
          if [ -z "$ABRE" ] || [ -z "$CIERRA" ]; then ABRE="11:00"; CIERRA="00:00"; CERRADO="false"; fi
          C=$((10#${CIERRA%%:*}*60+10#${CIERRA##*:})); C=$(( (C + 30) % 1440 ))
          CIERRA_G=$(printf "%02d:%02d" $((C/60)) $((C%60)))
          VENTANA_ERP="$ABRE-$CIERRA_G"

          # ── LLEGAR PRONTO NO PUEDE MATAR AL ROBOT (22-ago) ──────────────
          # El script se apaga solo si arranca fuera de ventana. El 22-ago
          # arrancó a las 11:28 Madrid con apertura a las 11:30 y se murió por
          # dos minutos, dejando el pico de comida entero sin nadie mirando.
          # Aquí se calcula cuánto falta para abrir y el paso de abajo espera,
          # así el script se lanza SIEMPRE con la ventana ya abierta.
          AHORA=$(TZ=Europe/Madrid date +%H:%M)
          MIN_ABRE=$((10#${ABRE%%:*}*60+10#${ABRE##*:}))
          MIN_AHORA=$((10#${AHORA%%:*}*60+10#${AHORA##*:}))
          ESPERA=0
          if [ "$MIN_AHORA" -lt "$MIN_ABRE" ]; then
            ESPERA=$(( (MIN_ABRE - MIN_AHORA) * 60 + 90 ))   # +90s de colchón
          fi
          # Tope 2h30: más que eso no es "he llegado pronto", es un arranque
          # que no corresponde a este turno. Mejor terminar que dormir medio día.
          if [ "$ESPERA" -gt 9000 ]; then ESPERA=0; fi
          echo "espera=$ESPERA" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            F="${{ github.event.inputs.frente }}"
            if [ "$F" != "ambos" ] && [ "$F" != "${{ matrix.frente }}" ]; then
              echo "seguir=0" >> $GITHUB_OUTPUT; exit 0
            fi
            echo "seguir=1" >> $GITHUB_OUTPUT
            echo "modo=${{ github.event.inputs.modo }}" >> $GITHUB_OUTPUT
            V="${{ github.event.inputs.ventana }}"
            if [ -z "$V" ]; then V="$VENTANA_ERP"; fi
            echo "ventana=$V" >> $GITHUB_OUTPUT
          else
            if [ "$CERRADO" = "true" ]; then echo "seguir=0" >> $GITHUB_OUTPUT; echo "Hoy cerrado según configuración"; exit 0; fi
            echo "seguir=1" >> $GITHUB_OUTPUT
            echo "modo=servicio" >> $GITHUB_OUTPUT
            echo "ventana=$VENTANA_ERP" >> $GITHUB_OUTPUT
          fi
          echo "Ventana usada: $VENTANA_ERP · ahora $AHORA Madrid · espera ${ESPERA}s antes de arrancar"

      - uses: actions/checkout@v4
        if: steps.plan.outputs.seguir == '1'
        with:
          repository: Streatlab/binagre
          ref: trabajo
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        if: steps.plan.outputs.seguir == '1'
        with:
          node-version: "20"
          cache: "npm"
      - name: Instalar dependencias
        if: steps.plan.outputs.seguir == '1'
        run: npm install --no-audit --no-fund
      - name: Cache navegador Playwright
        id: cache-playwright
        if: steps.plan.outputs.seguir == '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Instalar navegador Playwright
        if: steps.plan.outputs.seguir == '1' && steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Dependencias de sistema (con cache)
        if: steps.plan.outputs.seguir == '1' && steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Pantalla virtual (xvfb)
        if: steps.plan.outputs.seguir == '1'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Credenciales desde el ERP
        if: steps.plan.outputs.seguir == '1'
        env:
          SB_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          for PL in rushour; do
            R=$(curl -sf "$SB_URL/rest/v1/robot_credenciales?plataforma=eq.$PL&activo=eq.true&select=usuario,password&limit=1" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY")
            # `// empty` NO SE PUEDE QUITAR. Sin el, `jq -r` sobre un resultado vacio
            # devuelve el TEXTO "null", que es truthy y viaja hasta el formulario de
            # la plataforma como si fuera un usuario. Le paso al frente de Sinqro el
            # 21-ago (fila con activo=false, 110 logins con basura). Aqui no ha pasado
            # todavia, y no va a pasar: sin credencial la corrida se para en rojo.
            U=$(echo "$R" | jq -r '.[0].usuario // empty'); P=$(echo "$R" | jq -r '.[0].password // empty')
            echo "::add-mask::$P"
            if [ -z "$U" ] || [ -z "$P" ]; then
              echo "::error::No hay credencial ACTIVA de $PL en robot_credenciales (revisa activo)."
              exit 1
            fi
            PU=$(echo "$PL" | tr '[:lower:]' '[:upper:]')
            echo "${PU}_USER=$U" >> $GITHUB_ENV
            echo "${PU}_PASS=$P" >> $GITHUB_ENV
          done

      # EL ROBOT ESPERA A QUE ABRA EL LOCAL EN VEZ DE MORIRSE (22-ago).
      # Va DESPUÉS de instalar todo a propósito: mientras se instalan node,
      # Playwright y Chromium ya se está consumiendo parte de la espera, así
      # que el sueño real es más corto que el calculado.
      - name: Esperar a que abra el local
        if: steps.plan.outputs.seguir == '1' && steps.plan.outputs.espera != '0'
        run: |
          echo "El local aún no ha abierto. Espero ${{ steps.plan.outputs.espera }}s y arranco con la ventana abierta."
          sleep ${{ steps.plan.outputs.espera }}

      # continue-on-error: el fin de turno por presupuesto de tiempo es normal y
      # esperado (pasa el relevo al siguiente arranque). No es una avería y no
      # debe generar correo de "Run failed". Las averías reales quedan en
      # robot_log y las canta el vigilante.
      - name: Vigilar y marcar
        if: steps.plan.outputs.seguir == '1'
        continue-on-error: true
        env:
          MODO: ${{ steps.plan.outputs.modo }}
          FRENTE: ${{ matrix.frente }}
          LISTO_TRAS_SEG: "31"
          BUCLE_MIN: "67"
          BUCLE_MAX: "143"
          # Respaldo: SOLO se usa si alguien borra BUCLE_MIN/BUCLE_MAX.
          # Mientras el rango esté puesto, este 20 NO manda.
          BUCLE_SEG: "20"
          MAX_MIN_JOB: "290"
          SITIO: "STREAT LAB"
          SUPABASE_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: xvfb-run -a npx tsx scripts/robot-ingesta/sinqro-listo.ts
