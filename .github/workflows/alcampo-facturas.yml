name: Alcampo facturas (registrar pedidos, solicitar factura y recogerla del correo)

# 04-oct-2026 · Rubén: cada pedido a Alcampo queda "pendiente de factura" en Hoy;
# cuando Alcampo lo marca ENTREGADO, el robot solicita la factura solo; cuando la
# factura llega a admin@streatlab.com, el robot la mete en Facturas y cierra el pedido.
# 05-oct: un pedido CANCELADO por Alcampo (web o correo «Pedido Cancelado» a dirección) pasa a
# 'cancelado' y no se vuelve a mirar; fechas sin año y refresco del importe del pedido abierto.
# 05-oct (tarde): el correo de admin pasa por el FILTRO DE ROBOTS (proveedor aprobado en `terceros`).
# Código: Streatlab/binagre@trabajo scripts/robot-alcampo-facturas/robot.ts (+ correo.ts, correoPedidos.ts)
# Horario: UNA pasada al día, 23:05 Madrid (21:05 UTC). Rubén, 22-oct-2026: «solo cada 24 horas»
# (antes cada 4 h; antes cada 2 h). Palanca = push sobre este archivo.
# SIMULACRO_PUSH "1" → la corrida por push lo hace todo menos pulsar el botón final.
# palanca: 8 (una pasada al día)

env:
  SIMULACRO_PUSH: "0"

on:
  workflow_dispatch:
    inputs:
      simulacro:
        type: choice
        options: ["0", "1"]
        default: "0"
      desde:
        description: "ALCAMPO_DESDE (AAAA-MM-DD) para pasada retroactiva; vacio = normal"
        required: false
        default: ""
      forzar_web:
        type: choice
        options: ["0", "1"]
        default: "0"
      max_solicitudes:
        description: "ALCAMPO_MAX_SOLICITUDES (tope de solicitudes de factura por pasada; vacio = 6)"
        required: false
        default: ""
  push:
    paths:
      - ".github/workflows/alcampo-facturas.yml"
  schedule:
    - cron: "5 21 * * *"

jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Streatlab/binagre
          ref: trabajo
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Cache navegador Playwright
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Instalar navegador Playwright
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Dependencias de sistema (con cache)
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Pantalla virtual
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Pedidos y facturas de Alcampo
        env:
          HEADFUL: "1"
          SIMULACRO: ${{ github.event_name == 'push' && env.SIMULACRO_PUSH || github.event.inputs.simulacro || '0' }}
          # 21-oct-2026 · Rubén: rescate retroactivo de todas las facturas de Alcampo (solo por workflow_dispatch).
          ALCAMPO_DESDE: ${{ github.event.inputs.desde || '' }}
          FORZAR_WEB: ${{ github.event.inputs.forzar_web || '0' }}
          ALCAMPO_MAX_SOLICITUDES: ${{ github.event.inputs.max_solicitudes || '' }}
          SUPABASE_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: xvfb-run -a npx tsx scripts/robot-alcampo-facturas/robot.ts
