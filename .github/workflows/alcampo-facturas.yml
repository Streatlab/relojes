name: Alcampo facturas (registrar pedidos, solicitar factura y recogerla del correo)

# 04-oct-2026 · Rubén: cada pedido a Alcampo queda "pendiente de factura" en Hoy;
# cuando Alcampo lo marca ENTREGADO, el robot solicita la factura solo; cuando la
# factura llega a admin@streatlab.com, el robot la mete en Facturas y cierra el pedido.
# 05-oct: un pedido CANCELADO por Alcampo pasa a 'cancelado' y no se vuelve a mirar;
# fechas sin año («lun. 05 oct.») y refresco del importe del pedido abierto.
# Código: Streatlab/binagre@trabajo scripts/robot-alcampo-facturas/robot.ts (+ correo.ts)
# Horario: cada 2 h de 09:00 a 23:00 Madrid. Palanca = push sobre este archivo.
# SIMULACRO_PUSH "1" → la corrida por push lo hace todo menos pulsar el botón final.
# palanca: 4 (fechas sin año + refresco de importe)

env:
  SIMULACRO_PUSH: "0"

on:
  workflow_dispatch:
    inputs:
      simulacro:
        type: choice
        options: ["0", "1"]
        default: "0"
  push:
    paths:
      - ".github/workflows/alcampo-facturas.yml"
  schedule:
    - cron: "5 7-21/2 * * *"

jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Streatlab/binagre
          ref: trabajo
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Cache navegador Playwright
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Instalar navegador Playwright
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Dependencias de sistema (con cache)
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Pantalla virtual
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Pedidos y facturas de Alcampo
        env:
          HEADFUL: "1"
          SIMULACRO: ${{ github.event_name == 'push' && env.SIMULACRO_PUSH || github.event.inputs.simulacro || '0' }}
          SUPABASE_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: xvfb-run -a npx tsx scripts/robot-alcampo-facturas/robot.ts
