name: Glovo · valoraciones (Reseñas)

# 12-ago-2026 · Ampliación glovo-verdad-total. Lee la pestaña «Reseñas» del
# portal (pulgar arriba/abajo por pedido + resumen por marca) y la guarda en
# glovo_valoraciones / glovo_valoraciones_resumen. Escrito sobre la estructura
# real que encontró glovo-valoraciones-sonda.yml, no adivinada. Mismo patrón
# headful+xvfb que robots-plataformas.yml (PerimeterX lo pide).

on:
  workflow_dispatch:
    inputs:
      cuenta:
        description: "Nombre de la cuenta (vacío = todas las activas)"
        type: string
        required: false

jobs:
  valoraciones:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Streatlab/binagre
          ref: trabajo
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Cache navegador Playwright
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Instalar navegador Playwright
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Dependencias de sistema (con cache)
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Pantalla virtual (xvfb) para headful
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Leer valoraciones
        env:
          SUPABASE_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CUENTA: ${{ github.event.inputs.cuenta }}
        run: xvfb-run -a npx tsx scripts/robot-ingesta/glovo-valoraciones.ts
