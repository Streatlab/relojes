name: Espía portal Mercadona (manual)

# Solo lectura: entra en el portal cliente de Mercadona con las cuentas de
# robot_credenciales (plataforma mercadona_portal), mira dónde están las
# facturas y lo deja en robot_log / robot_debug. NO descarga ni modifica nada.
# Se lanza solo al subir este fichero y a mano cuando haga falta.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/mercadona-portal-espia.yml"

jobs:
  espia:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Streatlab/binagre
          ref: trabajo
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Cache navegador Playwright
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Instalar navegador Playwright
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Dependencias de sistema (con cache)
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Pantalla virtual (xvfb)
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Espiar portal Mercadona
        env:
          SUPABASE_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: xvfb-run -a npx tsx scripts/robot-ingesta/mercadona-portal-espia.ts
