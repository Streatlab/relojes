name: Copia propia + OCR de fotos de tickets (Historial de pedidos)

# 25-sep-2026 · Las fotos del ticket viven en Drive con links que caducan. Este reloj
# guarda una copia propia (Storage del ERP, 30 días) para que el Historial de pedidos
# las enseñe siempre, les pasa OCR con Tesseract (gratis, aquí sí funciona; en Vercel
# no) y enlaza cada foto con su pedido por el código impreso en el ticket.
# Cada 15 min en horario del ERP (+60 min de gracia) + una pasada de madrugada:
# sin llave de Google, la foto se copia desde su miniatura temporal, que dura horas.
# Si algo falla antes de que el script informe, el final del registro va a robot_salud.
on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "25 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/tickets-snapshot.yml"

concurrency:
  group: tickets-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Candado por horario de configuración del ERP
        id: candado
        env:
          SB_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ github.event.schedule }}" = "25 5 * * *" ]; then echo "seguir=1" >> $GITHUB_OUTPUT; exit 0; fi
          DOW=$(TZ=Europe/Madrid date +%u); H=$(TZ=Europe/Madrid date +%H); M=$(TZ=Europe/Madrid date +%M)
          AHORA=$((10#$H*60+10#$M))
          FILA=$(curl -sf "$SB_URL/rest/v1/horario_local?dia_semana=eq.$DOW&select=abre,cierra,cerrado" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" || echo '[]')
          ABRE=$(echo "$FILA" | jq -r '.[0].abre // empty' | cut -c1-5)
          CIERRA=$(echo "$FILA" | jq -r '.[0].cierra // empty' | cut -c1-5)
          CERRADO=$(echo "$FILA" | jq -r '.[0].cerrado // false')
          if [ -z "$ABRE" ] || [ -z "$CIERRA" ]; then ABRE="11:00"; CIERRA="00:00"; CERRADO="false"; fi
          if [ "$CERRADO" = "true" ]; then echo "seguir=0" >> $GITHUB_OUTPUT; exit 0; fi
          A=$((10#${ABRE%%:*}*60+10#${ABRE##*:})); C=$((10#${CIERRA%%:*}*60+10#${CIERRA##*:}))
          C=$(( (C + 60) % 1440 ))
          dentro=0
          if [ "$A" -le "$C" ]; then
            if [ "$AHORA" -ge "$A" ] && [ "$AHORA" -lt "$C" ]; then dentro=1; fi
          else
            if [ "$AHORA" -ge "$A" ] || [ "$AHORA" -lt "$C" ]; then dentro=1; fi
          fi
          echo "seguir=$dentro" >> $GITHUB_OUTPUT
          echo "Madrid $H:$M · horario $ABRE-$CIERRA(+60) · seguir=$dentro"

      - uses: actions/checkout@v4
        if: steps.candado.outputs.seguir == '1'
        with:
          repository: Streatlab/binagre
          ref: trabajo
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        if: steps.candado.outputs.seguir == '1'
        with:
          node-version: "20"
      - name: Instalar, copiar, leer y enlazar fotos
        id: robot
        if: steps.candado.outputs.seguir == '1'
        env:
          SUPABASE_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TICKETS_SNAPSHOT_LOTE: ${{ github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *' && '60' || '200' }}
        run: |
          set -o pipefail
          ( sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa \
            && npm install --no-audit --no-fund \
            && npx tsx scripts/robot-ingesta/tickets-snapshot.ts ) > /tmp/log.txt 2>&1
      - name: Informar fallo
        if: failure() && steps.robot.outcome == 'failure'
        env:
          SB_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          tail -n 60 /tmp/log.txt || true
          DET="FALLO RELOJ: $(tail -n 15 /tmp/log.txt | cut -c1-200 | tr '\n' '|' | head -c 1800)"
          jq -n --arg d "$DET" --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '[{fuente:"tickets_snapshot", estado:"error", detalle:$d, ultima_ejecucion:$t, ultimo_dato:$t}]' > /tmp/body.json
          curl -sS -X POST "$SB_URL/rest/v1/robot_salud?on_conflict=fuente" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" -H "Content-Type: application/json" -H "Prefer: resolution=merge-duplicates" --data @/tmp/body.json
