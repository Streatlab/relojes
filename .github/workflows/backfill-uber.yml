name: Backfill Uber por mes (manual)

# 10-ago-2026 · Petición de Rubén: comprobar si el histórico desde enero está
# completo. imports_log confirma que el robot nunca corrió antes de julio —
# todo enero-junio en ventas_plataforma viene de subida manual, incompleto.
# Este workflow dispara MODO=backfill MES=<input> del robot Uber (resumen
# mensual de pagos por marca + facturas) para rellenar mes a mes.
# Corre aquí (público, gratis): binagre agotó su presupuesto de Actions.
on:
  workflow_dispatch:
    inputs:
      mes:
        description: "Mes a rellenar, formato AAAA-MM"
        required: true

jobs:
  uber:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Streatlab/binagre
          ref: claude/uber-just-eat-downloads-bp8ket
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm install --no-audit --no-fund
      - name: Cache navegador Playwright
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Instalar navegador Playwright
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Dependencias de sistema (con cache)
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Pantalla virtual (xvfb) para headful
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Robot Uber (backfill del mes)
        env:
          MODO: backfill
          MES: ${{ inputs.mes }}
          SUPABASE_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: xvfb-run -a npx tsx scripts/robot-ingesta/uber.ts
