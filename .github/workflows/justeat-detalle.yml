name: Just Eat · detalle de pedidos (historial)

# Robot de detalle de pedidos propios de Just Eat (Partner Hub). Lee el Historial,
# abre cada pedido nuevo y guarda líneas/totales/hora/marca en justeat_pedidos +
# justeat_pedido_lineas. NO toca la facturación oficial (liquidación quincenal).
# LEY DE RELOJES + LEY BUEN CIUDADANO (freno de caudal + jitter dentro del script).
#
# ══════════════════════════════════════════════════════════════════════════
# 29-ago-2026 · VUELVE A LA NUBE. NO ERA LA IP, ERA EL NAVEGADOR.
#
# El 28-ago se apagó este schedule dando por hecho que el Cloudflare de Just Eat
# bloqueaba las IPs de Azure/GitHub, y el robot se mudó al PC de Rubén. El 29-ago
# se midió con tres sondas (justeat-diagnostico.yml) y salió lo contrario: desde
# la MISMA IP de GitHub Actions, Camoufox (Firefox con la huella parcheada) pasó
# el challenge y llegó a partner-hub.just-eat.es/home — 200, sin Turnstile y sin
# ningún código 10xx. Lo que Cloudflare detectaba era el Chromium headless de
# Playwright, no la IP. Lo confirma el último fallo del robot viejo (28-ago
# 19:42): `bloqueo_waf · desafío Cloudflare no resuelto en 75s (UA Chrome 141)`.
#
# Este job levanta un servidor de Camoufox y le pasa el endpoint al robot por
# `CAMOUFOX_WS`; `_lib/navegador.ts` se engancha a él en vez de lanzar Chromium.
# Si el servidor no arranca, el paso falla en rojo y NO se cae a Chromium a
# escondidas: mejor una corrida menos que 110 corridas tiradas contra el WAF de
# otro, que es lo que pasó del 22 al 28 de agosto.
#
# ── LOS CINCO FALLOS DE ARRANQUE, POR ORDEN (todos del 29-ago) ────────────
#   1. El endpoint se sacaba con un `grep ws://` del log. Frágil. Ahora es fijo.
#   2. `launch_server(headless="virtual")` → muere con `expected boolean, got
#      string`. Va `headless=True`, que es con lo que la sonda pasó el challenge.
#   3. CAMOUFOX ESCUCHA EN IPv6 (`ws://[::1]:4545/…`) y se comprobaba 127.0.0.1.
#   4. `bash -e`: `HOST=$(sondeo) && break` abortaba el paso al primer sondeo
#      fallido, que es lo normal mientras el servidor levanta.
#   5. LA PROPIA TELEMETRÍA TUMBABA EL JOB. La función `apunta` se escribía con
#      un `echo` de una sola línea llena de comillas escapadas dentro de comillas
#      dentro de YAML. Dos corridas murieron en 1m26s sin dejar NI UNA LÍNEA en
#      el ERP: el chivato puesto para no ir a ciegas era lo que rompía. Ahora se
#      escribe con un heredoc entrecomillado (`<<'SH'`), donde el shell no toca
#      nada, y `apunta` NUNCA puede tumbar el paso (`|| true` dentro).
#
# REGLA que sale de esto: un mecanismo de diagnóstico no puede poder romper lo
# que vigila. Si el chivato falla, se calla; no mata el trabajo.
#
# palanca: 15 (29-ago · telemetría por heredoc)
# ══════════════════════════════════════════════════════════════════════════
#
# palanca: 6 (19-ago) — cruza la puerta de re-login al abrir el historial
# palanca: 7 (22-ago) — 2 cruces de re-login por corrida, detección robusta del
#   historial, vuelta atrás entre pedidos y calendario válido en verano e invierno.
# palanca: 8 (22-ago) — rescate de días caídos.
on:
  schedule:
    - cron: "5,35 10-15 * * *"
    - cron: "5,35 17-22 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/justeat-detalle.yml"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      seguir: ${{ steps.candado.outputs.seguir }}
    steps:
      - name: Candado de franja de servicio (Madrid)
        id: candado
        run: |
          H=$(TZ=Europe/Madrid date +%-H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "seguir=1" >> $GITHUB_OUTPUT; exit 0
          fi
          if { [ "$H" -ge 12 ] && [ "$H" -le 16 ]; } || { [ "$H" -ge 19 ] && [ "$H" -le 23 ]; }; then
            echo "seguir=1" >> $GITHUB_OUTPUT
          else
            echo "seguir=0" >> $GITHUB_OUTPUT
          fi

  robot:
    needs: plan
    if: needs.plan.outputs.seguir == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: justeat-detalle
      cancel-in-progress: true
    env:
      SB_URL: https://eryauogxcpbgdryeimdq.supabase.co
      SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      # LA TELEMETRÍA SE ESCRIBE CON HEREDOC ENTRECOMILLADO. Dentro de <<'SH' el
      # shell no interpreta NADA, así que las comillas van tal cual y no hay que
      # escapar. La versión anterior, un `echo` de una línea con comillas
      # escapadas, es la que tumbaba el job (ver cabecera, fallo 5).
      - name: Fase 1 · arranque
        run: |
          cat > /tmp/apunta.sh <<'SH'
          apunta() {
            jq -n --arg e "$1" --arg d "$2" \
              '{fuente:"justeat_job",estado:$e,detalle:$d}' \
            | curl -s -X POST "$SB_URL/rest/v1/robot_log" \
                -H "apikey: $SB_KEY" \
                -H "Authorization: Bearer $SB_KEY" \
                -H "Content-Type: application/json" \
                --data-binary @- > /dev/null || true
          }
          SH
          chmod +x /tmp/apunta.sh
          source /tmp/apunta.sh
          apunta "fase_1_arranque" "job iniciado ($(TZ=Europe/Madrid date '+%H:%M') Madrid, evento ${{ github.event_name }})"
          echo "telemetria lista"

      - name: Jitter humano
        if: github.event_name == 'schedule'
        run: sleep $(( RANDOM % 181 ))

      - uses: actions/checkout@v4
        with:
          repository: Streatlab/binagre
          ref: trabajo
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: |
          source /tmp/apunta.sh
          npm install --no-audit --no-fund > npm.log 2>&1 || { apunta "fase_2_npm_ko" "$(tail -c 800 npm.log)"; exit 1; }
          apunta "fase_2_npm_ok" "dependencias instaladas"

      - name: Instalar Camoufox
        run: |
          source /tmp/apunta.sh
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          (pip install --quiet "camoufox[geoip]" || pip install --quiet camoufox) > cam.log 2>&1 \
            || { apunta "fase_3_pip_ko" "$(tail -c 800 cam.log)"; exit 1; }
          python -m camoufox fetch >> cam.log 2>&1 \
            || { apunta "fase_3_fetch_ko" "$(tail -c 800 cam.log)"; exit 1; }
          apunta "fase_3_camoufox_ok" "camoufox instalado y descargado"

      - name: Levantar el servidor de Camoufox
        # `bash +e`: aquí los fallos son ESPERADOS (el sondeo del puerto falla
        # hasta que el servidor levanta). Con el `-e` de GitHub, el primer
        # sondeo fallido mataba el paso entero (fallo 4 de la cabecera).
        shell: bash +e {0}
        run: |
          source /tmp/apunta.sh
          cat > servidor_camoufox.py <<'PY'
          from camoufox.server import launch_server
          launch_server(headless=True, os=["windows"], locale="es-ES",
                        humanize=True, geoip=True, port=4545, ws_path="binagre")
          PY
          nohup xvfb-run -a python servidor_camoufox.py > camoufox_servidor.log 2>&1 &
          echo $! > camoufox.pid

          cat > espera_puerto.py <<'PY'
          import socket, sys
          for fam, host in ((socket.AF_INET6, "::1"), (socket.AF_INET, "127.0.0.1")):
              s = socket.socket(fam, socket.SOCK_STREAM)
              s.settimeout(1)
              try:
                  s.connect((host, 4545))
                  print("[" + host + "]" if fam == socket.AF_INET6 else host)
                  sys.exit(0)
              except OSError:
                  pass
              finally:
                  s.close()
          sys.exit(1)
          PY

          HOST=""
          for i in $(seq 1 120); do
            if SALIDA=$(python3 espera_puerto.py); then
              HOST="$SALIDA"
              break
            fi
            if ! kill -0 "$(cat camoufox.pid)" 2>/dev/null; then
              apunta "fase_4_servidor_muerto" "$(tail -c 900 camoufox_servidor.log)"
              cat camoufox_servidor.log
              exit 1
            fi
            sleep 1
          done

          if [ -z "$HOST" ]; then
            apunta "fase_4_servidor_sin_puerto" "no escucha en 4545 (ni IPv4 ni IPv6) tras 120s · $(tail -c 700 camoufox_servidor.log)"
            cat camoufox_servidor.log
            exit 1
          fi
          echo "CAMOUFOX_WS=ws://${HOST}:4545/binagre" >> $GITHUB_ENV
          apunta "fase_4_camoufox_arriba" "escuchando en ${HOST}:4545"

      - name: Leer historial de pedidos de Just Eat
        env:
          SUPABASE_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          source /tmp/apunta.sh
          apunta "fase_5_robot" "lanzando justeat-detalle.ts contra $CAMOUFOX_WS"
          npx tsx scripts/robot-ingesta/justeat-detalle.ts 2>&1 | tee robot.log
          CODIGO=${PIPESTATUS[0]}
          if [ "$CODIGO" != "0" ]; then apunta "fase_5_robot_ko" "salida $CODIGO · $(tail -c 900 robot.log)"; exit "$CODIGO"; fi
          apunta "fase_5_robot_ok" "el robot ha terminado sin error"

      - name: Cierre
        if: always()
        run: |
          source /tmp/apunta.sh || true
          apunta "fin" "job terminado con estado ${{ job.status }}" || true
          tail -60 camoufox_servidor.log || true
