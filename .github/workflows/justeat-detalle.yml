name: Just Eat · detalle de pedidos (historial)

# Robot de detalle de pedidos propios de Just Eat (Partner Hub). Lee el Historial,
# abre cada pedido nuevo y guarda líneas/totales/hora/marca en justeat_pedidos +
# justeat_pedido_lineas. NO toca la facturación oficial (liquidación quincenal).
# LEY DE RELOJES + LEY BUEN CIUDADANO (freno de caudal + jitter dentro del script).
#
# ⚠️ AVISO (30-ago, 11:30): este fichero se revirtió solo a una versión anterior
# mientras se depuraba, y la corrida siguiente salió "fuera de servicio" porque se
# había perdido el interruptor de puesta al día. Si vuelve a aparecer sin la ruta
# `disparos/justeat-detalle.txt` ni `JE_FORZAR`, es que alguien lo ha pisado:
# reaplicar esta versión antes de sacar conclusiones de ningún log.
#
# ══════════════════════════════════════════════════════════════════════════
# 29-ago-2026 · A LA NUBE. NO ERA LA IP, ERA EL NAVEGADOR.
#
# Medido con tres sondas (justeat-diagnostico.yml): desde la MISMA IP de GitHub
# Actions, Camoufox (Firefox con la huella parcheada) llegó a
# partner-hub.just-eat.es/home con 200, sin Turnstile y sin ningún código 10xx.
# Lo que Cloudflare detectaba era el Chromium headless de Playwright, no la IP.
#
# Este job levanta un servidor de Camoufox y le pasa el endpoint al robot por
# `CAMOUFOX_WS`; `_lib/navegador.ts` se engancha a él en vez de lanzar Chromium.
# Si el servidor no arranca, el paso falla en rojo y NO se cae a Chromium a
# escondidas: mejor una corrida menos que 110 tiradas contra el WAF de otro.
#
# ── LOS SEIS FALLOS DE ARRANQUE (29-ago) ──────────────────────────────────
#   1. El endpoint se sacaba con `grep ws://` del log. Frágil. Ahora es fijo.
#   2. `launch_server(headless="virtual")` → muere: espera booleano.
#   3. CAMOUFOX ESCUCHA EN IPv6 (`ws://[::1]:4545/…`) y se comprobaba 127.0.0.1.
#   4. `bash -e`: `HOST=$(sondeo) && break` abortaba el paso al primer sondeo
#      fallido, que es lo normal mientras el servidor levanta.
#   5. LA PROPIA TELEMETRÍA TUMBABA EL JOB: `apunta` escrita con un `echo` lleno
#      de comillas escapadas. Ahora heredoc `<<'SH'` y `|| true` dentro.
#   6. VERSIÓN DE PLAYWRIGHT CRUZADA: servidor 1.60 vs cliente 1.61 → `428
#      Precondition Required`. Se alinea el cliente con `--no-save`.
#
# ── 30-ago · AQUÍ NO SE LE DICE EL IDIOMA ─────────────────────────────────
# Camoufox arma su huella con `geoip`, coherente con la IP por la que sale (un
# centro de datos, que no está en Madrid). Forzarle `locale="es-ES"` creaba justo
# la contradicción que Cloudflare puntúa. Se le deja decidir; lo mismo en el
# robot, donde con Camoufox el contexto va pelado. Y `headless=False` bajo xvfb.
#
# ── 30-ago · LA GALLETA DEL PORTERO (palanca 22) ──────────────────────────
# Síntoma: en `access.just-eat.es` la pantalla se quedaba dando vueltas en
# "Performing security verification" los 180 s enteros, con CERO iframes — es
# decir, el desafío ni siquiera llegaba a montar su widget. Eso no es un muro que
# te rechaza: es un desafío que no puede TERMINAR.
#
# La causa: Firefox trae protección antirrastreo con las cookies particionadas
# por sitio (cookieBehavior 5, "total cookie protection"). El desafío de
# Cloudflare necesita guardar su propia galleta para darse por superado; si se le
# aísla, vuelve a empezar una y otra vez. Un bucle, no un bloqueo.
#
# Por eso aquí se le abren las cookies al navegador (cookieBehavior 0, sin
# particionar el estado de red y sin la protección antirrastreo). No afecta a la
# huella: es comportamiento de un Firefox con la protección en modo estándar, que
# es lo más común del mundo.
#
# ── CÓMO SE LANZA A MANO ──────────────────────────────────────────────────
# Botón "Run workflow" en Actions, o editando `disparos/justeat-detalle.txt`.
# Las dos vías hacen PUESTA AL DÍA: leen el historial a cualquier hora. Por reloj
# manda la ventana de servicio, como siempre.
#
# palanca: 6 (19-ago) — cruza la puerta de re-login al abrir el historial
# palanca: 7 (22-ago) — 2 cruces de re-login, detección robusta del historial
# palanca: 8 (22-ago) — rescate de días caídos
# palanca: 16 (29-ago) — pin de Playwright a la versión de Camoufox
# palanca: 21 (30-ago) — sin idioma forzado, pantalla virtual, disparo aparte
# palanca: 22 (30-ago) — cookies sin particionar: el desafío puede terminar
# ══════════════════════════════════════════════════════════════════════════
on:
  schedule:
    - cron: "5,35 10-15 * * *"
    - cron: "5,35 17-22 * * *"
  workflow_dispatch:
    inputs:
      puesta_al_dia:
        description: "Leer el historial aunque sea fuera de horas de servicio (backfill)"
        type: boolean
        default: true
  push:
    paths:
      - ".github/workflows/justeat-detalle.yml"
      - "disparos/justeat-detalle.txt"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      seguir: ${{ steps.candado.outputs.seguir }}
    steps:
      - name: Candado de franja de servicio (Madrid)
        id: candado
        run: |
          H=$(TZ=Europe/Madrid date +%-H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "seguir=1" >> $GITHUB_OUTPUT; exit 0
          fi
          if { [ "$H" -ge 12 ] && [ "$H" -le 16 ]; } || { [ "$H" -ge 19 ] && [ "$H" -le 23 ]; }; then
            echo "seguir=1" >> $GITHUB_OUTPUT
          else
            echo "seguir=0" >> $GITHUB_OUTPUT
          fi

  robot:
    needs: plan
    if: needs.plan.outputs.seguir == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: justeat-detalle
      cancel-in-progress: true
    env:
      SB_URL: https://eryauogxcpbgdryeimdq.supabase.co
      SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      # LA TELEMETRÍA SE ESCRIBE CON HEREDOC ENTRECOMILLADO (fallo 5).
      - name: Fase 1 · arranque
        run: |
          cat > /tmp/apunta.sh <<'SH'
          apunta() {
            jq -n --arg e "$1" --arg d "$2" \
              '{fuente:"justeat_job",estado:$e,detalle:$d}' \
            | curl -s -X POST "$SB_URL/rest/v1/robot_log" \
                -H "apikey: $SB_KEY" \
                -H "Authorization: Bearer $SB_KEY" \
                -H "Content-Type: application/json" \
                --data-binary @- > /dev/null || true
          }
          SH
          chmod +x /tmp/apunta.sh
          source /tmp/apunta.sh
          apunta "fase_1_arranque" "job iniciado ($(TZ=Europe/Madrid date '+%H:%M') Madrid, evento ${{ github.event_name }}) · palanca 22"
          echo "telemetria lista"

      - name: Jitter humano
        if: github.event_name == 'schedule'
        run: sleep $(( RANDOM % 181 ))

      - uses: actions/checkout@v4
        with:
          repository: Streatlab/binagre
          ref: trabajo
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: |
          source /tmp/apunta.sh
          npm install --no-audit --no-fund > npm.log 2>&1 || { apunta "fase_2_npm_ko" "$(tail -c 800 npm.log)"; exit 1; }
          apunta "fase_2_npm_ok" "dependencias instaladas"

      - name: Instalar Camoufox
        run: |
          source /tmp/apunta.sh
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          (pip install --quiet "camoufox[geoip]" || pip install --quiet camoufox) > cam.log 2>&1 \
            || { apunta "fase_3_pip_ko" "$(tail -c 800 cam.log)"; exit 1; }
          python -m camoufox fetch >> cam.log 2>&1 \
            || { apunta "fase_3_fetch_ko" "$(tail -c 800 cam.log)"; exit 1; }
          apunta "fase_3_camoufox_ok" "camoufox instalado y descargado"

      # EL CLIENTE SE ALINEA CON EL SERVIDOR (fallo 6). `--no-save`: el
      # package.json NO se toca, esto vive solo dentro de esta corrida.
      - name: Alinear Playwright con el de Camoufox
        run: |
          source /tmp/apunta.sh
          VER=$(python3 -c "import importlib.metadata as m; print(m.version('playwright'))" 2>/dev/null || echo "")
          if [ -z "$VER" ]; then
            apunta "fase_3b_sin_version" "no he podido leer la version de playwright de camoufox; sigo con la del repo"
          else
            npm install --no-save --no-audit --no-fund "playwright@$VER" "playwright-core@$VER" > pw.log 2>&1 \
              || { apunta "fase_3b_pin_ko" "no he podido instalar playwright@$VER · $(tail -c 600 pw.log)"; exit 1; }
            apunta "fase_3b_pin_ok" "cliente Playwright alineado a la version del servidor de Camoufox: $VER"
          fi

      - name: Levantar el servidor de Camoufox
        # `bash +e`: aquí los fallos son ESPERADOS mientras el servidor levanta (fallo 4).
        shell: bash +e {0}
        run: |
          source /tmp/apunta.sh
          cat > servidor_camoufox.py <<'PY'
          from camoufox.server import launch_server

          # LA GALLETA DEL PORTERO (palanca 22, ver cabecera): con las cookies
          # particionadas, el desafío de Cloudflare no puede guardar la suya y se
          # queda en bucle. Protección en modo estándar, que es lo normal.
          PREFS = {
              "network.cookie.cookieBehavior": 0,
              "privacy.partition.network_state": False,
              "privacy.trackingprotection.enabled": False,
              "privacy.trackingprotection.pbmode.enabled": False,
          }

          launch_server(headless=False, os=["windows"],
                        humanize=True, geoip=True, port=4545, ws_path="binagre",
                        firefox_user_prefs=PREFS)
          PY
          nohup xvfb-run -a python servidor_camoufox.py > camoufox_servidor.log 2>&1 &
          echo $! > camoufox.pid

          cat > espera_puerto.py <<'PY'
          import socket, sys
          for fam, host in ((socket.AF_INET6, "::1"), (socket.AF_INET, "127.0.0.1")):
              s = socket.socket(fam, socket.SOCK_STREAM)
              s.settimeout(1)
              try:
                  s.connect((host, 4545))
                  print("[" + host + "]" if fam == socket.AF_INET6 else host)
                  sys.exit(0)
              except OSError:
                  pass
              finally:
                  s.close()
          sys.exit(1)
          PY

          HOST=""
          for i in $(seq 1 120); do
            if SALIDA=$(python3 espera_puerto.py); then
              HOST="$SALIDA"
              break
            fi
            if ! kill -0 "$(cat camoufox.pid)" 2>/dev/null; then
              apunta "fase_4_servidor_muerto" "$(tail -c 900 camoufox_servidor.log)"
              cat camoufox_servidor.log
              exit 1
            fi
            sleep 1
          done

          if [ -z "$HOST" ]; then
            apunta "fase_4_servidor_sin_puerto" "no escucha en 4545 (ni IPv4 ni IPv6) tras 120s · $(tail -c 700 camoufox_servidor.log)"
            cat camoufox_servidor.log
            exit 1
          fi
          echo "CAMOUFOX_WS=ws://${HOST}:4545/binagre" >> $GITHUB_ENV
          apunta "fase_4_camoufox_arriba" "escuchando en ${HOST}:4545 (pantalla virtual, sin idioma forzado, cookies sin particionar)"

      - name: Leer historial de pedidos de Just Eat
        env:
          SUPABASE_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # PUESTA AL DÍA en toda corrida que no sea por reloj.
          JE_FORZAR: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.puesta_al_dia)) && '1' || '' }}
        run: |
          source /tmp/apunta.sh
          apunta "fase_5_robot" "lanzando justeat-detalle.ts contra $CAMOUFOX_WS (puesta al dia=${JE_FORZAR:-0})"
          npx tsx scripts/robot-ingesta/justeat-detalle.ts 2>&1 | tee robot.log
          CODIGO=${PIPESTATUS[0]}
          if [ "$CODIGO" != "0" ]; then apunta "fase_5_robot_ko" "salida $CODIGO · $(tail -c 900 robot.log)"; exit "$CODIGO"; fi
          apunta "fase_5_robot_ok" "el robot ha terminado sin error"

      - name: Cierre
        if: always()
        run: |
          source /tmp/apunta.sh || true
          apunta "fin" "job terminado con estado ${{ job.status }}" || true
          tail -60 camoufox_servidor.log || true
