name: Just Eat · detalle de pedidos (historial)

# Robot de detalle de pedidos propios de Just Eat (Partner Hub). Lee el Historial,
# abre cada pedido nuevo y guarda líneas/totales/hora/marca en justeat_pedidos +
# justeat_pedido_lineas. NO toca la facturación oficial (liquidación quincenal).
# LEY DE RELOJES + LEY BUEN CIUDADANO (freno de caudal + jitter dentro del script).
#
# ══════════════════════════════════════════════════════════════════════════
# 29-ago-2026 · VUELVE A LA NUBE. NO ERA LA IP, ERA EL NAVEGADOR.
#
# El 28-ago se apagó este schedule dando por hecho que el Cloudflare de Just Eat
# bloqueaba las IPs de Azure/GitHub, y el robot se mudó al PC de Rubén. El 29-ago
# se midió de verdad con tres sondas (justeat-diagnostico.yml) y salió lo
# contrario: desde la MISMA IP de GitHub Actions, Camoufox (Firefox con la huella
# parcheada) pasó el challenge y llegó a partner-hub.just-eat.es/home — 200, sin
# Turnstile y sin ningún código 10xx. Lo que Cloudflare detectaba era el Chromium
# headless de Playwright, no la IP. Lo confirma el último fallo del robot viejo
# (28-ago 19:42): `bloqueo_waf · desafío Cloudflare no resuelto en 75s (UA Chrome 141)`.
#
# Por eso este job levanta un servidor de Camoufox y le pasa el endpoint al robot
# por `CAMOUFOX_WS`; `_lib/navegador.ts` se engancha a él en vez de lanzar
# Chromium. Si el servidor no arranca, el paso falla en rojo y NO se cae a
# Chromium a escondidas: preferimos una corrida menos a 110 corridas tiradas
# contra el WAF de otro, que es lo que pasó del 22 al 28 de agosto.
#
# ── LOS TRES FALLOS DE ARRANQUE, POR ORDEN (todos del 29-ago) ─────────────
#   1. El endpoint se sacaba con un `grep ws://` del log del servidor. Frágil:
#      el job moría antes de llegar al robot. Ahora puerto y ruta son FIJOS.
#   2. `launch_server(headless="virtual")` → el servidor moría al arrancar con
#      `headless: expected boolean, got string`. Va `headless=True` (booleano),
#      que es además con lo que la sonda pasó el challenge.
#   3. CAMOUFOX ESCUCHA EN IPv6. El log lo decía tal cual — `Websocket endpoint:
#      ws://[::1]:4545/binagre` — y la comprobación miraba 127.0.0.1 (IPv4), así
#      que cantaba "no escucha en 4545" con el servidor levantado delante. Tres
#      corridas perdidas por eso. Ahora se prueban las DOS pilas y el endpoint se
#      construye con la que conteste.
#
# TELEMETRÍA EN `robot_log` (fuente `justeat_job`). Los dos primeros intentos de
# esta migración murieron sin dejar UNA SOLA LÍNEA: los logs de GitHub Actions no
# se ven desde el ERP, así que depurar era adivinar. Con las fases puestas, cada
# fallo posterior cantó su causa exacta a la primera. Un job que se muere mudo
# cuesta más que el fallo que lo mató.
#
# palanca: 13 (29-ago · IPv6)
# ══════════════════════════════════════════════════════════════════════════
#
# palanca: 6 (19-ago) — cruza la puerta de re-login al abrir el historial
# palanca: 7 (22-ago) — 2 cruces de re-login por corrida, detección robusta del
#   historial, vuelta atrás entre pedidos y calendario válido en verano e invierno.
# palanca: 8 (22-ago) — rescate de días caídos.
on:
  schedule:
    - cron: "5,35 10-15 * * *"
    - cron: "5,35 17-22 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/justeat-detalle.yml"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      seguir: ${{ steps.candado.outputs.seguir }}
    steps:
      - name: Candado de franja de servicio (Madrid)
        id: candado
        run: |
          H=$(TZ=Europe/Madrid date +%-H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "seguir=1" >> $GITHUB_OUTPUT; exit 0
          fi
          if { [ "$H" -ge 12 ] && [ "$H" -le 16 ]; } || { [ "$H" -ge 19 ] && [ "$H" -le 23 ]; }; then
            echo "seguir=1" >> $GITHUB_OUTPUT
          else
            echo "seguir=0" >> $GITHUB_OUTPUT
          fi

  robot:
    needs: plan
    if: needs.plan.outputs.seguir == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: justeat-detalle
      cancel-in-progress: true
    env:
      SB_URL: https://eryauogxcpbgdryeimdq.supabase.co
      SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Fase 1 · arranque
        run: |
          echo 'apunta() { jq -n --arg e "$1" --arg d "$2" "{fuente:\"justeat_job\",estado:\$e,detalle:\$d}" | curl -s -X POST "$SB_URL/rest/v1/robot_log" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" -H "Content-Type: application/json" --data-binary @- > /dev/null; }' > /tmp/apunta.sh
          source /tmp/apunta.sh
          apunta "fase_1_arranque" "job iniciado ($(TZ=Europe/Madrid date '+%H:%M') Madrid, evento ${{ github.event_name }})"

      - name: Jitter humano
        if: github.event_name == 'schedule'
        run: sleep $(( RANDOM % 181 ))

      - uses: actions/checkout@v4
        with:
          repository: Streatlab/binagre
          ref: trabajo
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: |
          source /tmp/apunta.sh
          npm install --no-audit --no-fund > npm.log 2>&1 || { apunta "fase_2_npm_ko" "$(tail -c 800 npm.log)"; exit 1; }
          apunta "fase_2_npm_ok" "dependencias instaladas"

      - name: Instalar Camoufox
        run: |
          source /tmp/apunta.sh
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          (pip install --quiet "camoufox[geoip]" || pip install --quiet camoufox) > cam.log 2>&1 \
            || { apunta "fase_3_pip_ko" "$(tail -c 800 cam.log)"; exit 1; }
          python -m camoufox fetch >> cam.log 2>&1 \
            || { apunta "fase_3_fetch_ko" "$(tail -c 800 cam.log)"; exit 1; }
          apunta "fase_3_camoufox_ok" "camoufox instalado y descargado"

      - name: Levantar el servidor de Camoufox
        run: |
          source /tmp/apunta.sh
          cat > servidor_camoufox.py <<'PY'
          # Servidor Playwright de Camoufox. Puerto y ruta FIJOS: el endpoint se
          # construye a mano, no se saca con un grep del log (eso ya falló).
          # headless=True (BOOLEANO): "virtual" lo rechaza launch_server.
          from camoufox.server import launch_server
          launch_server(headless=True, os=["windows"], locale="es-ES",
                        humanize=True, geoip=True, port=4545, ws_path="binagre")
          PY
          nohup xvfb-run -a python servidor_camoufox.py > camoufox_servidor.log 2>&1 &
          echo $! > camoufox.pid

          # CAMOUFOX ESCUCHA EN IPv6 (`ws://[::1]:4545/…`). Se prueban las dos
          # pilas y se usa la que conteste: mirar solo 127.0.0.1 costó tres
          # corridas cantando "no escucha" con el servidor ya levantado.
          cat > espera_puerto.py <<'PY'
          import socket, sys
          for fam, host in ((socket.AF_INET6, "::1"), (socket.AF_INET, "127.0.0.1")):
              s = socket.socket(fam, socket.SOCK_STREAM)
              s.settimeout(1)
              try:
                  s.connect((host, 4545))
                  print(f"[{host}]" if fam == socket.AF_INET6 else host)
                  sys.exit(0)
              except OSError:
                  pass
              finally:
                  s.close()
          sys.exit(1)
          PY

          HOST=""
          for i in $(seq 1 120); do
            HOST=$(python3 espera_puerto.py) && break
            if ! kill -0 "$(cat camoufox.pid)" 2>/dev/null; then
              apunta "fase_4_servidor_muerto" "$(tail -c 900 camoufox_servidor.log)"
              cat camoufox_servidor.log; exit 1
            fi
            sleep 1
            HOST=""
          done
          if [ -z "$HOST" ]; then
            apunta "fase_4_servidor_sin_puerto" "no escucha en 4545 (ni IPv4 ni IPv6) tras 120s · $(tail -c 700 camoufox_servidor.log)"
            cat camoufox_servidor.log; exit 1
          fi
          echo "CAMOUFOX_WS=ws://${HOST}:4545/binagre" >> $GITHUB_ENV
          apunta "fase_4_camoufox_arriba" "escuchando en ${HOST}:4545"

      - name: Leer historial de pedidos de Just Eat
        env:
          SUPABASE_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          source /tmp/apunta.sh
          apunta "fase_5_robot" "lanzando justeat-detalle.ts contra $CAMOUFOX_WS"
          npx tsx scripts/robot-ingesta/justeat-detalle.ts 2>&1 | tee robot.log
          CODIGO=${PIPESTATUS[0]}
          if [ "$CODIGO" != "0" ]; then apunta "fase_5_robot_ko" "salida $CODIGO · $(tail -c 900 robot.log)"; exit "$CODIGO"; fi
          apunta "fase_5_robot_ok" "el robot ha terminado sin error"

      - name: Cierre
        if: always()
        run: |
          source /tmp/apunta.sh
          apunta "fin" "job terminado con estado ${{ job.status }}"
          tail -60 camoufox_servidor.log || true
