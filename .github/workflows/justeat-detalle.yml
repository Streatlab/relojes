name: Just Eat · detalle de pedidos (historial)

# Robot de detalle de pedidos propios de Just Eat (Partner Hub). Lee el Historial,
# abre cada pedido nuevo y guarda líneas/totales/hora/marca en justeat_pedidos +
# justeat_pedido_lineas. NO toca la facturación oficial (liquidación quincenal).
# LEY DE RELOJES + LEY BUEN CIUDADANO (freno de caudal + jitter dentro del script).
#
# ══════════════════════════════════════════════════════════════════════════
# 29-ago-2026 · VUELVE A LA NUBE. NO ERA LA IP, ERA EL NAVEGADOR.
#
# El 28-ago se apagó este schedule dando por hecho que el Cloudflare de Just Eat
# bloqueaba las IPs de Azure/GitHub, y el robot se mudó al PC de Rubén. El 29-ago
# se midió de verdad con tres sondas (justeat-diagnostico.yml) y salió lo
# contrario: desde la MISMA IP de GitHub Actions, Camoufox (Firefox con la huella
# parcheada) pasó el challenge y llegó a partner-hub.just-eat.es/home — 200, sin
# Turnstile y sin ningún código 10xx. Lo que Cloudflare detectaba era el Chromium
# headless de Playwright, no la IP.
#
# Por eso este job levanta un servidor de Camoufox y le pasa el endpoint al robot
# por `CAMOUFOX_WS`; `_lib/navegador.ts` se engancha a él en vez de lanzar
# Chromium. Si el servidor no arranca, el paso falla en rojo y NO se cae a
# Chromium a escondidas: preferimos una corrida menos a 110 corridas tiradas
# contra el WAF de otro, que es lo que pasó del 22 al 28 de agosto.
#
# EL ENDPOINT SE FIJA, NO SE ADIVINA (correctivo del mismo día): la primera
# versión sacaba el `ws://` con un grep del log del servidor y el job moría antes
# de llegar al robot. Ahora el puerto y la ruta se imponen (`port` + `ws_path`),
# el endpoint se construye a mano y solo se espera a que el puerto escuche.
#
# palanca: 10 (29-ago) — arranque de Camoufox por puerto fijo.
# ══════════════════════════════════════════════════════════════════════════
#
# palanca: 6 (19-ago) — cruza la puerta de re-login al abrir el historial
# palanca: 7 (22-ago) — 2 cruces de re-login por corrida, detección robusta del
#   historial, vuelta atrás entre pedidos y calendario válido en verano e invierno.
#   El cron va en UTC y el candado en hora de Madrid: se abre el cron a 10-15 y
#   17-22 UTC (cubre UTC+1 y UTC+2) y manda el candado, que es el que sabe la hora
#   real de Madrid. Antes, en horario de invierno se perdía el primer pase de comida.
# palanca: 8 (22-ago) — rescate de días caídos: el robot ya no descarta los pedidos
#   de días anteriores que Just Eat siga mostrando en el Historial.
on:
  schedule:
    # Cada 30 min en las franjas de servicio (UTC, cubre UTC+1 y UTC+2).
    # El candado de abajo, que sí sabe la hora de Madrid, es quien manda.
    - cron: "5,35 10-15 * * *"
    - cron: "5,35 17-22 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/justeat-detalle.yml"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      seguir: ${{ steps.candado.outputs.seguir }}
    steps:
      - name: Candado de franja de servicio (Madrid)
        id: candado
        run: |
          H=$(TZ=Europe/Madrid date +%-H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "seguir=1" >> $GITHUB_OUTPUT; exit 0
          fi
          if { [ "$H" -ge 12 ] && [ "$H" -le 16 ]; } || { [ "$H" -ge 19 ] && [ "$H" -le 23 ]; }; then
            echo "seguir=1" >> $GITHUB_OUTPUT
          else
            echo "seguir=0" >> $GITHUB_OUTPUT
          fi

  robot:
    needs: plan
    if: needs.plan.outputs.seguir == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: justeat-detalle
      cancel-in-progress: true
    steps:
      - name: Jitter humano
        if: github.event_name == 'schedule'
        run: sleep $(( RANDOM % 181 ))
      - uses: actions/checkout@v4
        with:
          repository: Streatlab/binagre
          ref: trabajo
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      # ── CAMOUFOX ─────────────────────────────────────────────────────────
      - name: Instalar Camoufox
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          pip install --quiet "camoufox[geoip]" || pip install --quiet camoufox
          python -m camoufox fetch

      - name: Levantar el servidor de Camoufox
        run: |
          cat > servidor_camoufox.py <<'PY'
          # Servidor Playwright de Camoufox. Puerto y ruta FIJOS para que el
          # endpoint se pueda construir sin leer el log (ver cabecera).
          # headless="virtual" = Xvfb: para Cloudflare es una pantalla real.
          from camoufox.server import launch_server
          launch_server(headless="virtual", os=["windows"], locale="es-ES",
                        humanize=True, geoip=True, port=4545, ws_path="binagre")
          PY
          nohup python servidor_camoufox.py > camoufox_servidor.log 2>&1 &
          echo $! > camoufox.pid
          # Se espera a que el PUERTO escuche (hasta 120 s). No se parsea el log.
          for i in $(seq 1 120); do
            if (echo > /dev/tcp/127.0.0.1/4545) 2>/dev/null; then
              echo "CAMOUFOX_WS=ws://127.0.0.1:4545/binagre" >> $GITHUB_ENV
              echo "Camoufox escuchando en el puerto 4545 (tras ${i}s)"
              break
            fi
            # Si el proceso se ha muerto, no tiene sentido seguir esperando.
            if ! kill -0 "$(cat camoufox.pid)" 2>/dev/null; then
              echo "::error::El servidor de Camoufox se ha muerto al arrancar."
              cat camoufox_servidor.log
              exit 1
            fi
            sleep 1
          done
          if ! (echo > /dev/tcp/127.0.0.1/4545) 2>/dev/null; then
            echo "::error::Camoufox no escucha en 4545. NO se cae a Chromium: se aborta la corrida."
            cat camoufox_servidor.log
            exit 1
          fi
          head -20 camoufox_servidor.log || true

      - name: Leer historial de pedidos de Just Eat
        env:
          SUPABASE_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/robot-ingesta/justeat-detalle.ts

      - name: Log del servidor de Camoufox
        if: always()
        run: tail -60 camoufox_servidor.log || true
