name: Diario · cancelados con cobro + espejo Trello

# MUDADO desde Streatlab/binagre (02-ago): reloj público, código privado.
# - cancelados: repasa en Uber (Ganancias→Otros pagos), Glovo (Ingresos
#   estimados) y JE (factura quincenal) si los cancelados figuran pagados.
#   Solo propone; confirma Rubén en el Panel. 1 vez/día.
# - trello: red de seguridad del espejo Trello<->ERP. Cada hora.
# 02-ago (3): retirado el parche al vuelo del dominio merchants.ubereats.com —
# ya está fusionado en binagre@trabajo (misión cancelados-cobro).
# palanca: 5 (revalidación MODO=todos de los 6 pendientes con el robot nuevo)
on:
  schedule:
    - cron: "30 3 * * *"    # cancelados · 05:30 Madrid (verano) / 04:30 (invierno)
    - cron: "0 * * * *"     # trello · cada hora
  push:
    paths:
      - ".github/workflows/diario-cancelados-trello.yml"
  workflow_dispatch:
    inputs:
      cual:
        description: "Qué lanzar"
        type: choice
        options: ["cancelados", "trello"]
        default: "cancelados"

concurrency:
  group: diario-${{ github.event.schedule || github.event.inputs.cual || 'palanca' }}
  cancel-in-progress: false

jobs:
  cancelados:
    if: github.event.schedule == '30 3 * * *' || github.event.inputs.cual == 'cancelados' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Streatlab/binagre
          ref: trabajo
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Repasar cancelados pendientes
        env:
          # Palanca (push) = repaso completo; el diario nocturno filtra.
          MODO: ${{ github.event_name == 'push' && 'todos' || 'diario' }}
          SUPABASE_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: xvfb-run -a npx tsx scripts/robot-ingesta/cancelados-cobro.ts

  trello:
    if: github.event.schedule == '0 * * * *' || github.event.inputs.cual == 'trello'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Streatlab/binagre
          ref: trabajo
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Sincronizar Trello
        env:
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          SUPABASE_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SIMULACRO: "0"
        run: node scripts/trello-sync.mjs
