name: Diario · cancelados con cobro + espejo Trello

# MUDADO desde Streatlab/binagre (02-ago): reloj público, código privado.
# - cancelados: repasa en Uber/Glovo si los cancelados pendientes figuran
#   pagados (solo propone; confirma Rubén en el Panel). 1 vez/día.
# - trello: red de seguridad del espejo Trello<->ERP (el webhook instantáneo
#   sigue en Vercel). Cada hora, sin navegador.
# FIX 02-ago (2) · CANCELADOS/UBER: el robot entraba en
# merchants.ubereats.com pero su comprobación de "estoy dentro" solo aceptaba
# managers.* → siempre daba login_ko aunque la sesión fuera válida. Hasta que
# el arreglo se fusione en binagre@trabajo, este reloj parchea esa línea al
# vuelo tras el checkout (solo añade "merchants" como dominio válido).
# palanca: 2
on:
  schedule:
    - cron: "30 3 * * *"    # cancelados · 05:30 Madrid (verano) / 04:30 (invierno)
    - cron: "0 * * * *"     # trello · cada hora
  push:
    paths:
      - ".github/workflows/diario-cancelados-trello.yml"
  workflow_dispatch:
    inputs:
      cual:
        description: "Qué lanzar"
        type: choice
        options: ["cancelados", "trello"]
        default: "cancelados"

concurrency:
  group: diario-${{ github.event.schedule || github.event.inputs.cual || 'palanca' }}
  cancel-in-progress: false

jobs:
  cancelados:
    if: github.event.schedule == '30 3 * * *' || github.event.inputs.cual == 'cancelados' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Streatlab/binagre
          ref: trabajo
          token: ${{ secrets.GH_PAT }}
      - name: Parche dominio Uber (merchants) hasta fusión en trabajo
        run: |
          python3 - <<'EOF'
          p = 'scripts/robot-ingesta/cancelados-cobro.ts'
          s = open(p, encoding='utf8').read()
          viejo = r'managers\.(ubereats\.com|glovoapp\.com)'
          nuevo = r'(managers|merchants)\.(ubereats\.com|glovoapp\.com)'
          if viejo in s and nuevo not in s:
              s = s.replace(viejo, nuevo)
              open(p, 'w', encoding='utf8').write(s)
              print('parche aplicado')
          else:
              print('parche no necesario (ya fusionado o línea cambiada)')
          EOF
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Repasar cancelados pendientes
        env:
          MODO: diario
          SUPABASE_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: xvfb-run -a npx tsx scripts/robot-ingesta/cancelados-cobro.ts

  trello:
    if: github.event.schedule == '0 * * * *' || github.event.inputs.cual == 'trello' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Streatlab/binagre
          ref: trabajo
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Sincronizar Trello
        env:
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          SUPABASE_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SIMULACRO: "0"
        run: node scripts/trello-sync.mjs
