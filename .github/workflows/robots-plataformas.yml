name: Robots de plataforma (Uber / Glovo → bandeja)

# MUDADO desde Streatlab/binagre (02-ago): reloj público, código privado.
# Descarga informes/facturas a la bandeja de Papeleo. El candado decide el modo
# según el día y la hora. Scripts leen creds de robot_credenciales.
#
# 14-ago-2026 · SINQRO ELIMINADO de este robot por requerimiento formal de
# Sinqro (cese de automatización, arts. 197 bis y 264 bis CP). PROHIBIDO
# volver a añadir "sinqro" a la matriz o a las opciones sin acuerdo escrito
# con Sinqro. Alternativa en evaluación: Lymon / mecanismo autorizado.
#
# palanca: 10 CERRADA (06-ago, Claude chat) — MISION-julio-marca-plataforma:
# el backfill de Glovo jul-2026 por marca se quedó en bucle re-descargando los
# mismos ZIP ya recibidos. Si hace falta repescar, usar workflow_dispatch con
# modo "backfill" y mes "2026-07" en vez de tocar este env de push.
#
# 14-oct-2026 · MISION-uber-informes-v2 (Rubén aprobó en chat): segunda pasada
# SOLO UBER a las 20:30 Madrid (verano), franja en la que uber_pantallas entró
# sin reto de Cloudflare el 12-oct. El reloj de 09:00 queda como segundo intento.
#
# 16-oct-2026 · tren revisa-ley-de-netos-cody (Rubén autorizó robots Glovo/Uber):
# el paso de informes de Glovo corre SIEMPRE (always()), aunque la ingesta de
# facturas salga en rojo — desde el 8-oct glovo.ts acababa en exit 1 y GitHub se
# saltaba los informes (del 11 al 15-oct no entró ninguno: ahí viene recargo_espera).
# PLATAFORMA_PUSH=glovo: este cambio lanza ya una pasada diaria de Glovo para recuperar.

# 21-oct-2026 · FASE17c (orden de Rubén, bloqueo Cloudflare en Uber Manager). CADENCIA MÍNIMA de Uber:
#  · UNA sola entrada al día a Uber Manager desde este reloj, en hora valle (05:20 Madrid verano / 04:20 invierno).
#    Se quita la segunda pasada de las 20:30 (que además GitHub retrasaba a las 23:00).
#  · UNA pasada «semanal» (martes: los informes del lunes ya están generados). Es la MISMA entrada del martes, no una más.
#  · Reintento espaciado: si una pasada topa con el reto de Cloudflare, mañana se reintenta UNA vez; si topa dos veces
#    seguidas el reloj de Uber se PARA (sin golpear más) hasta que Rubén resiembre la sesión (autosembrada) o lo lance a mano.
#  · Glovo NO cambia: sigue su pasada de las 07:00 UTC, con sus modos de siempre.
# Aplicada el 21-oct-2026 con OK de Rubén (robots §10) desde el chat principal.
env:
  PLATAFORMA_PUSH: "glovo"
  MODO_PUSH: "diario"
  MES_PUSH: ""
  UBER_PUSH: "0"
  UBER_MODO_PUSH: ""

on:
  workflow_dispatch:
    inputs:
      plataforma:
        description: "Plataforma"
        type: choice
        options: ["uber", "glovo", "todas"]
        default: "todas"
      modo:
        description: "diario | semanal | mensual | backfill"
        type: choice
        options: ["diario", "semanal", "mensual", "backfill"]
        default: "diario"
      mes:
        description: "Solo backfill: AAAA-MM (Uber/Glovo) o AAAA-Qn (Just Eat). Admite lista separada por comas."
        type: string
        default: ""
      simulacro:
        description: "1 = solo mira, no deja nada en la bandeja"
        type: choice
        options: ["0", "1"]
        default: "0"
  push:
    paths:
      - ".github/workflows/robots-plataformas.yml"
  schedule:
    - cron: "0 7 * * *"    # 09:00 Madrid · SOLO Glovo (el candado elige modo)
    - cron: "20 3 * * *"   # 05:20 Madrid (verano) / 04:20 (invierno) · SOLO Uber, UNA entrada al día (FASE17c). Antes: 30 18 * * * (retirado)

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      seguir: ${{ steps.candado.outputs.seguir }}
      modo: ${{ steps.candado.outputs.modo }}
      modo_uber: ${{ steps.candado.outputs.modo_uber }}
      solo_uber: ${{ steps.candado.outputs.solo_uber }}
      solo_glovo: ${{ steps.candado.outputs.solo_glovo }}
      pausar_uber: ${{ steps.enfriamiento.outputs.pausar_uber }}
    steps:
      - name: Candado por ventana y modo
        id: candado
        run: |
          H=$(TZ=Europe/Madrid date +%-H)
          D=$(TZ=Europe/Madrid date +%u)
          DIA=$(TZ=Europe/Madrid date +%d)
          echo "modo_uber=" >> $GITHUB_OUTPUT
          echo "solo_uber=0" >> $GITHUB_OUTPUT
          echo "solo_glovo=0" >> $GITHUB_OUTPUT
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "seguir=1" >> $GITHUB_OUTPUT
            echo "modo=${{ github.event.inputs.modo }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "seguir=1" >> $GITHUB_OUTPUT
            echo "modo=${{ env.MODO_PUSH }}" >> $GITHUB_OUTPUT
            echo "modo_uber=${{ env.UBER_MODO_PUSH }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          # FASE17c · pasada ÚNICA de Uber en hora valle. Se reconoce por el cron que la disparó (no por la hora:
          # GitHub retrasa los crons y una hora fija se equivocaría). Martes = semanal; día 5 = mensual; resto = diario.
          if [ "${{ github.event.schedule }}" = "20 3 * * *" ]; then
            MU=diario
            [ "$D" = "2" ] && MU=semanal
            [ "$DIA" = "05" ] && MU=mensual
            echo "seguir=1" >> $GITHUB_OUTPUT; echo "modo=diario" >> $GITHUB_OUTPUT
            echo "modo_uber=$MU" >> $GITHUB_OUTPUT; echo "solo_uber=1" >> $GITHUB_OUTPUT; exit 0
          fi
          # Desde aquí es la pasada de las 07:00 UTC: SOLO Glovo (sus modos no cambian).
          echo "solo_glovo=1" >> $GITHUB_OUTPUT
          if [ "$DIA" = "05" ] && [ "$H" -ge 5 ] && [ "$H" -le 13 ]; then
            echo "seguir=1" >> $GITHUB_OUTPUT; echo "modo=mensual" >> $GITHUB_OUTPUT; exit 0
          fi
          if [ "$D" = "1" ] && [ "$H" -ge 5 ] && [ "$H" -le 13 ]; then
            echo "seguir=1" >> $GITHUB_OUTPUT; echo "modo=semanal" >> $GITHUB_OUTPUT; exit 0
          fi
          if [ "$D" = "2" ] && [ "$H" -ge 5 ] && [ "$H" -le 13 ]; then
            echo "seguir=1" >> $GITHUB_OUTPUT
            echo "modo=diario" >> $GITHUB_OUTPUT   # FASE17c: ya no lleva modo_uber=semanal (Uber lo hace su pasada del martes)
            exit 0
          fi
          if [ "$H" -ge 4 ] && [ "$H" -le 11 ]; then
            echo "seguir=1" >> $GITHUB_OUTPUT; echo "modo=diario" >> $GITHUB_OUTPUT; exit 0
          fi
          echo "seguir=0" >> $GITHUB_OUTPUT
          echo "modo=" >> $GITHUB_OUTPUT

      # FASE17c · Reintento espaciado. Cuenta los retos de Cloudflare de Uber desde la última resiembra (autosembrada)
      # y dentro de las últimas 72 h. 0 o 1 reto: se reintenta mañana con normalidad. 2 o más: el reloj de Uber se para
      # (no se golpea más; Cloudflare castiga la insistencia) hasta que Rubén resiembre la sesión o lance el robot a mano.
      - name: Enfriamiento de Uber tras reto de Cloudflare
        id: enfriamiento
        if: github.event_name == 'schedule'
        env:
          SB_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          DESDE=$(date -u -d '72 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          sb() { curl -sf -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" "$SB_URL/rest/v1/$1" || echo '[]'; }
          SIEMBRA=$(sb "robot_log?fuente=eq.uber&estado=eq.autosembrada&ts=gte.$DESDE&select=ts&order=ts.desc&limit=1" | jq -r '.[0].ts // empty')
          DESDE_RETOS=${SIEMBRA:-$DESDE}
          N=$(sb "robot_log?fuente=eq.uber&estado=eq.reto_cloudflare&ts=gt.$DESDE_RETOS&select=id" | jq 'length')
          echo "retos de Cloudflare desde $DESDE_RETOS: $N"
          if [ "$N" -ge 2 ]; then echo "pausar_uber=1" >> $GITHUB_OUTPUT; else echo "pausar_uber=0" >> $GITHUB_OUTPUT; fi

  robot:
    needs: plan
    if: needs.plan.outputs.seguir == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        plataforma: ["uber", "glovo"]
    steps:
      - name: Jitter humano (minuto de arranque aleatorio)
        if: github.event_name == 'schedule'
        run: sleep $(( RANDOM % 901 ))
      - name: ¿Toca esta plataforma?
        id: toca
        run: |
          if [ "${{ needs.plan.outputs.solo_uber }}" = "1" ] && [ "${{ matrix.plataforma }}" != "uber" ]; then
            echo "si=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ "${{ needs.plan.outputs.solo_glovo }}" = "1" ] && [ "${{ matrix.plataforma }}" != "glovo" ]; then
            echo "si=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ matrix.plataforma }}" = "uber" ] && [ "${{ needs.plan.outputs.pausar_uber }}" = "1" ]; then
            echo "::warning::Uber en pausa: 2+ retos de Cloudflare seguidos. Rubén debe resembrar la sesión (docs/misiones/blindaje-conciliacion-cody/FASE17c-uber-glovo.md §B-b)."
            echo "si=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            P="${{ github.event.inputs.plataforma }}"
            if [ "$P" = "todas" ] || [ "$P" = "${{ matrix.plataforma }}" ]; then
              echo "si=1" >> $GITHUB_OUTPUT
            else
              echo "si=0" >> $GITHUB_OUTPUT
            fi
            exit 0
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            P="${{ env.PLATAFORMA_PUSH }}"
            if [ "$P" = "todas" ] || [ "$P" = "${{ matrix.plataforma }}" ]; then
              echo "si=1" >> $GITHUB_OUTPUT
              exit 0
            fi
            if [ "${{ matrix.plataforma }}" = "uber" ] && [ "${{ env.UBER_PUSH }}" = "1" ]; then
              echo "si=1" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "si=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "si=1" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        if: steps.toca.outputs.si == '1'
        with:
          repository: Streatlab/binagre
          ref: trabajo
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        if: steps.toca.outputs.si == '1'
        with:
          node-version: "20"
          cache: "npm"
      - name: Instalar dependencias
        if: steps.toca.outputs.si == '1'
        run: npm install --no-audit --no-fund
      - name: Cache navegador Playwright
        id: cache-playwright
        if: steps.toca.outputs.si == '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Instalar navegador Playwright
        if: steps.toca.outputs.si == '1' && steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Dependencias de sistema (con cache)
        if: steps.toca.outputs.si == '1' && steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Pantalla virtual (xvfb) para headful
        if: steps.toca.outputs.si == '1'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Descargar informes y dejarlos en la bandeja
        if: steps.toca.outputs.si == '1'
        env:
          MODO: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.modo || (github.event_name == 'push' && matrix.plataforma == 'uber' && env.UBER_MODO_PUSH) || (matrix.plataforma == 'uber' && needs.plan.outputs.modo_uber || needs.plan.outputs.modo) }}
          MES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mes || (matrix.plataforma == 'glovo' && env.MES_PUSH) || '' }}
          TRIMESTRE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mes || '' }}
          ROBOT_DRY: ${{ github.event.inputs.simulacro }}
          SUPABASE_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: xvfb-run -a npx tsx scripts/robot-ingesta/${{ matrix.plataforma }}.ts

      # 10-oct-2026 · Misión glovo-informes (orden de Rubén: opción «a», dentro del robot que ya corre).
      # Tras bajar las facturas, MISMO job, MISMO navegador instalado y MISMA sesión guardada de Glovo:
      # entra en Informes ▸ Historial, descarga los CSV programados y los vuelca al ERP.
      # continue-on-error: si este paso falla, NO tumba la ingesta de facturas de arriba.
      # 16-oct-2026: always() para que corra aunque la ingesta de facturas salga en rojo.
      - name: Glovo · informes programados del Historial (misma sesión)
        if: always() && steps.toca.outputs.si == '1' && matrix.plataforma == 'glovo'
        continue-on-error: true
        env:
          ROBOT_DRY: ${{ github.event.inputs.simulacro }}
          SUPABASE_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: xvfb-run -a npx tsx scripts/robot-ingesta/glovo-informes.ts
