name: Robots de plataforma (Uber / Glovo / Sinqro → bandeja)

# MUDADO desde Streatlab/binagre (02-ago): reloj público, código privado.
# Descarga informes/facturas a la bandeja de Papeleo. UNA línea de reloj; el
# candado decide el modo según el día. Scripts leen creds de robot_credenciales.
#
# palanca: 5 (05-ago · BACKFILL DIRIGIDO GLOVO jun+jul)
#   Qué se persigue: faltan las liquidaciones de jun-Q2 y jul-Q1 de la cuenta
#   streatlab para Comida Casera, Korean Chicken, Ninja Ramen y Tranqui es Green.
#   No están en ningún ZIP ya descargado, hay que volver a bajarlas del portal.
#   Dos fallos corregidos hoy en glovo.ts: (1) en backfill NUNCA se entraba en
#   finanzas(), así que un backfill jamás traía liquidaciones; (2) el rango de
#   Pagos salía de los chips de la página ("últimos 30 días"), que no alcanzan
#   un mes cerrado hace 6 semanas. Ahora MES admite lista y el rango va explícito.
#
# CÓMO SE USA LA PALANCA (empujar este fichero = corre):
#   MODO_PUSH        diario | semanal | mensual | backfill
#   MES_PUSH         solo backfill: "2026-06" o lista "2026-06,2026-07"
#   PLATAFORMA_PUSH  uber | glovo | sinqro | todas   (ahorra minutos de Actions)
#   Al terminar la corrida especial, DEVOLVER a: diario / "" / todas.
on:
  workflow_dispatch:
    inputs:
      plataforma:
        description: "Plataforma"
        type: choice
        options: ["uber", "glovo", "sinqro", "todas"]
        default: "todas"
      modo:
        description: "diario | semanal | mensual | backfill"
        type: choice
        options: ["diario", "semanal", "mensual", "backfill"]
        default: "diario"
      mes:
        description: "Solo backfill: AAAA-MM (Uber/Glovo/Sinqro) o AAAA-Qn (Just Eat). Glovo admite lista: 2026-06,2026-07"
        type: string
        default: ""
      simulacro:
        description: "1 = solo mira, no deja nada en la bandeja"
        type: choice
        options: ["0", "1"]
        default: "0"
  push:
    paths:
      - ".github/workflows/robots-plataformas.yml"
  schedule:
    - cron: "0 4 * * *"   # 06:00 Madrid (verano) / 05:00 (invierno) · el candado elige modo

env:
  MODO_PUSH: "backfill"
  MES_PUSH: "2026-06,2026-07"
  PLATAFORMA_PUSH: "glovo"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      seguir: ${{ steps.candado.outputs.seguir }}
      modo: ${{ steps.candado.outputs.modo }}
      modo_uber: ${{ steps.candado.outputs.modo_uber }}
      mes: ${{ steps.candado.outputs.mes }}
      plataforma: ${{ steps.candado.outputs.plataforma }}
    steps:
      - name: Candado por ventana y modo
        id: candado
        run: |
          H=$(TZ=Europe/Madrid date +%-H)
          D=$(TZ=Europe/Madrid date +%u)
          DIA=$(TZ=Europe/Madrid date +%d)
          echo "modo_uber=" >> $GITHUB_OUTPUT
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "seguir=1" >> $GITHUB_OUTPUT
            echo "modo=${{ github.event.inputs.modo }}" >> $GITHUB_OUTPUT
            echo "mes=${{ github.event.inputs.mes }}" >> $GITHUB_OUTPUT
            echo "plataforma=${{ github.event.inputs.plataforma }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "seguir=1" >> $GITHUB_OUTPUT
            echo "modo=${MODO_PUSH:-diario}" >> $GITHUB_OUTPUT
            echo "mes=${MES_PUSH}" >> $GITHUB_OUTPUT
            echo "plataforma=${PLATAFORMA_PUSH:-todas}" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "mes=" >> $GITHUB_OUTPUT
          echo "plataforma=todas" >> $GITHUB_OUTPUT
          if [ "$DIA" = "05" ] && [ "$H" -ge 5 ] && [ "$H" -le 13 ]; then
            echo "seguir=1" >> $GITHUB_OUTPUT; echo "modo=mensual" >> $GITHUB_OUTPUT; exit 0
          fi
          if [ "$D" = "1" ] && [ "$H" -ge 5 ] && [ "$H" -le 13 ]; then
            echo "seguir=1" >> $GITHUB_OUTPUT; echo "modo=semanal" >> $GITHUB_OUTPUT; exit 0
          fi
          if [ "$D" = "2" ] && [ "$H" -ge 5 ] && [ "$H" -le 13 ]; then
            echo "seguir=1" >> $GITHUB_OUTPUT
            echo "modo=diario" >> $GITHUB_OUTPUT
            echo "modo_uber=semanal" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ "$H" -ge 4 ] && [ "$H" -le 11 ]; then
            echo "seguir=1" >> $GITHUB_OUTPUT; echo "modo=diario" >> $GITHUB_OUTPUT; exit 0
          fi
          echo "seguir=0" >> $GITHUB_OUTPUT
          echo "modo=" >> $GITHUB_OUTPUT

  robot:
    needs: plan
    if: needs.plan.outputs.seguir == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        plataforma: ["uber", "glovo", "sinqro"]
    steps:
      - name: ¿Toca esta plataforma?
        id: toca
        run: |
          P="${{ needs.plan.outputs.plataforma }}"
          if [ -z "$P" ] || [ "$P" = "todas" ] || [ "$P" = "${{ matrix.plataforma }}" ]; then
            echo "si=1" >> $GITHUB_OUTPUT
          else
            echo "si=0" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.toca.outputs.si == '1'
        with:
          repository: Streatlab/binagre
          ref: trabajo
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        if: steps.toca.outputs.si == '1'
        with:
          node-version: "20"
          cache: "npm"
      - name: Instalar dependencias
        if: steps.toca.outputs.si == '1'
        run: npm install --no-audit --no-fund
      - name: Cache navegador Playwright
        id: cache-playwright
        if: steps.toca.outputs.si == '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Instalar navegador Playwright
        if: steps.toca.outputs.si == '1' && steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Dependencias de sistema (con cache)
        if: steps.toca.outputs.si == '1' && steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Pantalla virtual (xvfb) para headful
        if: steps.toca.outputs.si == '1'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Descargar informes y dejarlos en la bandeja
        if: steps.toca.outputs.si == '1'
        env:
          MODO: ${{ (matrix.plataforma == 'uber' && needs.plan.outputs.modo_uber) || needs.plan.outputs.modo }}
          MES: ${{ needs.plan.outputs.mes }}
          TRIMESTRE: ${{ needs.plan.outputs.mes }}
          ROBOT_DRY: ${{ github.event.inputs.simulacro }}
          SUPABASE_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: xvfb-run -a npx tsx scripts/robot-ingesta/${{ matrix.plataforma }}.ts
