name: Glovo · sonda de valoraciones (diagnóstico)

# 12-ago-2026 · Ampliación glovo-verdad-total. No hay ni una URL probada ni
# una columna vista de las valoraciones de Glovo en todo el repo. Esta sonda
# entra en el portal, vuelca el menú completo del sidebar a robot_log (fuente
# 'glovo_valoraciones_sonda') y prueba rutas candidatas. Solo lee: no toca
# ninguna tabla de negocio. Mismo patrón headful+xvfb que robots-plataformas.yml
# (PerimeterX lo pide).

on:
  workflow_dispatch:
    inputs:
      cuenta:
        description: "Nombre de la cuenta (vacío = la primera activa)"
        type: string
        required: false

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Streatlab/binagre
          ref: trabajo
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Cache navegador Playwright
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Instalar navegador Playwright
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Dependencias de sistema (con cache)
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Pantalla virtual (xvfb) para headful
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Ejecutar la sonda
        env:
          SUPABASE_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CUENTA: ${{ github.event.inputs.cuenta }}
        run: xvfb-run -a npx tsx scripts/robot-ingesta/glovo-valoraciones-sonda.ts
