name: Uber · promo en Ads Manager (a mano)

# 30-oct-2026 · Carta maestra, tarea 2 (orden de Rubén: "completa para trabajar con el ads manager...
# creas una promo x y la publicas, y me avisas").
# Entra a advertiser.uber.com con la sesion sembrada, crea UNA promo de prueba inocua (30 % del pedido con
# gasto minimo 30 EUR, SOLO Keko Poke, hasta manana, tope 10 EUR/semana) y la publica. Antes de confirmar
# comprueba el resumen (nombre, 1 ubicacion, presupuesto); si no cuadra, para sin confirmar.
# 30-oct-2026 PROTEGIDO (traspaso de trabajo): sin disparador push y publicar=0 por defecto.
# Solo workflow_dispatch a mano y con publicar=1 EXPLICITO publica. El push a este archivo ya NO lanza nada.
# Comparte candado con uber-pantallas (una sesion a la vez).
# Arranque IGUAL que robots-plataformas.yml: WARP + Camoufox.
# palanca: 2

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: "1 = publica; 0 = llega al resumen y no confirma"
        type: string
        default: "0"
      tienda:
        description: "Tienda de la promo (texto del desplegable de ubicaciones)"
        type: string
        default: "Keko Poke"

concurrency:
  group: uber-pantallas
  cancel-in-progress: false

jobs:
  promo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Streatlab/binagre
          ref: trabajo
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm install --no-audit --no-fund
      - name: Cache navegador Playwright
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Navegador y dependencias
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb
          npx playwright install --with-deps chromium

      - name: Uber · salir por WARP
        continue-on-error: true
        shell: bash +e {0}
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list > /dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp > warp.log 2>&1 || { echo "WARP no instala"; exit 0; }
          sudo warp-cli --accept-tos registration new >> warp.log 2>&1
          sudo warp-cli --accept-tos connect >> warp.log 2>&1
          for i in $(seq 1 20); do
            curl -s --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | grep -q "warp=on" && { echo "WARP ok"; exit 0; }
            sleep 3
          done
          echo "WARP no conecta, sigo con la salida de siempre"
      - name: Uber · Camoufox (instalar, alinear Playwright y levantar)
        continue-on-error: true
        shell: bash +e {0}
        run: |
          (pip install --quiet "camoufox[geoip]" || pip install --quiet camoufox) && python -m camoufox fetch || { echo "Camoufox no instala"; exit 0; }
          VER=$(python3 -c "import importlib.metadata as m; print(m.version('playwright'))" 2>/dev/null || echo "")
          if [ -n "$VER" ]; then npm install --no-save --no-audit --no-fund "playwright@$VER" "playwright-core@$VER"; fi
          cat > servidor_camoufox.py <<'PY'
          import traceback
          from camoufox.server import launch_server
          PREFS = {
              "network.cookie.cookieBehavior": 0,
              "privacy.partition.network_state": False,
              "privacy.trackingprotection.enabled": False,
              "privacy.trackingprotection.pbmode.enabled": False,
          }
          BASE = dict(headless=False, os=["windows"], humanize=True, geoip=True, port=4545, ws_path="binagre")
          for nombre, extra in [("cookies abiertas + permiso", dict(firefox_user_prefs=PREFS, i_know_what_im_doing=True)),
                                ("cookies abiertas", dict(firefox_user_prefs=PREFS)), ("sin tocar cookies", dict())]:
              try:
                  print(f"ARRANQUE probando: {nombre}", flush=True)
                  launch_server(**BASE, **extra)
                  break
              except Exception as e:
                  print(f"ARRANQUE fallo con '{nombre}': {e}", flush=True)
                  traceback.print_exc()
          PY
          nohup xvfb-run -a python servidor_camoufox.py > camoufox_servidor.log 2>&1 &
          cat > espera_puerto.py <<'PY'
          import socket, sys
          for fam, host in ((socket.AF_INET6, "::1"), (socket.AF_INET, "127.0.0.1")):
              s = socket.socket(fam, socket.SOCK_STREAM); s.settimeout(1)
              try:
                  s.connect((host, 4545)); print("[" + host + "]" if fam == socket.AF_INET6 else host); sys.exit(0)
              except OSError:
                  pass
              finally:
                  s.close()
          sys.exit(1)
          PY
          for i in $(seq 1 120); do
            if HOST=$(python3 espera_puerto.py); then
              echo "CAMOUFOX_WS=ws://${HOST}:4545/binagre" >> $GITHUB_ENV
              echo "Camoufox arriba en $HOST"; exit 0
            fi
            sleep 1
          done
          echo "Camoufox no levanta, sigue con Chromium"; tail -c 1500 camoufox_servidor.log

      - name: Promo de prueba en Ads Manager
        env:
          UBER_ANUNCIANTES_PUBLICAR: ${{ github.event.inputs.publicar || '0' }}
          UBER_ANUNCIANTES_TIENDA: ${{ github.event.inputs.tienda || 'Keko Poke' }}
          SUPABASE_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: xvfb-run -a npx tsx scripts/robot-ingesta/uber-anunciantes-promo.ts
      - name: Capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uber-anunciantes-promo
          path: capturas/
          retention-days: 14
