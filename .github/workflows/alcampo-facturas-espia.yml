name: Alcampo facturas · espía (solo mira)

# 04-oct-2026 · reconocimiento. No cambia nada.
# palanca: 9 (inventario histórico del buzón admin@streatlab.com)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/alcampo-facturas-espia.yml"

jobs:
  espia:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Streatlab/binagre
          ref: trabajo
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Inventario buzón admin
        env:
          SUPABASE_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/robot-alcampo-facturas/inventario-buzon.ts
