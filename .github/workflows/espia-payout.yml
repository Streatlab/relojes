name: Espía payout Glovo (puntual)

# 05-ago-2026 · Herramienta puntual: extrae el TEXTO real de payout PDF de
# Glovo a robot_log para poder escribir/arreglar su lector con datos reales.
# corrida 2: los 6 ZIP streatlab de pago único (13-jul) que salieron
# "sin pareja xlsx+pdf legible" en el rescate — ver qué traen de verdad.
on:
  push:
    paths:
      - ".github/workflows/espia-payout.yml"
  workflow_dispatch:

jobs:
  espia:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Streatlab/binagre
          ref: trabajo
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm install --no-audit --no-fund
      - name: Extraer texto de payouts a robot_log
        env:
          SUPABASE_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OBJETIVOS: "glovo/glovo_finanzas_2026-07-15_2026-07-15T22-09-11-329Z.zip,glovo/glovo_finanzas_2026-07-15_2026-07-15T22-09-14-054Z.zip,glovo/glovo_finanzas_2026-07-15_2026-07-15T22-09-16-729Z.zip,glovo/glovo_finanzas_2026-07-15_2026-07-15T22-09-19-086Z.zip,glovo/glovo_finanzas_2026-07-15_2026-07-15T22-09-21-573Z.zip,glovo/glovo_finanzas_2026-07-15_2026-07-15T22-09-24-147Z.zip"
        run: npx tsx scripts/robot-ingesta/espia-payout.ts
