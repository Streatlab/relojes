name: Robot Listo · Sinqro (Glovo + Just Eat · cadencia humana)

# ══════════════════════════════════════════════════════════════════════════
# 21-ago-2026 · REACTIVACIÓN CON AUTORIZACIÓN ESCRITA DE SINQRO.
# El 14-ago se apagó TODA automatización sobre Sinqro por su requerimiento
# formal. Sinqro ha AUTORIZADO POR ESCRITO el marcado de "Listo" por robot, con
# la condición de que sea suave y no cargue su sistema. Este disparador cumple
# esa condición (doctrina "Robots buen ciudadano", 16-ago):
#   · ritmo bajo: vuelta del bucle 118-251 s (no ráfaga),
#   · pausa humana entre clics 1-4 s (Rubén, 29-ago),
#   · una sola sesión, dentro del horario de servicio,
#   · marca "Listo" 17 s después de ver el pedido.
# Guardar el email de autorización de Sinqro como respaldo del cese/reanudación.
#
# ── LA REACTIVACIÓN NO FUNCIONÓ HASTA EL 21-ago 17:14 ─────────────────────
# Reactivar el disparador no bastó: la fila de sinqro en `robot_credenciales`
# se quedó con `activo=false` desde el apagón del 14-ago. El curl de abajo pide
# `activo=eq.true`, no recibía nada, y `jq -r` sobre un resultado vacío devuelve
# el TEXTO "null" (que es truthy). El robot mandó literalmente null/null al
# formulario de Sinqro 110 veces en 30 horas. Sin credencial utilizable, la
# corrida se para en rojo.
#
# ══════════════════════════════════════════════════════════════════════════
# 22-ago-2026 · ESTE FRENTE SE SALVÓ POR NUEVE MINUTOS DE SUERTE.
# El 22-ago Rushour murió por dos minutos ("fuera de ventana") y se quedó sin
# robot hasta las 15:45. Este job lleva el mismo cron y el mismo script; no
# cayó porque su runner tardó nueve minutos más en levantar. Eso no es un
# diseño, es una moneda al aire. ARREGLO: si el job arranca antes de la
# apertura, ESPERA a que abra en vez de morirse. Tope 2h30.
# ══════════════════════════════════════════════════════════════════════════
#
# ══════════════════════════════════════════════════════════════════════════
# 29-ago-2026 (2) · HOY NO HA ARRANCADO. Y NADIE SE ENTERÓ.
#
# Medido en `robot_log`: el último `inicio` del frente Sinqro es de las 06:07
# Madrid ("fuera de ventana", se apaga y termina, correcto). El relevo de las
# 11:05, que es el que cubre TODO el servicio de comida, NO EXISTE: ni `inicio`,
# ni `fuera de ventana`, ni error. El cron no llegó a lanzar el script. Con el
# local abierto desde las 11:30, Glovo y Just Eat se han quedado sin nadie que
# marque.
#
# DOS ARREGLOS, porque el problema es doble:
#
#   1. MÁS RELEVOS. Un solo cron por tramo significa que si ese arranque se
#      pierde —GitHub retrasa o descarta schedules cuando hay cola, y es un
#      comportamiento documentado, no una avería— el frente se queda MUDO
#      HASTA EL SIGUIENTE TRAMO: cuatro horas y media sin robot. Ahora hay un
#      segundo cron 25 min después de cada uno. Si el primero entró, el
#      segundo se va solo en el acto (`relevo_cedido`): no cuesta nada.
#
#   2. LATIDO DE ARRANQUE. El script solo escribe cuando llega a ejecutarse; si
#      el job muere antes (instalación, credenciales, runner que no levanta),
#      no queda rastro en el ERP y el fallo es invisible. Ahora el propio
#      workflow apunta en `robot_log` que ha arrancado ANTES de instalar nada.
#      Un turno que no aparece en el log ya no puede pasar desapercibido.
#
# palanca: 4 (29-ago · relevos dobles + latido de arranque + relevo inmediato)
# ══════════════════════════════════════════════════════════════════════════
#
# AÍSLA a Rushour: este workflow NO toca sinqro-listo.yml (Robot Listo Uber),
# que queda intacto. Aquí solo corre FRENTE=sinqro con su propia cadencia.
#
# HORARIO: la ventana sale de la BASE DE DATOS (horario_local, vía
# _lib/ventanaServicio.ts). Si hoy está cerrado o fuera de horas, el robot no
# marca (latido "fuera de ventana").
#
# CADENCIA ALEATORIA POR VUELTA: se pasan los RANGOS (BUCLE_MIN/BUCLE_MAX y
# PAUSA_MIN_MS/PAUSA_MAX_MS) y el script sortea de nuevo en CADA vuelta y en
# CADA clic, así ni dos vueltas del mismo turno repiten intervalo.
#
# PALANCA por push: tocar este archivo lanza un relevo YA en modo servicio.
on:
  schedule:
    - cron: "5 9 * * *"
    - cron: "30 9 * * *"
    - cron: "45 13 * * *"
    - cron: "10 14 * * *"
    - cron: "25 18 * * *"
    - cron: "50 18 * * *"
    - cron: "5 23 * * *"
  push:
    paths:
      - ".github/workflows/sinqro-listo-glovo.yml"
  workflow_dispatch:
    inputs:
      modo:
        description: "reconocimiento (volcar DOM, no toca nada) | simulacro | servicio"
        type: choice
        options: ["reconocimiento", "simulacro", "servicio"]
        default: "reconocimiento"
      ventana:
        description: "Ventana HH:MM-HH:MM (vacío = horario del ERP)"
        type: string
        default: ""

jobs:
  listo-sinqro:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      # LATIDO DE ARRANQUE (29-ago). Lo primero de todo: si el job muere en la
      # instalación o en las credenciales, en el ERP queda constancia de que
      # este turno existió. Hoy se perdió un servicio entero sin una sola línea.
      - name: Latido de arranque
        env:
          SB_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          jq -n --arg d "turno de Sinqro arrancado en GitHub ($(TZ=Europe/Madrid date '+%H:%M') Madrid, evento ${{ github.event_name }}) · aún sin instalar nada" \
            '{fuente:"robot_listo",estado:"job_arranca_sinqro",detalle:$d}' \
          | curl -s -X POST "$SB_URL/rest/v1/robot_log" \
              -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" \
              -H "Content-Type: application/json" --data-binary @- > /dev/null || true

      - name: Plan (ventana desde horario_local del ERP)
        id: plan
        env:
          SB_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          DOW=$(TZ=Europe/Madrid date +%u)
          FILA=$(curl -sf "$SB_URL/rest/v1/horario_local?dia_semana=eq.$DOW&select=abre,cierra,cerrado" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" || echo '')
          ABRE=$(echo "$FILA" | jq -r '.[0].abre // empty' | cut -c1-5)
          CIERRA=$(echo "$FILA" | jq -r '.[0].cierra // empty' | cut -c1-5)
          CERRADO=$(echo "$FILA" | jq -r '.[0].cerrado // false')
          if [ -z "$ABRE" ] || [ -z "$CIERRA" ]; then ABRE="11:00"; CIERRA="00:00"; CERRADO="false"; fi
          C=$((10#${CIERRA%%:*}*60+10#${CIERRA##*:})); C=$(( (C + 30) % 1440 ))
          CIERRA_G=$(printf "%02d:%02d" $((C/60)) $((C%60)))
          VENTANA_ERP="$ABRE-$CIERRA_G"

          # ── LLEGAR PRONTO NO PUEDE MATAR AL ROBOT (22-ago) ──────────────
          AHORA=$(TZ=Europe/Madrid date +%H:%M)
          MIN_ABRE=$((10#${ABRE%%:*}*60+10#${ABRE##*:}))
          MIN_AHORA=$((10#${AHORA%%:*}*60+10#${AHORA##*:}))
          ESPERA=0
          if [ "$MIN_AHORA" -lt "$MIN_ABRE" ]; then
            ESPERA=$(( (MIN_ABRE - MIN_AHORA) * 60 + 90 ))   # +90s de colchón
          fi
          # Tope 2h30: más que eso no es "he llegado pronto", es un arranque
          # que no corresponde a este turno. Mejor terminar que dormir medio día.
          if [ "$ESPERA" -gt 9000 ]; then ESPERA=0; fi
          echo "espera=$ESPERA" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "seguir=1" >> $GITHUB_OUTPUT
            echo "modo=${{ github.event.inputs.modo }}" >> $GITHUB_OUTPUT
            V="${{ github.event.inputs.ventana }}"
            if [ -z "$V" ]; then V="$VENTANA_ERP"; fi
            echo "ventana=$V" >> $GITHUB_OUTPUT
          else
            if [ "$CERRADO" = "true" ]; then echo "seguir=0" >> $GITHUB_OUTPUT; echo "Hoy cerrado según configuración"; exit 0; fi
            echo "seguir=1" >> $GITHUB_OUTPUT
            echo "modo=servicio" >> $GITHUB_OUTPUT
            echo "ventana=$VENTANA_ERP" >> $GITHUB_OUTPUT
          fi
          echo "Ventana usada: $VENTANA_ERP · ahora $AHORA Madrid · espera ${ESPERA}s antes de arrancar"

      - uses: actions/checkout@v4
        if: steps.plan.outputs.seguir == '1'
        with:
          repository: Streatlab/binagre
          ref: trabajo
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        if: steps.plan.outputs.seguir == '1'
        with:
          node-version: "20"
          cache: "npm"
      - name: Instalar dependencias
        if: steps.plan.outputs.seguir == '1'
        run: npm install --no-audit --no-fund
      - name: Cache navegador Playwright
        id: cache-playwright
        if: steps.plan.outputs.seguir == '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Instalar navegador Playwright
        if: steps.plan.outputs.seguir == '1' && steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Dependencias de sistema (con cache)
        if: steps.plan.outputs.seguir == '1' && steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Pantalla virtual (xvfb)
        if: steps.plan.outputs.seguir == '1'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Credenciales Sinqro desde el ERP
        if: steps.plan.outputs.seguir == '1'
        env:
          SB_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          R=$(curl -sf "$SB_URL/rest/v1/robot_credenciales?plataforma=eq.sinqro&activo=eq.true&select=usuario,password&limit=1" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY")
          # `// empty` NO SE PUEDE QUITAR. Sin el, `jq -r` sobre un resultado vacio
          # devuelve el TEXTO "null", que es truthy: el 14-ago la fila de sinqro quedo
          # con activo=false y el robot estuvo mandando literalmente null/null al
          # formulario de Sinqro, 110 veces en 30 horas.
          U=$(echo "$R" | jq -r '.[0].usuario // empty'); P=$(echo "$R" | jq -r '.[0].password // empty')
          echo "::add-mask::$P"
          if [ -z "$U" ] || [ -z "$P" ]; then
            jq -n '{fuente:"robot_listo",estado:"job_sin_credencial_sinqro",detalle:"el turno muere: no hay credencial ACTIVA de sinqro en robot_credenciales"}' \
            | curl -s -X POST "$SB_URL/rest/v1/robot_log" \
                -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" \
                -H "Content-Type: application/json" --data-binary @- > /dev/null || true
            echo "::error::No hay credencial ACTIVA de sinqro en robot_credenciales (revisa activo)."
            exit 1
          fi
          echo "SINQRO_USER=$U" >> $GITHUB_ENV
          echo "SINQRO_PASS=$P" >> $GITHUB_ENV

      # EL ROBOT ESPERA A QUE ABRA EL LOCAL EN VEZ DE JUGÁRSELA (22-ago).
      # Va DESPUÉS de instalar todo a propósito: mientras se instalan node,
      # Playwright y Chromium ya se está consumiendo parte de la espera.
      - name: Esperar a que abra el local
        if: steps.plan.outputs.seguir == '1' && steps.plan.outputs.espera != '0'
        run: |
          echo "El local aún no ha abierto. Espero ${{ steps.plan.outputs.espera }}s y arranco con la ventana abierta."
          sleep ${{ steps.plan.outputs.espera }}

      # continue-on-error: el fin de turno por presupuesto de tiempo es normal
      # (pasa el relevo al siguiente arranque). No es avería: no debe generar
      # correo de "Run failed". Las averías reales quedan en robot_log.
      - name: Vigilar y marcar (Sinqro)
        if: steps.plan.outputs.seguir == '1'
        continue-on-error: true
        env:
          MODO: ${{ steps.plan.outputs.modo }}
          FRENTE: "sinqro"
          LISTO_TRAS_SEG: "17"
          BUCLE_MIN: "118"
          BUCLE_MAX: "251"
          # 29-ago (Rubén, orden literal): los CUATRO botones de la cadena se
          # pulsan de IZQUIERDA A DERECHA con una cadencia ALEATORIA de 1 a 4
          # segundos entre pulsación y pulsación. Deroga el rango 2-6 s del
          # 28-ago. El sorteo es por clic (`pausaMs()` en sinqro-listo.ts): no
          # se repite ningún intervalo. No tocar sin que Rubén lo diga.
          PAUSA_MIN_MS: "1000"
          PAUSA_MAX_MS: "4000"
          MAX_MIN_JOB: "290"
          SITIO: "STREAT LAB"
          SUPABASE_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: xvfb-run -a npx tsx scripts/robot-ingesta/sinqro-listo.ts
