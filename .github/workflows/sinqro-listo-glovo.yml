name: Robot Listo · Sinqro (Glovo + Just Eat · cadencia humana)

# ══════════════════════════════════════════════════════════════════════════
# 21-ago-2026 · REACTIVACIÓN CON AUTORIZACIÓN ESCRITA DE SINQRO.
# El 14-ago se apagó TODA automatización sobre Sinqro por su requerimiento
# formal. Sinqro ha AUTORIZADO POR ESCRITO el marcado de "Listo" por robot, con
# la condición de que sea suave y no cargue su sistema. Este disparador cumple
# esa condición (doctrina "Robots buen ciudadano", 16-ago):
#   · ritmo bajo: vuelta del bucle 118-251 s (no ráfaga),
#   · pausa humana entre clics 1-4 s (Rubén, 29-ago),
#   · una sola sesión, dentro del horario de servicio,
#   · marca "Listo" 17 s después de ver el pedido.
# Guardar el email de autorización de Sinqro como respaldo del cese/reanudación.
#
# OJO: más disparos NO significa más carga para Sinqro. Solo UN robot barre a la
# vez; el que llega y encuentra a otro trabajando se va sin tocar el tablero
# (`relevo_cedido`). Lo que cambia es que nunca falte robot, no el ritmo.
#
# ── LA REACTIVACIÓN NO FUNCIONÓ HASTA EL 21-ago 17:14 ─────────────────────
# Reactivar el disparador no bastó: la fila de sinqro en `robot_credenciales`
# se quedó con `activo=false` desde el apagón del 14-ago. El curl de abajo pide
# `activo=eq.true`, no recibía nada, y `jq -r` sobre un resultado vacío devuelve
# el TEXTO "null" (que es truthy). El robot mandó literalmente null/null al
# formulario de Sinqro 110 veces en 30 horas. Sin credencial utilizable, la
# corrida se para en rojo.
#
# ══════════════════════════════════════════════════════════════════════════
# 31-ago-2026 · MEDIODÍA DE LUNES SIN ROBOT EN SINQRO. Medido en `robot_log`:
# el último `job_arranca_sinqro` fue a las 02:47 Madrid y NO HUBO NI UNO en
# todo el servicio de comida (12:00→16:15), con los candidatos de cada media
# hora escritos y el local abierto. El mismo día pasó igual en Rushour ("ningún
# cron de la mañana entró") y en el lector de horario ("hoy solo 1 de 12
# pasadas"). No es este archivo: ES QUE LOS CRONS DE GITHUB NO SON UNA
# GARANTÍA, y en este repo se están cayendo casi todos.
#
# LA REGLA QUE SALE DE AQUÍ: EL SERVICIO NO PUEDE DEPENDER DE UN CRON.
#
# CUATRO CANDADOS, por orden de importancia:
#   1) RELEVO ENCADENADO (paso final). Cuando un turno termina, ÉL MISMO llama
#      al siguiente por la API de GitHub. Un `workflow_dispatch` se ejecuta
#      siempre: no es un cron, no se descarta. Con esto el cron solo hace falta
#      para el PRIMER turno del día. Guarda anti-bucle: solo encadena si el
#      turno ha durado más de 30 min y el local sigue abierto; si murió antes,
#      no se encadena y entra el vigilante, que sabe por qué.
#   2) MINUTOS RAROS. GitHub congestiona las horas en punto y las medias: los
#      crons a :00 y :30 son los primeros que descarta. Ahora :07 :22 :37 :52.
#   3) LA VENTANA SALE DE `horario_dia`, la tabla diaria que manda para todos
#      los robots y que respeta los tramos partidos (hoy 12:00-16:15 y
#      20:00-23:45). `horario_local`, la semanal, queda solo de red.
#   4) `concurrency`: un solo turno vivo, para poder poner todos los disparos
#      que hagan falta sin que se junten dos robots pulsando.
#
# Y por encima de todo esto sigue estando `vigilante-listo.yml`, que cada 10
# min mira si hay barridos y relanza si no. Son cuatro redes independientes:
# tienen que fallar las cuatro para que un servicio se quede sin robot.
#
# palanca: 9 (31-ago · relevo encadenado + minutos raros)
# ══════════════════════════════════════════════════════════════════════════
#
# ══════════════════════════════════════════════════════════════════════════
# 30-ago-2026 · EL CALENDARIO LO MANDA EL HORARIO REAL, NO UNOS CRONES A MANO.
# Los crones estaban escritos a ojo intentando adivinar el horario del local.
# Medido ese día: el turno cerró a las 17:59 Madrid y el siguiente cron no
# entraba hasta las 20:25 → DOS HORAS Y MEDIA de tarde sin nadie marcando.
#
# LA REGLA: si el horario del local cambia, NO SE TOCA ESTE ARCHIVO. Se cambia
# en el ERP y los robots lo siguen solos en la vuelta siguiente.
# ══════════════════════════════════════════════════════════════════════════
#
# ══════════════════════════════════════════════════════════════════════════
# 29-ago-2026 · LOS 17 SEGUNDOS NO SE CUMPLÍAN NUNCA (Rubén: «hablamos de unas
# cadencias explícitas pero no trabajan»). Los pedidos 843, 225 y 251 se
# marcaron a los 239 s, 224 s y 444 s de verlos, con LISTO_TRAS_SEG=17. La causa
# no era este reloj: al ver un pedido nuevo el script lo apuntaba y lo dejaba
# para la vuelta siguiente (118-251 s). ARREGLO en `sinqro-listo.ts` (`pasada`,
# commit 4aafa20): el pedido entra en la cola en cuanto se ve y lo que le falte
# de espera se duerme ahí mismo, antes de pulsar. VERIFICADO el 30-ago 17:03:
# «sinqro 286: los cuatro marcados · 17s desde que se vio».
#
# OJO SI ALGÚN DÍA SE SUBE LISTO_TRAS_SEG: mientras espera, el robot no mira el
# resto del tablero. Con 17 s da igual; con minutos habría que replantearlo.
# ══════════════════════════════════════════════════════════════════════════
#
# ══════════════════════════════════════════════════════════════════════════
# 22-ago-2026 · LLEGAR PRONTO NO PUEDE MATAR AL ROBOT. El 22-ago Rushour murió
# por dos minutos ("fuera de ventana") y se quedó sin robot hasta las 15:45. Si
# el job arranca antes de la apertura, ESPERA a que abra en vez de morirse.
# ══════════════════════════════════════════════════════════════════════════
#
# AÍSLA a Rushour: este workflow NO toca sinqro-listo.yml (Robot Listo Uber),
# que queda intacto. Aquí solo corre FRENTE=sinqro con su propia cadencia.
#
# PALANCA por push: tocar este archivo lanza un relevo YA en modo servicio.
on:
  schedule:
    # MINUTOS RAROS (31-ago): :00 y :30 son los que GitHub más descarta. El
    # rango horario es solo el sobre exterior (cubre verano e invierno); quien
    # decide de verdad es `horario_dia` en el paso "Plan".
    - cron: "7,22,37,52 9-23 * * *"
  push:
    paths:
      - ".github/workflows/sinqro-listo-glovo.yml"
  workflow_dispatch:
    inputs:
      modo:
        description: "reconocimiento (volcar DOM, no toca nada) | simulacro | servicio"
        type: choice
        options: ["reconocimiento", "simulacro", "servicio"]
        default: "reconocimiento"
      ventana:
        description: "Ventana HH:MM-HH:MM (vacío = horario del ERP)"
        type: string
        default: ""

# UN SOLO TURNO VIVO (31-ago). Si ya hay uno barriendo, el nuevo espera en la
# puerta en vez de ponerse a pulsar en paralelo. GitHub solo guarda UN pendiente
# por grupo, así que tampoco se acumula una cola.
concurrency:
  group: robot-listo-sinqro
  cancel-in-progress: false

jobs:
  listo-sinqro:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    env:
      SB_URL: https://eryauogxcpbgdryeimdq.supabase.co
      SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      # LATIDO DE ARRANQUE (29-ago). Lo primero de todo: si el job muere en la
      # instalación o en las credenciales, en el ERP queda constancia de que
      # este turno existió. El 29-ago se perdió un servicio sin una sola línea.
      - name: Latido de arranque
        run: |
          date -u +%s > /tmp/t0
          jq -n --arg d "turno de Sinqro arrancado en GitHub ($(TZ=Europe/Madrid date '+%H:%M') Madrid, evento ${{ github.event_name }}) · aún sin instalar nada · palanca 9" \
            '{fuente:"robot_listo",estado:"job_arranca_sinqro",detalle:$d}' \
          | curl -s -X POST "$SB_URL/rest/v1/robot_log" \
              -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" \
              -H "Content-Type: application/json" --data-binary @- > /dev/null || true

      - name: Plan (ventana desde horario_dia del ERP)
        id: plan
        run: |
          # 31-ago: manda `horario_dia` (diaria, con tramos partidos), la misma
          # tabla que lee el script. `horario_local` (semanal) queda de red por
          # si el lector de Glovo no ha escrito el día: antes una ventana algo
          # ancha que un servicio entero sin robot.
          HOY=$(TZ=Europe/Madrid date +%F)
          DIA=$(curl -sf "$SB_URL/rest/v1/horario_dia?fecha=eq.$HOY&select=cerrado,tramos" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" || echo '')
          ABRE=$(echo "$DIA" | jq -r '.[0].tramos[0].abre // empty' | cut -c1-5)
          CIERRA=$(echo "$DIA" | jq -r '.[0].tramos[-1].cierra // empty' | cut -c1-5)
          CERRADO=$(echo "$DIA" | jq -r '.[0].cerrado // false')
          ORIGEN="horario_dia"
          if [ -z "$ABRE" ] || [ -z "$CIERRA" ]; then
            ORIGEN="horario_local (red)"
            DOW=$(TZ=Europe/Madrid date +%u)
            FILA=$(curl -sf "$SB_URL/rest/v1/horario_local?dia_semana=eq.$DOW&select=abre,cierra,cerrado" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" || echo '')
            ABRE=$(echo "$FILA" | jq -r '.[0].abre // empty' | cut -c1-5)
            CIERRA=$(echo "$FILA" | jq -r '.[0].cierra // empty' | cut -c1-5)
            CERRADO=$(echo "$FILA" | jq -r '.[0].cerrado // false')
          fi
          if [ -z "$ABRE" ] || [ -z "$CIERRA" ]; then ABRE="11:00"; CIERRA="00:00"; CERRADO="false"; ORIGEN="por defecto"; fi
          C=$((10#${CIERRA%%:*}*60+10#${CIERRA##*:})); C=$(( (C + 30) % 1440 ))
          CIERRA_G=$(printf "%02d:%02d" $((C/60)) $((C%60)))
          VENTANA_ERP="$ABRE-$CIERRA_G"
          echo "cierre=$CIERRA_G" >> $GITHUB_OUTPUT

          AHORA=$(TZ=Europe/Madrid date +%H:%M)
          MIN_ABRE=$((10#${ABRE%%:*}*60+10#${ABRE##*:}))
          MIN_AHORA=$((10#${AHORA%%:*}*60+10#${AHORA##*:}))
          MIN_CIERRA=$((10#${CIERRA_G%%:*}*60+10#${CIERRA_G##*:}))

          # ── EL CANDIDATO SE APAGA SOLO SI NO LE TOCA (30-ago) ───────────
          if [ "$CERRADO" = "true" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "seguir=0" >> $GITHUB_OUTPUT; echo "Hoy el local está cerrado según el ERP"; exit 0
          fi

          # ── LLEGAR PRONTO NO PUEDE MATAR AL ROBOT (22-ago) ──────────────
          ESPERA=0
          if [ "$MIN_AHORA" -lt "$MIN_ABRE" ]; then
            FALTAN=$(( MIN_ABRE - MIN_AHORA ))
            if [ "$FALTAN" -le 35 ]; then
              ESPERA=$(( FALTAN * 60 + 90 ))   # +90s de colchón
            else
              echo "seguir=0" >> $GITHUB_OUTPUT
              echo "Faltan $FALTAN min para abrir ($ABRE): que entre un candidato más cercano"
              exit 0
            fi
          fi
          echo "espera=$ESPERA" >> $GITHUB_OUTPUT

          # Ya cerrado (con su cola): tampoco se arranca.
          if [ "$MIN_CIERRA" -gt "$MIN_ABRE" ] && [ "$MIN_AHORA" -ge "$MIN_CIERRA" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "seguir=0" >> $GITHUB_OUTPUT
            echo "Ya ha cerrado ($CIERRA_G): no arranco"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "seguir=1" >> $GITHUB_OUTPUT
            echo "modo=${{ github.event.inputs.modo }}" >> $GITHUB_OUTPUT
            V="${{ github.event.inputs.ventana }}"
            if [ -z "$V" ]; then V="$VENTANA_ERP"; fi
            echo "ventana=$V" >> $GITHUB_OUTPUT
          else
            echo "seguir=1" >> $GITHUB_OUTPUT
            echo "modo=servicio" >> $GITHUB_OUTPUT
            echo "ventana=$VENTANA_ERP" >> $GITHUB_OUTPUT
          fi
          jq -n --arg d "$HOY · ventana $VENTANA_ERP (de $ORIGEN) · ahora $AHORA Madrid · espera ${ESPERA}s" \
            '{fuente:"robot_listo",estado:"job_ventana_sinqro",detalle:$d}' \
          | curl -s -X POST "$SB_URL/rest/v1/robot_log" \
              -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" \
              -H "Content-Type: application/json" --data-binary @- > /dev/null || true
          echo "Ventana del ERP: $VENTANA_ERP ($ORIGEN) · ahora $AHORA Madrid · espera ${ESPERA}s antes de arrancar"

      - uses: actions/checkout@v4
        if: steps.plan.outputs.seguir == '1'
        with:
          repository: Streatlab/binagre
          ref: trabajo
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        if: steps.plan.outputs.seguir == '1'
        with:
          node-version: "20"
          cache: "npm"
      - name: Instalar dependencias
        if: steps.plan.outputs.seguir == '1'
        run: npm install --no-audit --no-fund
      - name: Cache navegador Playwright
        id: cache-playwright
        if: steps.plan.outputs.seguir == '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Instalar navegador Playwright
        if: steps.plan.outputs.seguir == '1' && steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Dependencias de sistema (con cache)
        if: steps.plan.outputs.seguir == '1' && steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Pantalla virtual (xvfb)
        if: steps.plan.outputs.seguir == '1'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Credenciales Sinqro desde el ERP
        if: steps.plan.outputs.seguir == '1'
        run: |
          R=$(curl -sf "$SB_URL/rest/v1/robot_credenciales?plataforma=eq.sinqro&activo=eq.true&select=usuario,password&limit=1" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY")
          # `// empty` NO SE PUEDE QUITAR. Sin el, `jq -r` sobre un resultado vacio
          # devuelve el TEXTO "null", que es truthy: el 14-ago la fila de sinqro quedo
          # con activo=false y el robot estuvo mandando literalmente null/null al
          # formulario de Sinqro, 110 veces en 30 horas.
          U=$(echo "$R" | jq -r '.[0].usuario // empty'); P=$(echo "$R" | jq -r '.[0].password // empty')
          echo "::add-mask::$P"
          if [ -z "$U" ] || [ -z "$P" ]; then
            jq -n '{fuente:"robot_listo",estado:"job_sin_credencial_sinqro",detalle:"el turno muere: no hay credencial ACTIVA de sinqro en robot_credenciales"}' \
            | curl -s -X POST "$SB_URL/rest/v1/robot_log" \
                -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" \
                -H "Content-Type: application/json" --data-binary @- > /dev/null || true
            echo "::error::No hay credencial ACTIVA de sinqro en robot_credenciales (revisa activo)."
            exit 1
          fi
          echo "SINQRO_USER=$U" >> $GITHUB_ENV
          echo "SINQRO_PASS=$P" >> $GITHUB_ENV

      - name: Esperar a que abra el local
        if: steps.plan.outputs.seguir == '1' && steps.plan.outputs.espera != '0'
        run: |
          echo "El local aún no ha abierto. Espero ${{ steps.plan.outputs.espera }}s y arranco con la ventana abierta."
          sleep ${{ steps.plan.outputs.espera }}

      # continue-on-error: el fin de turno por presupuesto de tiempo es normal
      # (pasa el relevo al siguiente arranque). No es avería: no debe generar
      # correo de "Run failed". Las averías reales quedan en robot_log.
      - name: Vigilar y marcar (Sinqro)
        if: steps.plan.outputs.seguir == '1'
        continue-on-error: true
        env:
          MODO: ${{ steps.plan.outputs.modo }}
          FRENTE: "sinqro"
          # 17 s desde que el robot VE el pedido. Verificado el 30-ago.
          LISTO_TRAS_SEG: "17"
          BUCLE_MIN: "118"
          BUCLE_MAX: "251"
          # 29-ago (Rubén, orden literal): los CUATRO botones de la cadena se
          # pulsan de IZQUIERDA A DERECHA con cadencia ALEATORIA de 1 a 4 s.
          PAUSA_MIN_MS: "1000"
          PAUSA_MAX_MS: "4000"
          # CEDER RÁPIDO (30-ago): si ya hay alguien barriendo, el que llega se
          # va casi en el acto. Así el relevo no gasta runner ni roza a Sinqro.
          RELEVO_ESPERA_MAX_MIN: "2"
          MAX_MIN_JOB: "290"
          SITIO: "STREAT LAB"
          SUPABASE_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: xvfb-run -a npx tsx scripts/robot-ingesta/sinqro-listo.ts

      # ══════════════════════════════════════════════════════════════════════
      # EL RELEVO NO DEPENDE DE UN CRON (31-ago). Este turno llama al siguiente
      # por la API de GitHub: un `workflow_dispatch` se ejecuta siempre.
      #
      # GUARDA ANTI-BUCLE, IMPRESCINDIBLE: solo se encadena si este turno ha
      # durado MÁS DE 30 MINUTOS. Si murió antes (sesión, credencial, avería),
      # encadenar sería relanzarlo cada dos minutos y eso sí es cargar a Sinqro.
      # En ese caso no se encadena, se apunta el motivo y lo recoge el vigilante.
      # ══════════════════════════════════════════════════════════════════════
      - name: Encadenar el siguiente turno
        if: always() && steps.plan.outputs.seguir == '1'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -uo pipefail
          apuntar() {
            jq -nc --arg e "$1" --arg d "$2" '{fuente:"robot_listo",estado:$e,detalle:$d}' \
            | curl -s -X POST "$SB_URL/rest/v1/robot_log" \
                -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" \
                -H "Content-Type: application/json" --data-binary @- > /dev/null || true
          }
          T0=$(cat /tmp/t0 2>/dev/null || echo 0)
          DUR=$(( ( $(date -u +%s) - T0 ) / 60 ))
          AHORA=$(TZ=Europe/Madrid date +%H:%M)
          m() { echo $((10#${1%%:*}*60+10#${1##*:})); }
          MIN_AHORA=$(m "$AHORA")
          MIN_CIERRA=$(m "${{ steps.plan.outputs.cierre }}")
          [ "$MIN_CIERRA" -lt 300 ] && MIN_CIERRA=$((MIN_CIERRA+1440))

          if [ "$DUR" -lt 30 ]; then
            apuntar "relevo_no_encadenado_sinqro" "el turno solo ha durado ${DUR} min: no encadeno (sería relanzar en bucle). Que lo recoja el vigilante."
            exit 0
          fi
          if [ "$MIN_AHORA" -ge "$MIN_CIERRA" ]; then
            apuntar "fin_dia_sinqro" "turno de ${DUR} min terminado a las $AHORA, ya fuera de servicio: no encadeno"
            exit 0
          fi
          COD=$(curl -s -o /tmp/d.txt -w '%{http_code}' -X POST \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/sinqro-listo-glovo.yml/dispatches" \
            -H "Authorization: Bearer $GH_PAT" -H "Accept: application/vnd.github+json" \
            -d '{"ref":"main","inputs":{"modo":"servicio","ventana":""}}')
          if [ "$COD" = "204" ]; then
            apuntar "relevo_encadenado_sinqro" "turno de ${DUR} min terminado a las $AHORA · siguiente turno llamado a mano por la API, sin depender del cron"
          else
            apuntar "relevo_encadenado_ko_sinqro" "NO he podido llamar al siguiente turno (GitHub responde $COD): $(head -c 200 /tmp/d.txt) · quedan el cron y el vigilante"
          fi
