name: Just Eat · latido de sesión (plan C)

# 15-nov-2026 · PLAN C (decisión de Rubén: presupuesto 0 €, elige Vibe).
# La pasada en frío es la ÚNICA que toca la puerta dura de access.just-eat.es
# (Keycloak con parámetros), y desde el 9-nov esa puerta no perdona (66
# bloqueos_waf en 6 días; el calentamiento del 14-nov la cruzó una vez, la de
# re-login no). Este workflow NO ingesta: lanza justeat-detalle.ts con
# JE_LATIDO=1 para que el robot entre al hub, renueve la cookie y cierre.
# Con la sesión viva, las corridas normales no deberían necesitar login.
# Fichero NUEVO a propósito: no se toca justeat-detalle.yml (regla del 31-ago).
# Éxito medido en robot_log: latido_ok · y 0 bloqueo_waf en 7 días.
on:
  schedule:
    # 10:40, 16:40 y 22:40 UTC = 11:40, 17:40 y 23:40 en Madrid (invierno)
    - cron: "40 10,16,22 * * *"
  workflow_dispatch:
    inputs:
      salida:
        description: "Salida de red: warp | directa"
        type: string
        default: "warp"
  push:
    paths:
      - ".github/workflows/justeat-latido.yml"

concurrency:
  group: justeat-latido
  cancel-in-progress: false

jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SB_URL: https://eryauogxcpbgdryeimdq.supabase.co
      SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Fase 1 · arranque
        run: |
          cat > /tmp/apunta.sh <<'SH'
          apunta() {
            jq -n --arg e "$1" --arg d "$2" \
              '{fuente:"justeat_job",estado:$e,detalle:$d}' \
            | curl -s -X POST "$SB_URL/rest/v1/robot_log" \
                -H "apikey: $SB_KEY" \
                -H "Authorization: Bearer $SB_KEY" \
                -H "Content-Type: application/json" \
                --data-binary @- > /dev/null || true
          }
          SH
          chmod +x /tmp/apunta.sh
          source /tmp/apunta.sh
          apunta "latido_arranque" "job de latido iniciado ($(TZ=Europe/Madrid date '+%H:%M') Madrid, evento ${{ github.event_name }})"

      - name: Salir por WARP
        if: inputs.salida != 'directa'
        continue-on-error: true
        shell: bash +e {0}
        run: |
          source /tmp/apunta.sh
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list > /dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp > warp.log 2>&1
          sudo warp-cli --accept-tos registration new >> warp.log 2>&1
          sudo warp-cli --accept-tos connect >> warp.log 2>&1
          for i in $(seq 1 20); do
            TRACE=$(curl -s --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | tr '\n' ' ')
            case "$TRACE" in
              *"warp=on"*)
                apunta "warp_ok" "latido saliendo por WARP · $(echo "$TRACE" | cut -c1-140)"
                exit 0;;
            esac
            sleep 3
          done
          apunta "warp_ko" "latido: WARP no se ha conectado, sigo con la salida de siempre · $(tail -c 400 warp.log)"
          exit 0

      - uses: actions/checkout@v4
        with:
          repository: Streatlab/binagre
          ref: trabajo
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: |
          source /tmp/apunta.sh
          npm install --no-audit --no-fund > npm.log 2>&1 || { apunta "latido_npm_ko" "$(tail -c 800 npm.log)"; exit 1; }
          apunta "latido_npm_ok" "dependencias instaladas"

      - name: Caché del navegador Camoufox
        uses: actions/cache@v4
        with:
          path: ~/.cache/camoufox
          key: camoufox-${{ runner.os }}-0.5.9-beta41-v1

      - name: Instalar Camoufox
        run: |
          source /tmp/apunta.sh
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          (pip install --quiet "camoufox[geoip]" || pip install --quiet camoufox) > cam.log 2>&1 \
            || { apunta "latido_pip_ko" "$(tail -c 800 cam.log)"; exit 1; }
          BAJADO=0
          for INTENTO in 1 2 3 4 5; do
            if [ "$INTENTO" -ge 2 ]; then sudo warp-cli disconnect > /dev/null 2>&1 || true; sleep 5; fi
            if python -m camoufox fetch >> cam.log 2>&1; then BAJADO=1; break; fi
            apunta "latido_fetch_reintento" "intento $INTENTO de 5 fallido · $(tail -c 300 cam.log)"
            sleep $(( 20 * INTENTO ))
          done
          if [ "${{ inputs.salida }}" != "directa" ]; then
            sudo warp-cli --accept-tos connect > /dev/null 2>&1 || true
            for i in $(seq 1 20); do
              curl -s --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | grep -q "warp=on" && break
              sleep 3
            done
          fi
          apunta "latido_salida" "salida=${{ inputs.salida || 'warp' }} · $(curl -s --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(ip|warp)=' | tr '\n' ' ')"
          [ "$BAJADO" = "1" ] || { apunta "latido_fetch_ko" "$(tail -c 800 cam.log)"; exit 1; }
          VERCAM=$(python3 -c "import importlib.metadata as m; print(m.version('camoufox'))" 2>/dev/null || echo "?")
          apunta "latido_camoufox_ok" "camoufox instalado y descargado · version $VERCAM"

      - name: Alinear Playwright con el de Camoufox
        run: |
          source /tmp/apunta.sh
          VER=$(python3 -c "import importlib.metadata as m; print(m.version('playwright'))" 2>/dev/null || echo "")
          if [ -z "$VER" ]; then
            apunta "latido_sin_version" "no he podido leer la version de playwright de camoufox; sigo con la del repo"
          else
            npm install --no-save --no-audit --no-fund "playwright@$VER" "playwright-core@$VER" > pw.log 2>&1 \
              || { apunta "latido_pin_ko" "no he podido instalar playwright@$VER · $(tail -c 600 pw.log)"; exit 1; }
            apunta "latido_pin_ok" "cliente Playwright alineado: $VER"
          fi

      - name: Levantar el servidor de Camoufox
        shell: bash +e {0}
        run: |
          source /tmp/apunta.sh
          cat > servidor_camoufox.py <<'PY'
          import traceback
          from camoufox.server import launch_server

          PREFS = {
              "network.cookie.cookieBehavior": 0,
              "privacy.partition.network_state": False,
              "privacy.trackingprotection.enabled": False,
              "privacy.trackingprotection.pbmode.enabled": False,
          }

          BASE = dict(headless=False, os=["windows"], humanize=True,
                      geoip=True, port=4545, ws_path="binagre")

          INTENTOS = [
              ("cookies abiertas + permiso explicito",
               dict(firefox_user_prefs=PREFS, i_know_what_im_doing=True)),
              ("cookies abiertas", dict(firefox_user_prefs=PREFS)),
              ("sin tocar cookies", dict()),
          ]

          for nombre, extra in INTENTOS:
              try:
                  print(f"ARRANQUE probando: {nombre}", flush=True)
                  launch_server(**BASE, **extra)
                  break
              except Exception as e:
                  print(f"ARRANQUE fallo con '{nombre}': {type(e).__name__}: {e}", flush=True)
                  traceback.print_exc()
          PY
          nohup xvfb-run -a python servidor_camoufox.py > camoufox_servidor.log 2>&1 &
          echo $! > camoufox.pid

          cat > espera_puerto.py <<'PY'
          import socket, sys
          for fam, host in ((socket.AF_INET6, "::1"), (socket.AF_INET, "127.0.0.1")):
              s = socket.socket(fam, socket.SOCK_STREAM)
              s.settimeout(1)
              try:
                  s.connect((host, 4545))
                  print("[" + host + "]" if fam == socket.AF_INET6 else host)
                  sys.exit(0)
              except OSError:
                  pass
              finally:
                  s.close()
          sys.exit(1)
          PY

          HOST=""
          for i in $(seq 1 120); do
            if SALIDA=$(python3 espera_puerto.py); then
              HOST="$SALIDA"
              break
            fi
            if ! kill -0 "$(cat camoufox.pid)" 2>/dev/null; then
              apunta "latido_servidor_muerto" "$(grep ARRANQUE camoufox_servidor.log | tail -c 500) || $(tail -c 700 camoufox_servidor.log)"
              exit 1
            fi
            sleep 1
          done

          if [ -z "$HOST" ]; then
            apunta "latido_servidor_sin_puerto" "no escucha en 4545 tras 120s · $(tail -c 700 camoufox_servidor.log)"
            exit 1
          fi

          echo "CAMOUFOX_WS=ws://${HOST}:4545/binagre" >> $GITHUB_ENV
          MODO=$(grep "ARRANQUE probando" camoufox_servidor.log | tail -1)
          apunta "latido_camoufox_arriba" "escuchando en ${HOST}:4545 · $MODO"

      # 15-nov (Vibe, orden de Rubén «arréglalo ahora»): puerta de reconquista con
      # nodriver (Chrome real indetectable, prueba C de Máquina_7). Si la sesión está
      # muerta, nodriver intenta el login y deja la cookie en robot_tokens; el latido
      # de Camoufox de debajo arranca ya dentro. continue-on-error: si la puerta no
      # cruza, el latido sigue y lo deja medido en robot_log.
      # 15-nov (Vibe): Máquina_7 puso Just Eat en Chromium estándar (abrir() ya no usa
      # Camoufox para justeat). Sin este paso, el robot muere pidiendo el navegador.
      - name: Instalar Chromium
        run: |
          source /tmp/apunta.sh
          npx playwright install --with-deps chromium > pw-browser.log 2>&1 \
            || { apunta "latido_chromium_ko" "$(tail -c 800 pw-browser.log)"; exit 1; }
          apunta "latido_chromium_ok" "chromium instalado"

      - name: Puerta de reconquista con nodriver
        continue-on-error: true
        shell: bash +e {0}
        run: |
          source /tmp/apunta.sh
          pip install --quiet nodriver opencv-python-headless > nd.log 2>&1 \
            || { apunta "latido_nodriver_ko" "$(tail -c 600 nd.log)"; exit 0; }
          apunta "latido_nodriver" "sesión muerta o sin comprobar: intento la puerta con nodriver"
          timeout 300 xvfb-run -a python scripts/robot-ingesta/justeat-puerta-nodriver.py 2>&1 | tail -40

      - name: Latido de sesión (sin ingestar)
        env:
          SUPABASE_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JE_LATIDO: "1"
        run: |
          source /tmp/apunta.sh
          if [ -z "$CAMOUFOX_WS" ]; then
            apunta "latido_sin_camoufox" "CAMOUFOX_WS vacia: no arranco el robot para no salir con Chromium"
            exit 1
          fi
          apunta "latido_robot" "lanzando justeat-detalle.ts en modo latido contra $CAMOUFOX_WS"
          npx tsx scripts/robot-ingesta/justeat-detalle.ts 2>&1 | tee robot.log
          CODIGO=${PIPESTATUS[0]}
          if [ "$CODIGO" != "0" ]; then apunta "latido_robot_ko" "salida $CODIGO · $(tail -c 900 robot.log)"; exit "$CODIGO"; fi
          apunta "latido_robot_ok" "el latido ha terminado sin error"

      - name: Cierre
        if: always()
        run: |
          source /tmp/apunta.sh || true
          apunta "latido_fin" "job terminado con estado ${{ job.status }}" || true
          tail -60 camoufox_servidor.log || true
