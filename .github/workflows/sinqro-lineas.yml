name: Líneas de pedido Sinqro (Glovo + Just Eat)

# MUDADO desde Streatlab/binagre (02-ago): reloj público, código privado.
# vivo cada 10 min (candado horario_local del ERP) · diario 03:35 UTC ·
# arrastre manual con relevo automático.
# FIX 02-ago (2): el reloj con horas "8-23,0,1" no sonaba → cron 24h simple.
# FIX 02-ago (3) · ADIÓS CORREOS DE ERROR: cada tramo del arrastre acaba a
# propósito al agotar sus 24 min y eso pintaba la corrida en ROJO y mandaba un
# email de fallo por tramo, aunque los datos se guardan bien y el relevo sigue.
# Ahora ese final por presupuesto de tiempo NO marca la corrida como fallida
# (continue-on-error): mismos datos, mismo relevo, cero correos de sustos.
# palanca: 3
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "Modo"
        type: choice
        options: ["arrastre", "diario", "vivo"]
        default: "arrastre"
      desde:
        description: "Solo arrastre: desde (AAAA-MM-DD)"
        type: string
        default: "2026-06-01"
      hasta:
        description: "Solo arrastre: hasta (AAAA-MM-DD). Vacío = hoy"
        type: string
        default: ""
  push:
    paths:
      - ".github/workflows/sinqro-lineas.yml"
  schedule:
    - cron: "*/10 * * * *"
    - cron: "35 3 * * *"

permissions:
  actions: write
  contents: read

jobs:
  lineas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Candado (modo + horario de configuración del ERP)
        id: candado
        env:
          SB_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "seguir=1" >> $GITHUB_OUTPUT
            echo "modo=${{ github.event.inputs.modo }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "seguir=1" >> $GITHUB_OUTPUT
            echo "modo=diario" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ "${{ github.event.schedule }}" = "35 3 * * *" ]; then
            echo "seguir=1" >> $GITHUB_OUTPUT; echo "modo=diario" >> $GITHUB_OUTPUT; exit 0
          fi
          DOW=$(TZ=Europe/Madrid date +%u); H=$(TZ=Europe/Madrid date +%H); M=$(TZ=Europe/Madrid date +%M)
          AHORA=$((10#$H*60+10#$M))
          FILA=$(curl -sf "$SB_URL/rest/v1/horario_local?dia_semana=eq.$DOW&select=abre,cierra,cerrado" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" || echo '[]')
          ABRE=$(echo "$FILA" | jq -r '.[0].abre // empty' | cut -c1-5)
          CIERRA=$(echo "$FILA" | jq -r '.[0].cierra // empty' | cut -c1-5)
          CERRADO=$(echo "$FILA" | jq -r '.[0].cerrado // false')
          if [ -z "$ABRE" ] || [ -z "$CIERRA" ]; then ABRE="11:00"; CIERRA="00:00"; CERRADO="false"; fi
          if [ "$CERRADO" = "true" ]; then echo "seguir=0" >> $GITHUB_OUTPUT; echo "modo=" >> $GITHUB_OUTPUT; exit 0; fi
          A=$((10#${ABRE%%:*}*60+10#${ABRE##*:})); C=$((10#${CIERRA%%:*}*60+10#${CIERRA##*:}))
          C=$(( (C + 30) % 1440 ))
          dentro=0
          if [ "$A" -le "$C" ]; then
            if [ "$AHORA" -ge "$A" ] && [ "$AHORA" -lt "$C" ]; then dentro=1; fi
          else
            if [ "$AHORA" -ge "$A" ] || [ "$AHORA" -lt "$C" ]; then dentro=1; fi
          fi
          echo "seguir=$dentro" >> $GITHUB_OUTPUT
          if [ "$dentro" = "1" ]; then echo "modo=vivo" >> $GITHUB_OUTPUT; else echo "modo=" >> $GITHUB_OUTPUT; fi
          echo "Madrid $H:$M · horario $ABRE-$CIERRA(+30) · seguir=$dentro"

      - uses: actions/checkout@v4
        if: steps.candado.outputs.seguir == '1'
        with:
          repository: Streatlab/binagre
          ref: trabajo
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        if: steps.candado.outputs.seguir == '1'
        with:
          node-version: "20"
          cache: "npm"
      - name: Instalar dependencias
        if: steps.candado.outputs.seguir == '1'
        run: npm install --no-audit --no-fund
      - name: Cache navegador Playwright
        id: cache-playwright
        if: steps.candado.outputs.seguir == '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Instalar navegador Playwright
        if: steps.candado.outputs.seguir == '1' && steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Dependencias de sistema (con cache)
        if: steps.candado.outputs.seguir == '1' && steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Pantalla virtual (xvfb)
        if: steps.candado.outputs.seguir == '1'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Credenciales Sinqro desde el ERP
        if: steps.candado.outputs.seguir == '1'
        env:
          SB_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          R=$(curl -sf "$SB_URL/rest/v1/robot_credenciales?plataforma=eq.sinqro&activo=eq.true&select=usuario,password&limit=1" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY")
          U=$(echo "$R" | jq -r '.[0].usuario'); P=$(echo "$R" | jq -r '.[0].password')
          echo "::add-mask::$P"
          echo "SINQRO_USER=$U" >> $GITHUB_ENV
          echo "SINQRO_PASS=$P" >> $GITHUB_ENV

      - name: Ingesta de pedidos y líneas
        id: ingesta
        if: steps.candado.outputs.seguir == '1'
        continue-on-error: true
        env:
          MODO: ${{ steps.candado.outputs.modo }}
          DESDE: ${{ github.event.inputs.desde }}
          HASTA: ${{ github.event.inputs.hasta }}
          MAX_MIN: "24"
          SINQRO_SP: "6416"
          SUPABASE_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: xvfb-run -a npx tsx scripts/robot-ingesta/sinqro-lineas.ts

      - name: Relevo del arrastre
        if: >-
          !cancelled() &&
          steps.candado.outputs.modo == 'arrastre' &&
          steps.ingesta.outputs.quedan != '0' &&
          steps.ingesta.outputs.quedan != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Quedan ${{ steps.ingesta.outputs.quedan }} pedidos: lanzo relevo"
          gh workflow run sinqro-lineas.yml --repo ${{ github.repository }} \
            -f modo=arrastre \
            -f desde="${{ github.event.inputs.desde }}" \
            -f hasta="${{ github.event.inputs.hasta }}"
