name: Uber pantallas · pasada a mano desde una rama

# 19-ago-2026 · Los minutos de Actions de Streatlab/binagre están agotados: allí
# no arranca ni un runner desde primeros de agosto. Este reloj es el único sitio
# con minutos, y su corrida de los lunes (lunes-semanales.yml) siempre saca el
# código de la rama `trabajo`. Esto permite estrenar cambios del robot desde una
# rama concreta sin tocar `trabajo` ni esperar al lunes.
#
# Va en su propio archivo a propósito: la palanca de "tocar el archivo" en
# lunes-semanales.yml dispararía TAMBIÉN Rushour y precios de súper, que no
# pintan nada aquí.
#
# BUEN CIUDADANO. Una pasada, nunca en bucle. Antes de tocar la palanca hay que
# comprobar en robot_log que no hay otra pasada de Uber en marcha (regla 1:
# jamás dos sesiones de la misma cuenta a la vez).
# palanca: 3 (19-ago · fuera el sembrado: la sesión viva está en Storage)

on:
  push:
    paths:
      - ".github/workflows/uber-pantallas-rama.yml"
  workflow_dispatch:
    inputs:
      rama:
        description: "Rama de Streatlab/binagre"
        type: string
        default: "trabajo"
      forzar:
        description: "Repetir una semana ya dada por capturada"
        type: boolean
        default: false

concurrency:
  group: uber-pantallas
  cancel-in-progress: false

jobs:
  pantallas:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Streatlab/binagre
          ref: ${{ github.event.inputs.rama || 'claude/uber-screens-review-aq7xfw' }}
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm install --no-audit --no-fund
      # 19-ago: la primera corrida se quedó 26 min colgada en
      # "playwright install-deps" — apt esperando una respuesta que nadie iba a
      # darle. Se instala todo de una vez, sin interactivo y con tope de tiempo.
      - name: Cache navegador Playwright
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Navegador y dependencias
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb
          npx playwright install --with-deps chromium
      # Nada de sembrar la sesión aquí: sembrar-sesion-uber.ts es de un solo uso
      # (borra las cookies de robot_tokens al terminar) y ya se gastó el 09-ago.
      # La sesión viva está en Storage, en sesiones/uber__streatlab.json, y la
      # carga el propio robot. Si caduca, se resiembra con su propio workflow.
      - name: Mirar las pantallas y guardar lo que se ve
        env:
          UBER_PANTALLAS_MAX_MIN: "60"
          UBER_PANTALLAS_FORZAR: ${{ github.event.inputs.forzar == 'false' && '0' || '1' }}
          SUPABASE_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: xvfb-run -a npx tsx scripts/robot-ingesta/uber-pantallas.ts
      - name: Parsear a tablas lo capturado
        if: always()
        env:
          SUPABASE_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/robot-ingesta/uber-parsear.ts
