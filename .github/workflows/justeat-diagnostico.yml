name: Just Eat · diagnóstico Cloudflare (3 sondas)

# ══════════════════════════════════════════════════════════════════════════
# 29-ago-2026 · POR QUÉ EXISTE ESTE WORKFLOW.
#
# Desde el 22-ago todas las corridas de `justeat-detalle` mueren en el Cloudflare
# de Just Eat y SE DIO POR HECHO que es por la IP de datacenter de GitHub/Azure.
# Nunca se midió. Y la diferencia lo cambia todo:
#   · Si es la IP → ninguna herramienta de sigilo sirve; hay que cambiar de salida.
#   · Si es la HUELLA del navegador (headless detectado) → Camoufox lo arregla
#     gratis desde este mismo runner y el robot vuelve a la nube hoy mismo.
#
# ── PRIMERA MEDICIÓN (29-ago 11:13, IP 172.214.156.83) ────────────────────
# Camoufox recibió **200**, siguió el redirect hasta el login de Keycloak
# (access.just-eat.es/auth/realms/es/...) y se quedó en el interstitial
# "Un momento…" con `challenge-platform` en el HTML. NINGÚN código 1006/1007/1010.
# Traducción: la IP NO está baneada. Hay un managed challenge que no se resolvió
# porque solo se esperaron 8 s y en headless puro.
# Por eso esta versión: pantalla virtual (Xvfb) en vez de headless a secas, y
# espera activa de hasta 60 s a que el "Un momento…" se caiga solo.
# ══════════════════════════════════════════════════════════════════════════
on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL a sondear"
        type: string
        default: "https://access.just-eat.es/"
  push:
    paths:
      - ".github/workflows/justeat-diagnostico.yml"

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      URL: ${{ github.event.inputs.url || 'https://access.just-eat.es/' }}
      SB_URL: https://eryauogxcpbgdryeimdq.supabase.co
      SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Apuntar en el log que empieza el diagnóstico
        run: |
          IP=$(curl -s --max-time 10 https://api.ipify.org || echo '?')
          echo "IP_RUNNER=$IP" >> $GITHUB_ENV
          jq -n --arg d "sonda contra $URL desde la IP $IP (runner GitHub)" \
            '{fuente:"justeat_diag",estado:"inicio",detalle:$d}' \
          | curl -s -X POST "$SB_URL/rest/v1/robot_log" \
              -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" \
              -H "Content-Type: application/json" --data-binary @- > /dev/null

      # ── SONDA A · curl a pelo ────────────────────────────────────────────
      - name: Sonda A · curl a pelo
        continue-on-error: true
        run: |
          set +e
          curl -sSL -D cabeceras_a.txt -o cuerpo_a.html --max-time 45 \
            -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36' \
            -H 'Accept-Language: es-ES,es;q=0.9' \
            "$URL"
          echo "--- cabeceras ---"; cat cabeceras_a.txt 2>/dev/null
          echo "--- primeras líneas del cuerpo ---"; head -c 600 cuerpo_a.html 2>/dev/null
          exit 0

      # ── SONDA B · curl-impersonate (huella TLS de Chrome) ────────────────
      - name: Sonda B · curl-impersonate (Chrome)
        continue-on-error: true
        run: |
          set +e
          docker pull lwthiker/curl-impersonate:0.6-chrome > /dev/null 2>&1
          docker run --rm lwthiker/curl-impersonate:0.6-chrome \
            curl_chrome116 -sSL -D /dev/stderr -o /dev/null --max-time 45 "$URL" \
            > /dev/null 2> cabeceras_b.txt
          echo "--- cabeceras ---"; cat cabeceras_b.txt 2>/dev/null
          exit 0

      # ── SONDA C · Camoufox con pantalla virtual y espera al challenge ────
      - name: Preparar Camoufox y pantalla virtual
        continue-on-error: true
        run: |
          set +e
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          pip install --quiet "camoufox[geoip]" || pip install --quiet camoufox
          python -m camoufox fetch
          exit 0

      - name: Sonda C · Camoufox (virtual, espera hasta 60s)
        continue-on-error: true
        run: |
          set +e
          cat > sonda_c.py <<'PY'
          import json, os, re, time
          url = os.environ["URL"]
          out = {"sonda": "C camoufox virtual"}
          # "Un momento…" / "Just a moment" es el interstitial de Cloudflare.
          RE_ESPERA = re.compile(r"un momento|just a moment|checking your browser", re.I)
          try:
              from camoufox.sync_api import Camoufox
              # headless="virtual" levanta Xvfb: para Cloudflare es una pantalla real,
              # no un headless. Es la diferencia con la medición anterior.
              with Camoufox(headless="virtual", os=["windows"], locale="es-ES",
                            humanize=True, geoip=True) as navegador:
                  pagina = navegador.new_page()
                  respuesta = pagina.goto(url, wait_until="domcontentloaded", timeout=60000)
                  out["status"] = respuesta.status if respuesta else None
                  out["cf_ray"] = respuesta.headers.get("cf-ray") if respuesta else None

                  # Espera ACTIVA a que se caiga el interstitial: hasta 60 s.
                  segundos = 0
                  while segundos < 60:
                      titulo = pagina.title()
                      cuerpo = pagina.content()
                      retado = bool(RE_ESPERA.search(titulo)) or ("challenge-platform" in cuerpo)
                      if not retado:
                          break
                      pagina.wait_for_timeout(3000)
                      segundos += 3
                  out["segundos_esperando"] = segundos

                  cuerpo = pagina.content()
                  out["titulo"] = pagina.title()
                  out["url_final"] = pagina.url
                  out["sigue_retado"] = bool(RE_ESPERA.search(out["titulo"])) or ("challenge-platform" in cuerpo)
                  out["turnstile_widget"] = "cf-turnstile" in cuerpo
                  out["codigos_cloudflare"] = sorted(set(re.findall(r"Error code[^0-9]{0,10}(10\d\d)", cuerpo)))
                  out["hay_formulario_login"] = ("password" in cuerpo.lower()) or ("username" in cuerpo.lower())
                  out["tam_html"] = len(cuerpo)
                  out["cookies"] = sorted({c["name"] for c in pagina.context.cookies()})
                  pagina.screenshot(path="camoufox.png", full_page=True)
                  open("camoufox.html", "w").write(cuerpo)
          except Exception as e:
              out["error"] = f"{type(e).__name__}: {e}"
          print(json.dumps(out, ensure_ascii=False, indent=1))
          open("resultado_c.json", "w").write(json.dumps(out, ensure_ascii=False))
          PY
          python sonda_c.py
          exit 0

      - name: Guardar capturas y HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: justeat-diagnostico
          path: |
            camoufox.png
            camoufox.html
            cuerpo_a.html
            cabeceras_a.txt
            cabeceras_b.txt
            resultado_c.json
          if-no-files-found: ignore

      # ── VEREDICTO ────────────────────────────────────────────────────────
      - name: Veredicto a robot_log
        if: always()
        run: |
          set +e
          leer() { grep -i "^$1:" "$2" 2>/dev/null | tail -1 | tr -d '\r' | cut -d' ' -f2- ; }
          A_ST=$(grep -i '^HTTP/' cabeceras_a.txt 2>/dev/null | tail -1 | tr -d '\r')
          A_MIT=$(leer 'cf-mitigated' cabeceras_a.txt)
          A_COD=$(grep -o 'Error code[^0-9]\{0,10\}10[0-9][0-9]' cuerpo_a.html 2>/dev/null | head -1)
          B_ST=$(grep -i '^HTTP/' cabeceras_b.txt 2>/dev/null | tail -1 | tr -d '\r')
          C=$(cat resultado_c.json 2>/dev/null || echo '{"sonda":"C camoufox","error":"no llego a correr"}')

          VEREDICTO="sin concluir: mirar el artefacto justeat-diagnostico"
          if echo "$C" | grep -q '"hay_formulario_login": true' && echo "$C" | grep -q '"sigue_retado": false'; then
            VEREDICTO="ENTRA: Camoufox con pantalla virtual pasa el challenge y llega al login. El robot puede volver a la nube."
          elif echo "$C" | grep -q '"sigue_retado": true'; then
            VEREDICTO="CHALLENGE NO SUPERADO: sigue en el interstitial tras la espera. Toca cambiar de salida, no de disfraz."
          elif echo "$A_COD $A_MIT $B_ST" | grep -qE '100[67]|1010'; then
            VEREDICTO="BLOQUEO DURO (100x): la IP esta vetada."
          fi

          RESUMEN="$VEREDICTO || IP $IP_RUNNER · A[$A_ST cod=$A_COD] · B[$B_ST] · C=$C"
          echo "$RESUMEN"

          jq -n --arg d "$RESUMEN" '{fuente:"justeat_diag",estado:"veredicto",detalle:($d[0:4000])}' \
          | curl -s -X POST "$SB_URL/rest/v1/robot_log" \
              -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" \
              -H "Content-Type: application/json" --data-binary @- > /dev/null
          echo "Apuntado en robot_log (fuente justeat_diag)."
