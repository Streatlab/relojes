name: Glovo backfill (misión glovo-ventanas, puntual)

# Backfill manual de Glovo contra el portal real, usando el código de la
# misión glovo-ventanas (rama claude/glovo-ventanas-mission-lx5rjl en
# Streatlab/binagre, todavía sin fusionar a trabajo) — no el de producción.
# Mismo patrón que robots-plataformas.yml (headful + xvfb, PerimeterX lo pide).
on:
  workflow_dispatch:
    inputs:
      mes:
        description: "Mes o lista AAAA-MM separada por comas. Ej: 2026-07"
        type: string
        required: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Streatlab/binagre
          ref: claude/glovo-ventanas-mission-lx5rjl
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Cache navegador Playwright
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Instalar navegador Playwright
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Dependencias de sistema (con cache)
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Pantalla virtual (xvfb) para headful
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Ejecutar glovo.ts (backfill)
        env:
          MODO: backfill
          MES: ${{ github.event.inputs.mes }}
          SUPABASE_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: xvfb-run -a npx tsx scripts/robot-ingesta/glovo.ts
