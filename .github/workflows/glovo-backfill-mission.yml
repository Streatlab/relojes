name: Glovo backfill (misión glovo-ventanas, puntual)

# Backfill manual de Glovo contra el portal real. La misión glovo-ventanas
# y la automisión glovo-verdad-total ya se fusionaron a `trabajo` (11-ago):
# se apunta ahí, no a la rama de misión (ya obsoleta).
# Mismo patrón que robots-plataformas.yml (headful + xvfb, PerimeterX lo pide).
on:
  workflow_dispatch:
    inputs:
      mes:
        description: "Mes o lista AAAA-MM separada por comas. Ej: 2026-07"
        type: string
        required: true
      solo_historial:
        description: "true = solo historial() (reembolso_eur) — salta finanzas()/facturasAntiguas(), ya backfilleadas antes"
        type: boolean
        required: false
        default: false
      solo_reportes:
        description: "true = solo rendimiento() (Reportes Ventas/Operaciones/Clientes) — salta historial() y finanzas()"
        type: boolean
        required: false
        default: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Streatlab/binagre
          ref: trabajo
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Cache navegador Playwright
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Instalar navegador Playwright
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Dependencias de sistema (con cache)
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Pantalla virtual (xvfb) para headful
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Ejecutar glovo.ts (backfill)
        env:
          MODO: backfill
          MES: ${{ github.event.inputs.mes }}
          SOLO_HISTORIAL: ${{ github.event.inputs.solo_historial == 'true' && '1' || '' }}
          SOLO_REPORTES: ${{ github.event.inputs.solo_reportes == 'true' && '1' || '' }}
          SUPABASE_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: xvfb-run -a npx tsx scripts/robot-ingesta/glovo.ts
