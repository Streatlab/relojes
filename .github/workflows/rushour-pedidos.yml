name: Detalle pedidos Rushour (solo arrastre manual)

# 02-ago (3) · EL VIVO Y EL DIARIO YA NO VIVEN AQUÍ: el cron de GitHub en repos
# nuevos tarda horas en arrancar y no es de fiar para un pulso de 5 minutos.
# Ahora corren en Supabase (edge function rushour-pedidos-vivo + reloj pg_cron,
# jobs 67 y 68), puntual y gratis, con el horario_local del ERP dentro.
# Aquí queda SOLO el botón manual para arrastres históricos largos.
on:
  workflow_dispatch:
    inputs:
      dias:
        description: "Días hacia atrás para el modo arrastre"
        type: string
        default: "60"
      modo:
        description: "vivo | diario | arrastre"
        type: choice
        options: ["arrastre", "diario", "vivo"]
        default: "arrastre"

jobs:
  manual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Streatlab/binagre
          ref: trabajo
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Ingesta manual
        env:
          MODO: ${{ github.event.inputs.modo }}
          DIAS: ${{ github.event.inputs.dias }}
          SUPABASE_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/robot-ingesta/rushour-pedidos.ts
