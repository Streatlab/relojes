name: Detalle pedidos Rushour (vivo + diario)

# MUDADO desde Streatlab/binagre (02-ago). Reloj público, código privado.
# Sin navegador; el script lee sus credenciales de robot_credenciales él solo.
# FIX 02-ago (2): el reloj con horas "8-23,0,1" no sonaba (GitHub lo ignoraba).
# Ahora el vivo suena cada 5 min las 24h y el candado corta fuera de horario.
# palanca: 2
on:
  workflow_dispatch:
    inputs:
      dias:
        description: "Días hacia atrás para el modo arrastre"
        type: string
        default: "60"
      modo:
        description: "vivo | diario | arrastre"
        type: choice
        options: ["arrastre", "diario", "vivo"]
        default: "arrastre"
  push:
    paths:
      - ".github/workflows/rushour-pedidos.yml"
  schedule:
    - cron: "*/5 * * * *"
    - cron: "30 3 * * *"

jobs:
  vivo:
    if: github.event_name == 'schedule' && github.event.schedule != '30 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Candado por horario de configuración del ERP
        id: candado
        env:
          SB_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          DOW=$(TZ=Europe/Madrid date +%u); H=$(TZ=Europe/Madrid date +%H); M=$(TZ=Europe/Madrid date +%M)
          AHORA=$((10#$H*60+10#$M))
          FILA=$(curl -sf "$SB_URL/rest/v1/horario_local?dia_semana=eq.$DOW&select=abre,cierra,cerrado" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" || echo '[]')
          ABRE=$(echo "$FILA" | jq -r '.[0].abre // empty' | cut -c1-5)
          CIERRA=$(echo "$FILA" | jq -r '.[0].cierra // empty' | cut -c1-5)
          CERRADO=$(echo "$FILA" | jq -r '.[0].cerrado // false')
          if [ -z "$ABRE" ] || [ -z "$CIERRA" ]; then ABRE="11:00"; CIERRA="00:00"; CERRADO="false"; fi
          if [ "$CERRADO" = "true" ]; then echo "seguir=0" >> $GITHUB_OUTPUT; exit 0; fi
          A=$((10#${ABRE%%:*}*60+10#${ABRE##*:})); C=$((10#${CIERRA%%:*}*60+10#${CIERRA##*:}))
          C=$(( (C + 30) % 1440 ))
          dentro=0
          if [ "$A" -le "$C" ]; then
            if [ "$AHORA" -ge "$A" ] && [ "$AHORA" -lt "$C" ]; then dentro=1; fi
          else
            if [ "$AHORA" -ge "$A" ] || [ "$AHORA" -lt "$C" ]; then dentro=1; fi
          fi
          echo "seguir=$dentro" >> $GITHUB_OUTPUT
          echo "Madrid $H:$M · horario $ABRE-$CIERRA(+30) · seguir=$dentro"
      - uses: actions/checkout@v4
        if: steps.candado.outputs.seguir == '1'
        with:
          repository: Streatlab/binagre
          ref: trabajo
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        if: steps.candado.outputs.seguir == '1'
        with:
          node-version: "20"
          cache: "npm"
      - name: Instalar dependencias
        if: steps.candado.outputs.seguir == '1'
        run: npm install --no-audit --no-fund
      - name: Ingesta vivo (hoy, +ayer de madrugada)
        if: steps.candado.outputs.seguir == '1'
        env:
          MODO: vivo
          SUPABASE_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/robot-ingesta/rushour-pedidos.ts

  diario:
    if: (github.event_name == 'schedule' && github.event.schedule == '30 3 * * *') || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Streatlab/binagre
          ref: trabajo
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Ingesta diaria (ayer + hoy)
        env:
          MODO: diario
          SUPABASE_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/robot-ingesta/rushour-pedidos.ts

  manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Streatlab/binagre
          ref: trabajo
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Ingesta manual
        env:
          MODO: ${{ github.event.inputs.modo }}
          DIAS: ${{ github.event.inputs.dias }}
          SUPABASE_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/robot-ingesta/rushour-pedidos.ts
