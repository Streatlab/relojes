name: Glovo · lector del horario del local

# ══════════════════════════════════════════════════════════════════════════
# 30-ago-2026 · ESTE ROBOT ES EL QUE MANDA SOBRE TODOS LOS DEMÁS.
#
# Ley de Rubén: «el robot entra cada día, todos los días, y cada día es único,
# cada día es hoy. Mira el horario de hoy y en función de eso lo mete en el ERP.
# Y todos los robots trabajan únicamente durante ese día conforme a eso. Mañana
# volverá a mirarlo por la mañana, porque a veces cambiamos los horarios. Solo
# puedes trabajar durante el horario de apertura, nunca más. Como mucho, once
# minutos después de cada turno. Los turnos son corridos o partidos, pero eso lo
# pone claro Glovo.»
#
# Y sobre el dato que falta: «si falta el horario de hoy porque está cerrado,
# pues está cerrado, no des vueltas». Y: «si Glovo no funciona, que me avise y
# me pida que marque yo el horario».
#
# QUÉ SIGNIFICA ESO AQUÍ. Lo que este robot escribe en `horario_dia` (una fila
# por FECHA, con los TRAMOS de ese día) es lo ÚNICO que leen el Robot Listo de
# Rushour, el de Sinqro y cualquier robot de servicio. Si este robot no escribe
# hoy, HOY NO TRABAJA NADIE: `ventanaServicio.ts` da el día por cerrado. No hay
# respaldo semanal, a propósito — un horario de "todos los martes" no es el
# horario de hoy.
#
# O sea: si este reloj se cae, se cae el marcado de pedidos. Es el más crítico
# de todos. Por eso pasa cada media hora Y por eso el último paso avisa a
# Rubén por correo pidiéndole que meta el horario a mano
# (`avisar-sin-horario.ts`). Nadie inventa un horario para tapar el hueco: se
# avisa y se espera al horario de verdad, venga de Glovo o de Rubén.
#
# LO QUE CAMBIÓ EL 30-ago EN EL SCRIPT (glovo-horario.ts):
#   · escribe en `horario_dia` (fecha + tramos), no en el semanal;
#   · GUARDA LOS TRAMOS ENTEROS: "12:00-16:15 y 20:00-23:45" son dos tramos, no
#     un 12:00→23:45 aplanado que ponía a los robots a trabajar en mitad del
#     cierre de tarde — con Sinqro eso es romper su autorización por escrito;
#   · ANOTA SIEMPRE, no solo si pilla el local abierto en ese instante. Con la
#     regla vieja, un robot que entra por la mañana no escribía nunca nada: el
#     30-ago la única escritura del día fue a las 17:07.
#
# ══════════════════════════════════════════════════════════════════════════
# 31-ago-2026 · DOS FALLOS EL MISMO DÍA, LOS DOS CORREGIDOS.
#
# FALLO A · LEYÓ EL HORARIO DE OTRO NEGOCIO. La pasada de las 03:05 escribió
# "hoy CERRADO" con el local abierto. Lo que leyó era la tabla de `posmodernos`
# (cerrado de lunes a miércoles), porque el clic sobre el desplegable no entró y
# nadie lo comprobaba. ARREGLO: ya no se toca el desplegable. Se entra POR URL
# directamente al local BINAGRE (`?vendor=GV_ES;578570`), que es el primero y el
# que el portal abre por defecto, y antes de escribir se comprueba que la
# pantalla es de un local nuestro. Si enseña otro negocio, no se escribe nada.
# Y nunca se escribe un cierre si hoy ya hay pedidos en el ERP: un local con
# pedidos no está cerrado.
#
# FALLO B · SOLO HUBO UNA PASADA EN TODA LA MAÑANA. De las seis que tocaban
# antes de mediodía solo entró la de las 03:05: GitHub retrasa y descarta crons
# cuando su cola está llena. Doce citas fijas al día no son suficientes si la
# mitad no se presenta. Ahora se llama CADA MEDIA HORA durante toda la jornada:
# la lectura cuesta dos minutos y así ningún descarte deja el día sin horario.
# ══════════════════════════════════════════════════════════════════════════
#
# QUÉ LOCAL SE LEE (orden de Rubén, 31-ago): BINAGRE, el primero. Todos los
# locales de Streat Lab replican el mismo horario, así que da igual cuál sea
# MIENTRAS SEA UNO DE LOS NUESTROS. El desplegable trae además negocios ajenos
# con otro horario, y esos son los que no pueden colarse.
#
# CRONS EN UTC. `0,30 4-23` UTC cubre de las 06:00 a las 01:30 hora de Madrid en
# verano (CEST = UTC+2) y de las 05:00 a las 00:30 en invierno (CET = UTC+1).
# En los dos casos queda cubierto el día entero de servicio con margen sobrado.
#
# POR QUÉ TANTAS PASADAS: porque el horario CAMBIA durante el día. Medido el
# 22-ago: el sábado pasó de "12:30-23:00" a "11:30-23:00" y luego a
# "12:00-16:15" en la misma jornada. Cada pasada reescribe el día de hoy con lo
# que Glovo diga en ese momento, que es la verdad vigente.
#
# MODO: `servicio` en los disparos automáticos y en push (escribe). A mano se
# puede lanzar en `reconocimiento`, que vuelca el DOM a robot_debug y deja en
# robot_log lo que ha entendido SIN tocar nada.
#
# Mismo patrón headful+xvfb que el resto de robots de plataforma (PerimeterX).

on:
  schedule:
    - cron: "0,30 4-23 * * *"
  # PALANCA: tocar este archivo lanza una lectura YA, en modo servicio. Hace
  # falta porque si el horario de hoy no está escrito, no trabaja ningún robot:
  # esperar al siguiente cron sería perder el servicio.
  push:
    paths:
      - ".github/workflows/glovo-horario.yml"
  workflow_dispatch:
    inputs:
      modo:
        description: "reconocimiento (vuelca y no escribe) | servicio (escribe horario_dia)"
        type: choice
        options: ["reconocimiento", "servicio"]
        default: "reconocimiento"
      cuenta:
        description: "Cuenta de Glovo (vacío = streatlab)"
        type: string
        required: false
      local:
        description: "Nombre del local para el plan B (vacío = Binagre)"
        type: string
        required: false
      vendor:
        description: "Id del local en la URL (vacío = GV_ES;578570, Binagre)"
        type: string
        required: false

# Una lectura cada vez. Con una cita cada media hora, si una se retrasa no se
# puede juntar con la siguiente peleando por la misma pantalla.
concurrency:
  group: glovo-horario
  cancel-in-progress: false

jobs:
  horario:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Streatlab/binagre
          ref: trabajo
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Cache navegador Playwright
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Instalar navegador Playwright
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Dependencias de sistema (con cache)
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Pantalla virtual (xvfb) para headful
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Leer el horario de Glovo
        continue-on-error: true
        env:
          # Los disparos automáticos y el push ESCRIBEN: ese es el sentido del
          # robot. La verdad es la del portal, no la que haya escrita a mano.
          MODO: ${{ (github.event_name == 'schedule' || github.event_name == 'push') && 'servicio' || github.event.inputs.modo }}
          CUENTA: ${{ github.event.inputs.cuenta || 'streatlab' }}
          # BINAGRE por URL directa: ni un clic en el desplegable, que es donde
          # el 31-ago se coló el horario de otro negocio.
          VENDOR: ${{ github.event.inputs.vendor || 'GV_ES;578570' }}
          LOCAL: ${{ github.event.inputs.local || 'Binagre' }}
          SUPABASE_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: xvfb-run -a npx tsx scripts/robot-ingesta/glovo-horario.ts

      # SI NO HAY HORARIO DE HOY, SE LE PIDE A RUBÉN (30-ago, petición suya).
      # `continue-on-error` arriba está puesto a propósito: aunque la lectura
      # falle, este paso TIENE que correr — es el que avisa. Manda un solo
      # correo al día y no inventa ningún horario.
      - name: Avisar a Rubén si hoy no hay horario
        if: always()
        env:
          SUPABASE_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/robot-ingesta/avisar-sin-horario.ts
