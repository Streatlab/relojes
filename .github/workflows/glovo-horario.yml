name: Glovo · lector del horario del local

# 21-ago-2026 · MISION-sinqro-cadencia (TAREA 3).
#
# POR QUÉ. `horario_local` es la fuente única de horas de todos los robots
# (_lib/ventanaServicio.ts). Hasta hoy la rellenaba Rubén a mano y, si se le
# olvidaba, el Robot Listo trabajaba con el horario de reserva (11:00-00:00) en
# vez de con el de verdad. El horario real vive en el portal de Glovo. Esto lo
# trae solo.
#
# El horario es el MISMO en todas las plataformas y locales (se replican entre
# sí): con leer UN local válido basta. La cuenta madre «Paellas La Tradicione»
# no funciona y el script la excluye siempre.
#
# CADENCIA PEDIDA POR RUBÉN (22-ago-2026): mirar a las 8, 9, 10 y 12 de la
# mañana, y de ahí en adelante cada dos horas. Hora de Madrid.
#
# CRONS EN UTC, servicio pensado en HORA ESPAÑOLA (verano, CEST = UTC+2):
#   06,07,08 UTC → 08,09,10 España   (las tres de la mañana temprano)
#   10,12,14,16,18,20,22 UTC → 12,14,16,18,20,22,00 España (cada 2 h)
# En invierno (CET = UTC+1) todo cae una hora antes en local; para un horario
# que cambia como mucho una vez al mes es de sobra, y no compensa duplicar crons.
#
# POR QUÉ TANTAS PASADAS: de esta tabla sale la ventana de servicio del Robot
# Listo. El robot mira Glovo y SOLO cuando ve el local abierto lo anota en la
# configuración del ERP; lo que no ve abierto no lo toca (ver `escribir()` en
# glovo-horario.ts). Cuanto antes se entere de que hoy se abre, antes empieza a
# marcar el Robot Listo.
#
# MODO: por defecto `servicio` en los disparos automáticos (escribe la tabla).
# A mano se puede lanzar en `reconocimiento`, que vuelca el DOM a robot_debug y
# deja en robot_log lo que ha entendido SIN tocar horario_local.
#
# Mismo patrón headful+xvfb que el resto de robots de plataforma (PerimeterX).

on:
  schedule:
    - cron: "0 6,7,8,10,12,14,16,18,20,22 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "reconocimiento (vuelca y no escribe) | servicio (escribe horario_local)"
        type: choice
        options: ["reconocimiento", "servicio"]
        default: "reconocimiento"
      cuenta:
        description: "Cuenta de Glovo (vacío = la primera activa)"
        type: string
        required: false
      local:
        description: "Forzar un local concreto (vacío = el primero válido)"
        type: string
        required: false

jobs:
  horario:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Streatlab/binagre
          ref: trabajo
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Cache navegador Playwright
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Instalar navegador Playwright
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Dependencias de sistema (con cache)
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Pantalla virtual (xvfb) para headful
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Leer el horario de Glovo
        env:
          # Los disparos automáticos ESCRIBEN: ese es el sentido del robot. El horario
          # puede cambiar a media mañana y los robots tienen que enterarse para dejar
          # de entrar en Rushour y Sinqro cuando el local está cerrado. La verdad es
          # la del portal, no la que haya escrita a mano.
          MODO: ${{ github.event_name == 'schedule' && 'servicio' || github.event.inputs.modo }}
          CUENTA: ${{ github.event.inputs.cuenta || 'streatlab' }}
          LOCAL: ${{ github.event.inputs.local }}
          SUPABASE_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: xvfb-run -a npx tsx scripts/robot-ingesta/glovo-horario.ts
