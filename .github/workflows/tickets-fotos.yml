name: Fotos de tickets de cocina (cada 15 min en horario del ERP)

# MUDADO desde Streatlab/binagre (03-ago-2026).
# CAUSA: el cron vivía en vercel.json con "*/15 * * * *" y el plan Hobby de Vercel
# solo admite crons DIARIOS → Vercel RECHAZABA TODOS los builds del ERP en silencio
# y producción se quedó congelada 13 horas. En binagre quedó a 1 vez/día; el pulso
# real de 15 min vive aquí, que no tiene ese límite.
#
# QUÉ HACE: llama al endpoint del ERP que sincroniza la carpeta de Drive
# "Tickets-Cocina": da de alta las fotos nuevas, les pasa el OCR (código de pedido,
# plataforma, marca, importe, hora) y purga las resubidas. Sirve para encontrar al
# instante la foto del ticket al reclamar un reembolso a Uber/Glovo/Just Eat.
#
# El candado consulta horario_local (configuración del ERP) + 30 min de gracia:
# fuera de servicio no se gasta nada.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/tickets-fotos.yml"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Candado por horario de configuración del ERP
        id: candado
        env:
          SB_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "seguir=1" >> $GITHUB_OUTPUT; exit 0; fi
          DOW=$(TZ=Europe/Madrid date +%u); H=$(TZ=Europe/Madrid date +%H); M=$(TZ=Europe/Madrid date +%M)
          AHORA=$((10#$H*60+10#$M))
          FILA=$(curl -sf "$SB_URL/rest/v1/horario_local?dia_semana=eq.$DOW&select=abre,cierra,cerrado" -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" || echo '[]')
          ABRE=$(echo "$FILA" | jq -r '.[0].abre // empty' | cut -c1-5)
          CIERRA=$(echo "$FILA" | jq -r '.[0].cierra // empty' | cut -c1-5)
          CERRADO=$(echo "$FILA" | jq -r '.[0].cerrado // false')
          if [ -z "$ABRE" ] || [ -z "$CIERRA" ]; then ABRE="11:00"; CIERRA="00:00"; CERRADO="false"; fi
          if [ "$CERRADO" = "true" ]; then echo "seguir=0" >> $GITHUB_OUTPUT; echo "Hoy cerrado según configuración"; exit 0; fi
          A=$((10#${ABRE%%:*}*60+10#${ABRE##*:})); C=$((10#${CIERRA%%:*}*60+10#${CIERRA##*:}))
          C=$(( (C + 30) % 1440 ))
          dentro=0
          if [ "$A" -le "$C" ]; then
            if [ "$AHORA" -ge "$A" ] && [ "$AHORA" -lt "$C" ]; then dentro=1; fi
          else
            if [ "$AHORA" -ge "$A" ] || [ "$AHORA" -lt "$C" ]; then dentro=1; fi
          fi
          echo "seguir=$dentro" >> $GITHUB_OUTPUT
          echo "Madrid $H:$M · horario $ABRE-$CIERRA(+30) · seguir=$dentro"

      - name: Sincronizar fotos de tickets (endpoint del ERP)
        if: steps.candado.outputs.seguir == '1'
        run: |
          RESP=$(curl -sS --max-time 120 -w "\n%{http_code}" "https://binagre.vercel.app/api/tickets-fotos?action=sync")
          CODE=$(echo "$RESP" | tail -n1)
          BODY=$(echo "$RESP" | sed '$d')
          echo "HTTP $CODE"
          echo "$BODY"
          if [ "$CODE" != "200" ]; then echo "::error::La sincronización de fotos de tickets falló (HTTP $CODE)"; exit 1; fi
