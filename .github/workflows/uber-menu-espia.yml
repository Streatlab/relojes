name: Uber · espía Menú (carta publicada, a mano)

# 16-oct-2026 · Misión analisis-de-productos-no-rentables-por-marca-cody.
# Una pasada SOLO LECTURA: entra con la sesión sembrada, abre el Menú de las
# tiendas pedidas y guarda JSON + texto en uber_pantallas (pantalla menu_espia)
# y las capturas de pantalla como artifact. Sin reloj: el push a este archivo
# es la palanca. Comparte candado con uber-pantallas (una sesión a la vez).
# palanca: 1

on:
  push:
    paths:
      - ".github/workflows/uber-menu-espia.yml"
  workflow_dispatch:
    inputs:
      marcas:
        description: "Marcas a espiar (regex) o * para todas"
        type: string
        default: "ninja\\s*ramen|comida\\s*casera"
      max:
        description: "Tiendas como mucho"
        type: string
        default: "2"

concurrency:
  group: uber-pantallas
  cancel-in-progress: false

jobs:
  espia:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Streatlab/binagre
          ref: trabajo
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm install --no-audit --no-fund
      - name: Cache navegador Playwright
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Navegador y dependencias
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb
          npx playwright install --with-deps chromium
      - name: Espiar el Menú
        env:
          UBER_MENU_MARCAS: ${{ github.event.inputs.marcas || 'ninja\s*ramen|comida\s*casera' }}
          UBER_MENU_MAX: ${{ github.event.inputs.max || '2' }}
          SUPABASE_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: xvfb-run -a npx tsx scripts/robot-ingesta/uber-menu-espia.ts
      - name: Capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uber-menu-espia
          path: capturas/
          retention-days: 14
