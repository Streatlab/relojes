name: Aviso · pedidos sin foto del ticket

# 25-sep-2026 · Orden de Rubén: el 100 % de los pedidos debe llevar foto del
# ticket. Cada 30 min en horario de servicio busca pedidos entregados hace más
# de 30 min que siguen sin foto y manda UN WhatsApp al encargado de turno.
# Cada pedido se avisa una sola vez. Corre aquí (no en Vercel) por el límite de
# funciones del plan Hobby.
on:
  schedule:
    # CAMBIO DE HORA (30-sep-2026): ventana UTC ancha (10:00-00:59 UTC) y candado de
    # hora Madrid (12:00-01:59) en el primer paso: igual en verano que en invierno.
    - cron: "*/30 10-23,0 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/aviso-fotos-faltan.yml"

concurrency:
  group: aviso-fotos-faltan
  cancel-in-progress: false

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Candado hora Madrid (12:00-01:59)
        id: candado
        run: |
          H=$(TZ=Europe/Madrid date +%H | sed 's/^0//')
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$H" -ge 12 ] || [ "$H" -le 1 ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"; echo "Fuera de servicio (${H}h Madrid): no aviso."
          fi
      - if: steps.candado.outputs.go == 'true'
        uses: actions/checkout@v4
        with:
          repository: Streatlab/binagre
          ref: master
          token: ${{ secrets.GH_PAT }}
      - if: steps.candado.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - if: steps.candado.outputs.go == 'true'
        run: npm install --no-audit --no-fund
      - name: Enlazar fotos y avisar de las que faltan
        if: steps.candado.outputs.go == 'true'
        env:
          SUPABASE_URL: https://eryauogxcpbgdryeimdq.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/robot-ingesta/aviso-fotos-faltan.ts
